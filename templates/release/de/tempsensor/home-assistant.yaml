template: homeassistant
product:
  identifier: home-assistant
  brand: Home Assistant
  group: Generische Unterstützung
requirements: ["skiptest"]
description: |
  Home Assistant Instanzen in deinem Netzwerk werden automatisch erkannt und passende Entitäten (z.B. `sensor.*`) werden vorgeschlagen.
render:
  - default: |
      type: template
      template: homeassistant
      uri: http://homeassistant.local:8123 # Home Assistant URI
      temp: sensor.boiler_temperature # Temperaturentität, Entitäts-ID für Temperaturmessung in °C
    advanced: |
      type: template
      template: homeassistant
      uri: http://homeassistant.local:8123 # Home Assistant URI
      temp: sensor.boiler_temperature # Temperaturentität, Entitäts-ID für Temperaturmessung in °C
      insecure: # Selbstsignierte Zertifikate akzeptieren, optional
params:
  - name: uri
    example: http://homeassistant.local:8123
    default:
    choice: []
    unit:
    description: Home Assistant URI
    help:
    advanced: false
    optional: false
  - name: temp
    example: sensor.boiler_temperature
    default:
    choice: []
    unit:
    description: Temperaturentität
    help: Entitäts-ID für Temperaturmessung in °C
    advanced: false
    optional: false
  - name: insecure
    example:
    default:
    choice: []
    unit:
    description: Selbstsignierte Zertifikate akzeptieren
    help:
    advanced: true
    optional: true