template: foxess-evc
product:
  identifier: foxess-ac-ev-charger-modbus
  brand: FoxESS
  description: AC EV Charger (Modbus)
capabilities: ["mA", "rfid", "meter", "1p3p"]
requirements: ["sponsorship"]
description: |
  In der Fox Switch App muss der Arbeitsmodus auf "Modbus TCP" gestellt werden. Wie eine Ladesession beginnt, bestimmt der in der Wallbox eingestellte Betriebsmodus - entweder per App bzw. RFID-Karte oder automatisch beim Anstecken starten.
render:
  - default: |
      type: template
      template: foxess-evc

      # Modbus TCP
      modbus: tcpip
      id: 1
      host:  # Hostname
      port: 502 # Port
params:
  - name: modbus
    example:
    default:
    choice: ['tcpip']
    unit:
    description: Modbus Typ
    help:
    advanced: false
    optional: false
modbus:
  delay:
  host:
  id: 1
  modbus: tcpip
  port: 502
  tcpip: true
  timeout: