template: tuya-depow
product:
  identifier: de-portable-ev-charger
  brand: dé
  description: Portable EV Charger
capabilities: ["meter", "dim"]
requirements: ["sponsorship"]
description: |
  Lokale Verbindung über das Tuya-Protokoll. Unterstützt werden Geräte mit der Tuya-Produkt-ID `gxrtu5vljdthtd3g` oder `witok7vhhjohtr02` (App: „dé EV Charger“).
  Device ID und Local Key müssen einmalig ermittelt werden, z. B. mit `tinytuya wizard`, das dafür ein Konto auf der Tuya-IoT-Plattform benötigt. Im Betrieb ist kein Cloud-Zugang nötig. Das Gerät erlaubt nur eine lokale Verbindung gleichzeitig, andere lokale Integrationen (z. B. LocalTuya, Tuya Local) müssen deaktiviert werden.
  Der Ladevorgang wird über den Start-/Stopp-Befehl der Wallbox gestartet und pausiert. Ein Zeitplan in der App muss deaktiviert sein, da er den Ladevorgang außerhalb seines Zeitfensters blockiert.

render:
  - default: |
      type: template
      template: tuya-depow
      host: 192.0.2.2 # IP-Adresse oder Hostname
      id: # Device ID
      localkey: # Local Key
params:
  - name: host
    example: 192.0.2.2
    default:
    choice: []
    unit:
    description: IP-Adresse oder Hostname
    help:
    advanced: false
    optional: false
  - name: id
    example:
    default:
    choice: []
    unit:
    description: Device ID
    help:
    advanced: false
    optional: false
  - name: localkey
    example:
    default:
    choice: []
    unit:
    description: Local Key
    help:
    advanced: false
    optional: false