template: ocpp-grizzl-e
product:
  identifier: grizzl-e-mini-connect
  brand: Grizzl-E
  description: Mini Connect
capabilities: ["dim"]
requirements: ["sponsorship", "skiptest"]
description: |
  Die OCPP-Funktion der Wallbox muss aktiviert sein. Falls nicht, wende dich an den Grizzl-E Support.

  Anleitung:
  * In der Weboberfläche der Wallbox die OCPP-Server-URL `ws://<evcc-host>:8887/` eintragen. "Data" leer lassen, "Station ID" und "Auth key" unverändert lassen.
  * Minimalen Ladestrom auf 7 A setzen. Die Wallbox ignoriert kleinere Vorgaben.
  * Beim Fahrzeug "1A Ladestromvorgabe" aktivieren. Die Wallbox unterstützt nur ganzzahlige Ladeströme.

  "Remote-Transaktion bei Fahrzeugverbindung starten" ist immer aktiv.

  Sobald die OCPP-Konfiguration der Wallbox auf evcc zeigt, zeigt die Hersteller-App keine Daten der Wallbox mehr an. Damit die Daten weiterhin in der Hersteller-App sichtbar sind:
  * In evcc eine OCPP-Weiterleitung mit der Upstream-Server-URL `wss://ocpp.unitedchargers.com/ocpp1.6` sowie Benutzername und Passwort aus der OCPP-Konfiguration der Wallbox einrichten.
  * In den erweiterten Einstellungen der Weiterleitung "Befehle vom Upstream-Server blockieren" aktivieren.
  * In den erweiterten Einstellungen der Wallbox "Authentifizierungs-Token" auf `uc_default_auth` setzen.

render:
  - default: |
      type: template
      template: ocpp-grizzl-e
      stationid: EVB-P12354 # Station ID, Eindeutige Wallbox-Kennung. Wird automatisch erkannt, sobald sich die Wallbox verbindet. (optional)
    advanced: |
      type: template
      template: ocpp-grizzl-e
      stationid: EVB-P12354 # Station ID, Eindeutige Wallbox-Kennung. Wird automatisch erkannt, sobald sich die Wallbox verbindet. (optional)
      connector: 1 # Anschlussnummer, Bei Ladestationen mit mehreren Anschlüssen. Zählung beginnt bei 1. (optional)
      chargingprofile: TxDefaultProfile # Ladeprofiltyp, TxProfile nur verwenden, wenn die Wallbox Änderungen an TxDefaultProfile während einer laufenden Transaktion ignoriert. Ohne Transaktion wird weiterhin TxDefaultProfile verwendet; eine laufende Transaktion muss ihre ID melden. TxProfile endet mit der Transaktion. Das Standardprofil wird beim nächsten Regelzyklus wiederhergestellt. Ist evcc dabei offline, kann die Wallbox bis zur Wiederverbindung ohne dieses Limit laden. [TxDefaultProfile, TxProfile] (optional)
      remotestart: # Remote-Transaktion bei Fahrzeugverbindung starten, Diese Option nur aktivieren wenn keinerlei Möglichkeit besteht Transaktionen seitens des Ladepunktes zu initiieren! Das ist nur der Fall wenn z. B. kein RFID-Lesegerät vorhanden ist und Ladevorgänge grundsätzlich einzeln per App freigeschaltet werden müssten. Normalerweise sollte der Ladepunkt am Gerät immer so konfiguriert werden, dass entweder eine RFID-Karte zur Freischaltung verwendet wird oder der Ladepunkt auf "Autostart", "Freies Laden" o.ä. eingestellt ist. Zunächst die Dokumentation und die Konfigurationsmöglichkeiten des Ladepunktes prüfen, ggf. beim Hersteller nachfragen! (Verwendet OCPP RemoteStartTransaction) (optional)
      idtag: uc_default_auth # Authentifizierungs-Token, Diese Option ist nur in Ausnahmefällen erforderlich wenn der Ladepunkt für die Annahme externer Transaktionen einen spezifischen Token erfordert. (Verwendet OCPP RemoteStartTransaction) (optional)
      connecttimeout: 5m # Zeitlimit für die Registrierung, Zeitlimit für die Registrierung des Ladepunktes (optional)
      meterinterval: 10s # Übertragungsintervall der Zählerwerte, Zeitintervall für die Übertragung der Zählerwerte (MeterValueSampleInterval) (optional)
      metervalues: Energy.Active.Import.Register,Power.Active.Import,SoC,Current.Offered,Power.Offered,Current.Import,Voltage # Zählerwerte für die Übertragung, Manuelle Vorgabe der zu konfigurierenden Zählerwerte (MeterValuesSampledData) (optional)
params:
  - name: stationid
    example: EVB-P12354
    default:
    choice: []
    unit:
    description: Station ID
    help: Eindeutige Wallbox-Kennung. Wird automatisch erkannt, sobald sich die Wallbox verbindet.
    advanced: false
    optional: true
  - name: connector
    example:
    default: 1
    choice: []
    unit:
    description: Anschlussnummer
    help: Bei Ladestationen mit mehreren Anschlüssen. Zählung beginnt bei 1.
    advanced: true
    optional: true
  - name: chargingprofile
    example:
    default: TxDefaultProfile
    choice: ['TxDefaultProfile', 'TxProfile']
    unit:
    description: Ladeprofiltyp
    help: TxProfile nur verwenden, wenn die Wallbox Änderungen an TxDefaultProfile während einer laufenden Transaktion ignoriert. Ohne Transaktion wird weiterhin TxDefaultProfile verwendet; eine laufende Transaktion muss ihre ID melden. TxProfile endet mit der Transaktion. Das Standardprofil wird beim nächsten Regelzyklus wiederhergestellt. Ist evcc dabei offline, kann die Wallbox bis zur Wiederverbindung ohne dieses Limit laden.
    advanced: true
    optional: true
  - name: remotestart
    example:
    default:
    choice: []
    unit:
    description: Remote-Transaktion bei Fahrzeugverbindung starten
    help: Diese Option nur aktivieren wenn keinerlei Möglichkeit besteht Transaktionen seitens des Ladepunktes zu initiieren! Das ist nur der Fall wenn z. B. kein RFID-Lesegerät vorhanden ist und Ladevorgänge grundsätzlich einzeln per App freigeschaltet werden müssten. Normalerweise sollte der Ladepunkt am Gerät immer so konfiguriert werden, dass entweder eine RFID-Karte zur Freischaltung verwendet wird oder der Ladepunkt auf "Autostart", "Freies Laden" o.ä. eingestellt ist. Zunächst die Dokumentation und die Konfigurationsmöglichkeiten des Ladepunktes prüfen, ggf. beim Hersteller nachfragen! (Verwendet OCPP RemoteStartTransaction)
    advanced: true
    optional: true
  - name: idtag
    example: evcc
    default: uc_default_auth
    choice: []
    unit:
    description: Authentifizierungs-Token
    help: Diese Option ist nur in Ausnahmefällen erforderlich wenn der Ladepunkt für die Annahme externer Transaktionen einen spezifischen Token erfordert. (Verwendet OCPP RemoteStartTransaction)
    advanced: true
    optional: true
  - name: connecttimeout
    example:
    default: 5m
    choice: []
    unit:
    description: Zeitlimit für die Registrierung
    help: Zeitlimit für die Registrierung des Ladepunktes
    advanced: true
    optional: true
  - name: meterinterval
    example:
    default: 10s
    choice: []
    unit:
    description: Übertragungsintervall der Zählerwerte
    help: Zeitintervall für die Übertragung der Zählerwerte (MeterValueSampleInterval)
    advanced: true
    optional: true
  - name: metervalues
    example: Energy.Active.Import.Register,Power.Active.Import,SoC,Current.Offered,Power.Offered,Current.Import,Voltage
    default:
    choice: []
    unit:
    description: Zählerwerte für die Übertragung
    help: Manuelle Vorgabe der zu konfigurierenden Zählerwerte (MeterValuesSampledData)
    advanced: true
    optional: true