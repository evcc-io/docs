template: lambda-zewotherm
product:
  identifier: lambda-eu-l-series
  brand: Lambda
  description: EU-L Serie
  group: Wärmeerzeuger
capabilities: ["meter", "dim"]
description: |
  Energiemanagementeinstellungen am Gerät:

  - E-Meter Kommunikationsart: "ModBus Client"
  - E-Meter Messpunkt: "E-Eintrag"

render:
  - default: |
      type: template
      template: lambda-zewotherm

      # Modbus TCP
      modbus: tcpip
      id: 1
      host:  # Hostname
      port: 502 # Port
      tempsource: # Temperaturquelle, [warmwater_top, warmwater_bottom, buffer_top, buffer_bottom] (optional)
      firmware: <1.1.3 # Firmware version. Wähle '>=1.1.3' für Word-Swap, [<1.1.3, >=1.1.3] (optional)
    advanced: |
      type: template
      template: lambda-zewotherm

      # Modbus TCP
      modbus: tcpip
      id: 1
      host:  # Hostname
      port: 502 # Port
      tempsource: # Temperaturquelle, [warmwater_top, warmwater_bottom, buffer_top, buffer_bottom] (optional)
      firmware: <1.1.3 # Firmware version. Wähle '>=1.1.3' für Word-Swap, [<1.1.3, >=1.1.3] (optional)
      excess: plus # veraltet, bei neg. E-Überschuss auf minus, [plus, minus] (optional)
      watchdog: 60s # Watchdog, optional
params:
  - name: modbus
    example:
    default:
    choice: ['tcpip']
    unit:
    description: Modbus Typ
    help:
    advanced: false
    optional: false
  - name: tempsource
    example:
    default:
    choice: ['warmwater_top', 'warmwater_bottom', 'buffer_top', 'buffer_bottom']
    unit:
    description: Temperaturquelle
    help:
    advanced: false
    optional: true
  - name: firmware
    example:
    default: <1.1.3
    choice: ['<1.1.3', '>=1.1.3']
    unit:
    description: Firmware version. Wähle '>=1.1.3' für Word-Swap
    help:
    advanced: false
    optional: true
  - name: excess
    example:
    default: plus
    choice: ['plus', 'minus']
    unit:
    description: veraltet, bei neg. E-Überschuss auf minus
    help:
    advanced: true
    optional: true
  - name: watchdog
    example:
    default: 60s
    choice: []
    unit:
    description: Watchdog
    help:
    advanced: true
    optional: true
modbus:
  delay:
  host:
  id: 1
  modbus: tcpip
  port: 502
  tcpip: true
  timeout: