template: solvis
product:
  identifier: solvis-solviscontrol-2-3
  brand: Solvis
  description: SolvisControl 2/3
  group: Wärmeerzeuger
capabilities: ["meter"]
description: |
  Modbus TCP muss am SolvisControl unter „Einstellungen / Netzwerk“ aktiviert sein.
  Die Ansteuerung erfolgt über die Warmwasser-Solltemperatur.
  Eine Leistungsreduzierung (dim) unterstützt der Regler nicht.

render:
  - default: |
      type: template
      template: solvis

      # Modbus TCP
      modbus: tcpip
      id: 1
      host:  # Hostname
      port: 502 # Port
      tempsource: warmwater # Temperaturquelle, [warmwater, buffer]
      tempnormal: 48 # Solltemperatur Normalbetrieb, optional
      tempboost: 60 # Solltemperatur Boost, optional
params:
  - name: modbus
    example:
    default:
    choice: ['tcpip']
    unit:
    description: Modbus Typ
    help:
    advanced: false
    optional: false
  - name: tempsource
    example:
    default: warmwater
    choice: ['warmwater', 'buffer']
    unit:
    description: Temperaturquelle
    help:
    advanced: false
    optional: false
  - name: tempnormal
    example:
    default: 48
    choice: []
    unit:
    description: Solltemperatur Normalbetrieb
    help:
    advanced: false
    optional: true
  - name: tempboost
    example:
    default: 60
    choice: []
    unit:
    description: Solltemperatur Boost
    help:
    advanced: false
    optional: true
modbus:
  delay:
  host:
  id: 1
  modbus: tcpip
  port: 502
  tcpip: true
  timeout: