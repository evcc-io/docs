template: fnn-shelly-i4
product:
  identifier: shelly-i4-dc-gen3
  brand: Shelly
  description: i4 DC Gen3
description: |
  Die Schaltkontakte der Steuerbox werden an die Eingänge SW1 bis SW4 angeschlossen. Alle verwendeten Eingänge müssen in der Shelly-App bzw. im Webinterface als Eingangstyp "Schalter" konfiguriert sein, nicht als "Taster".
render:
  - default: |
      type: template
      template: fnn-shelly-i4
      host: 192.0.2.2 # IP-Adresse oder Hostname
      maxconsumptionpower: # Garantierte Mindestleistung (Pmin) (W), Leistungsbegrenzung des Hauptstromkreises während die Limitierung aktiv ist.
      w4input: 1 # W4-Eingang, Nummer des Eingangs für das W4-Signal (Dimmen der steuerbaren Verbrauchseinrichtungen), 1 bis 4 (SW1 = 1)
      w3input: 2 # W3-Eingang, Nummer des Eingangs für das W3-Signal (Keine Netzeinspeisung, 0%), 1 bis 4 (SW1 = 1)
      password: # Passwort, Nur erforderlich, wenn am Gerät die Authentifizierung aktiviert ist (Benutzer ist immer admin) (optional)
      productionnominalmax: # Installierte Generatorleistung (Wp), Gesamtnennleistung bzw. Modul- oder Generatorleistung der Anlage (Bezugsgröße nach § 9 EEG). (optional)
      s1input: 3 # S1-Eingang, Nummer des Eingangs für das S1-Signal (Reduzierung der Einspeiseleistung auf 60%), 1 bis 4 (SW1 = 1) (optional)
      s2input: 4 # S2-Eingang, Nummer des Eingangs für das S2-Signal (Reduzierung der Einspeiseleistung auf 30%), 1 bis 4 (SW1 = 1) (optional)
params:
  - name: host
    example: 192.0.2.2
    default:
    choice: []
    unit:
    description: IP-Adresse oder Hostname
    help:
    advanced: false
    optional: false
  - name: maxconsumptionpower
    example:
    default:
    choice: []
    unit: W
    description: Garantierte Mindestleistung (Pmin)
    help: Leistungsbegrenzung des Hauptstromkreises während die Limitierung aktiv ist.
    advanced: false
    optional: false
  - name: w4input
    example:
    default: 1
    choice: []
    unit:
    description: W4-Eingang
    help: Nummer des Eingangs für das W4-Signal (Dimmen der steuerbaren Verbrauchseinrichtungen), 1 bis 4 (SW1 = 1)
    advanced: false
    optional: false
  - name: w3input
    example:
    default: 2
    choice: []
    unit:
    description: W3-Eingang
    help: Nummer des Eingangs für das W3-Signal (Keine Netzeinspeisung, 0%), 1 bis 4 (SW1 = 1)
    advanced: false
    optional: false
  - name: password
    example:
    default:
    choice: []
    unit:
    description: Passwort
    help: Nur erforderlich, wenn am Gerät die Authentifizierung aktiviert ist (Benutzer ist immer admin)
    advanced: false
    optional: true
  - name: productionnominalmax
    example:
    default:
    choice: []
    unit: Wp
    description: Installierte Generatorleistung
    help: Gesamtnennleistung bzw. Modul- oder Generatorleistung der Anlage (Bezugsgröße nach § 9 EEG).
    advanced: false
    optional: true
  - name: s1input
    example: 3
    default:
    choice: []
    unit:
    description: S1-Eingang
    help: Nummer des Eingangs für das S1-Signal (Reduzierung der Einspeiseleistung auf 60%), 1 bis 4 (SW1 = 1)
    advanced: false
    optional: true
  - name: s2input
    example: 4
    default:
    choice: []
    unit:
    description: S2-Eingang
    help: Nummer des Eingangs für das S2-Signal (Reduzierung der Einspeiseleistung auf 30%), 1 bis 4 (SW1 = 1)
    advanced: false
    optional: true