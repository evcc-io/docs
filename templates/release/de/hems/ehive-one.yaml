template: ehive-one-fnn
product:
  identifier: ehive-one
  brand: eHive
  description: One
description: |
  Erfordert ioManager 1.1.3 oder neuer. Die Schaltkontakte der Steuerbox werden an die Digitaleingänge DI1 und DI2 angeschlossen.
render:
  - default: |
      type: template
      template: ehive-one-fnn
      host: 127.0.0.1 # IP-Adresse oder Hostname
      maxconsumptionpower: # Garantierte Mindestleistung (Pmin) (W), Leistungsbegrenzung des Hauptstromkreises während die Limitierung aktiv ist. Erforderlich, wenn ein Eingang W4 zugeordnet ist. (optional)
      productionnominalmax: 10000 # Installierte Generatorleistung (Wp), Gesamtnennleistung bzw. Modul- oder Generatorleistung der Anlage (Bezugsgröße nach § 9 EEG). Erforderlich, wenn ein Eingang W3, S1 oder S2 zugeordnet ist. (optional)
      di1function: w4 # DI1-Signal, W4 (Dimmen der steuerbaren Verbrauchseinrichtungen), W3 (Keine Netzeinspeisung, 0%), S1 (Reduzierung der Einspeiseleistung auf 60%), S2 (Reduzierung der Einspeiseleistung auf 30%) oder unbenutzt [w4, w3, s1, s2, unused] (optional)
      di2function: unused # DI2-Signal, W4 (Dimmen der steuerbaren Verbrauchseinrichtungen), W3 (Keine Netzeinspeisung, 0%), S1 (Reduzierung der Einspeiseleistung auf 60%), S2 (Reduzierung der Einspeiseleistung auf 30%) oder unbenutzt [w4, w3, s1, s2, unused] (optional)
    advanced: |
      type: template
      template: ehive-one-fnn
      host: 127.0.0.1 # IP-Adresse oder Hostname
      maxconsumptionpower: # Garantierte Mindestleistung (Pmin) (W), Leistungsbegrenzung des Hauptstromkreises während die Limitierung aktiv ist. Erforderlich, wenn ein Eingang W4 zugeordnet ist. (optional)
      productionnominalmax: 10000 # Installierte Generatorleistung (Wp), Gesamtnennleistung bzw. Modul- oder Generatorleistung der Anlage (Bezugsgröße nach § 9 EEG). Erforderlich, wenn ein Eingang W3, S1 oder S2 zugeordnet ist. (optional)
      di1function: w4 # DI1-Signal, W4 (Dimmen der steuerbaren Verbrauchseinrichtungen), W3 (Keine Netzeinspeisung, 0%), S1 (Reduzierung der Einspeiseleistung auf 60%), S2 (Reduzierung der Einspeiseleistung auf 30%) oder unbenutzt [w4, w3, s1, s2, unused] (optional)
      di2function: unused # DI2-Signal, W4 (Dimmen der steuerbaren Verbrauchseinrichtungen), W3 (Keine Netzeinspeisung, 0%), S1 (Reduzierung der Einspeiseleistung auf 60%), S2 (Reduzierung der Einspeiseleistung auf 30%) oder unbenutzt [w4, w3, s1, s2, unused] (optional)
      port: 3000 # Port, optional
      di1activelow: # DI1 invertiert (active low), Signal ist aktiv, solange der Eingang false meldet. (optional)
      di2activelow: # DI2 invertiert (active low), Signal ist aktiv, solange der Eingang false meldet. (optional)
      maxage: 5s # Maximales Messwertalter, Ältere oder ungültige Messwerte werden verworfen. Muss länger als das Erfassungsintervall des ioManagers sein. (optional)
      cache: 1s # Cache, Zeitintervall für erneute Datenabfrage (optional)
params:
  - name: host
    example: 192.0.2.2
    default: 127.0.0.1
    choice: []
    unit:
    description: IP-Adresse oder Hostname
    help:
    advanced: false
    optional: false
  - name: maxconsumptionpower
    example:
    default:
    choice: []
    unit: W
    description: Garantierte Mindestleistung (Pmin)
    help: Leistungsbegrenzung des Hauptstromkreises während die Limitierung aktiv ist. Erforderlich, wenn ein Eingang W4 zugeordnet ist.
    advanced: false
    optional: true
  - name: productionnominalmax
    example: 10000
    default:
    choice: []
    unit: Wp
    description: Installierte Generatorleistung
    help: Gesamtnennleistung bzw. Modul- oder Generatorleistung der Anlage (Bezugsgröße nach § 9 EEG). Erforderlich, wenn ein Eingang W3, S1 oder S2 zugeordnet ist.
    advanced: false
    optional: true
  - name: di1function
    example:
    default: w4
    choice: ['w4', 'w3', 's1', 's2', 'unused']
    unit:
    description: DI1-Signal
    help: W4 (Dimmen der steuerbaren Verbrauchseinrichtungen), W3 (Keine Netzeinspeisung, 0%), S1 (Reduzierung der Einspeiseleistung auf 60%), S2 (Reduzierung der Einspeiseleistung auf 30%) oder unbenutzt
    advanced: false
    optional: true
  - name: di2function
    example:
    default: unused
    choice: ['w4', 'w3', 's1', 's2', 'unused']
    unit:
    description: DI2-Signal
    help: W4 (Dimmen der steuerbaren Verbrauchseinrichtungen), W3 (Keine Netzeinspeisung, 0%), S1 (Reduzierung der Einspeiseleistung auf 60%), S2 (Reduzierung der Einspeiseleistung auf 30%) oder unbenutzt
    advanced: false
    optional: true
  - name: port
    example:
    default: 3000
    choice: []
    unit:
    description: Port
    help:
    advanced: true
    optional: true
  - name: di1activelow
    example:
    default:
    choice: []
    unit:
    description: DI1 invertiert (active low)
    help: Signal ist aktiv, solange der Eingang false meldet.
    advanced: true
    optional: true
  - name: di2activelow
    example:
    default:
    choice: []
    unit:
    description: DI2 invertiert (active low)
    help: Signal ist aktiv, solange der Eingang false meldet.
    advanced: true
    optional: true
  - name: maxage
    example:
    default: 5s
    choice: []
    unit:
    description: Maximales Messwertalter
    help: Ältere oder ungültige Messwerte werden verworfen. Muss länger als das Erfassungsintervall des ioManagers sein.
    advanced: true
    optional: true
  - name: cache
    example: 5m
    default: 1s
    choice: []
    unit:
    description: Cache
    help: Zeitintervall für erneute Datenabfrage
    advanced: true
    optional: true