template: fnn-shelly-i3
product:
  identifier: shelly-i3
  brand: Shelly
  description: i3
description: |
  Die Schaltkontakte der Steuerbox werden an die Eingänge SW1 bis SW3 angeschlossen. Mit drei Eingängen ist standardmäßig nur die Einspeisebegrenzung (W3, S1, S2) belegt. Für das Dimmen der steuerbaren Verbrauchseinrichtungen (W4) muss ein Eingang umgewidmet werden.
render:
  - default: |
      type: template
      template: fnn-shelly-i3
      host: 192.0.2.2 # IP-Adresse oder Hostname
      w3input: 1 # W3-Eingang, Nummer des Eingangs für das W3-Signal (Keine Netzeinspeisung, 0%), 1 bis 3 (SW1 = 1)
      user: # Benutzerkonto, Nur erforderlich, wenn am Gerät die Authentifizierung aktiviert ist (optional)
      password: # Passwort, Zugangspasswort des Dienstes (optional)
      productionnominalmax: # Installierte Generatorleistung (Wp), Gesamtnennleistung bzw. Modul- oder Generatorleistung der Anlage (Bezugsgröße nach § 9 EEG). (optional)
      s1input: 2 # S1-Eingang, Nummer des Eingangs für das S1-Signal (Reduzierung der Einspeiseleistung auf 60%), 1 bis 3 (SW1 = 1) (optional)
      s2input: 3 # S2-Eingang, Nummer des Eingangs für das S2-Signal (Reduzierung der Einspeiseleistung auf 30%), 1 bis 3 (SW1 = 1) (optional)
    advanced: |
      type: template
      template: fnn-shelly-i3
      host: 192.0.2.2 # IP-Adresse oder Hostname
      w3input: 1 # W3-Eingang, Nummer des Eingangs für das W3-Signal (Keine Netzeinspeisung, 0%), 1 bis 3 (SW1 = 1)
      user: # Benutzerkonto, Nur erforderlich, wenn am Gerät die Authentifizierung aktiviert ist (optional)
      password: # Passwort, Zugangspasswort des Dienstes (optional)
      productionnominalmax: # Installierte Generatorleistung (Wp), Gesamtnennleistung bzw. Modul- oder Generatorleistung der Anlage (Bezugsgröße nach § 9 EEG). (optional)
      s1input: 2 # S1-Eingang, Nummer des Eingangs für das S1-Signal (Reduzierung der Einspeiseleistung auf 60%), 1 bis 3 (SW1 = 1) (optional)
      s2input: 3 # S2-Eingang, Nummer des Eingangs für das S2-Signal (Reduzierung der Einspeiseleistung auf 30%), 1 bis 3 (SW1 = 1) (optional)
      w4input: # W4-Eingang, Nummer des Eingangs für das W4-Signal (Dimmen der steuerbaren Verbrauchseinrichtungen), 1 bis 3 (SW1 = 1). Standardmäßig nicht belegt. (optional)
      maxconsumptionpower: # Garantierte Mindestleistung (Pmin) (W), Leistungsbegrenzung des Hauptstromkreises während die Limitierung aktiv ist. Erforderlich, wenn W4 belegt ist. (optional)
params:
  - name: host
    example: 192.0.2.2
    default:
    choice: []
    unit:
    description: IP-Adresse oder Hostname
    help:
    advanced: false
    optional: false
  - name: w3input
    example:
    default: 1
    choice: []
    unit:
    description: W3-Eingang
    help: Nummer des Eingangs für das W3-Signal (Keine Netzeinspeisung, 0%), 1 bis 3 (SW1 = 1)
    advanced: false
    optional: false
  - name: user
    example:
    default:
    choice: []
    unit:
    description: Benutzerkonto
    help: Nur erforderlich, wenn am Gerät die Authentifizierung aktiviert ist
    advanced: false
    optional: true
  - name: password
