template: frank-energie
product:
  identifier: frank-energie
  brand: Frank Energie
  group: Dynamischer Strompreis
countries: ["NL"]
requirements: ["skiptest"]
description: |
  Dynamische Preise aus der öffentlichen Frank Energie API, keine Anmeldung erforderlich. Bezug liefert den All-in-Preis inklusive Energiesteuer, Aufschlag und Mehrwertsteuer. Einspeisung liefert den reinen Marktpreis, nutze `charges`, `tax` oder `formula` für die Einspeisegebühr oder den Bonus deines Vertrags. Ist `charges`, `tax` oder `formula` gesetzt, wird auch der Bezug aus dem reinen Marktpreis berechnet.
render:
  - default: |
      type: template
      template: frank-energie
      tariffDirection: import # Tarifrichtung, Verwende 'export' für den Einspeisetarif. Frank zahlt den Marktpreis plus eine Einkaufsvergütung (inkoopvergoeding), mit Slim Terugleveren tagsüber zusätzlich einen Bonus von etwa 15%. Trage die aktuelle Vergütung als `formula` ein, z.B. `price + 0.0182` oder mit Slim Terugleveren `price * 1.15 + 0.0182`. [import, export] (optional)
    advanced: |
      type: template
      template: frank-energie
      tariffDirection: import # Tarifrichtung, Verwende 'export' für den Einspeisetarif. Frank zahlt den Marktpreis plus eine Einkaufsvergütung (inkoopvergoeding), mit Slim Terugleveren tagsüber zusätzlich einen Bonus von etwa 15%. Trage die aktuelle Vergütung als `formula` ein, z.B. `price + 0.0182` oder mit Slim Terugleveren `price * 1.15 + 0.0182`. [import, export] (optional)
      charges: # Aufschlag, Zusätzlicher fester Aufschlag pro kWh (optional)
      chargesZones: # Aufschlagszonen, Zeitabhängige Aufschläge, die den Standardaufschlag überschreiben. (optional)
      tax: # Steuer, Zusätzlicher prozentualer Aufschlag (z.B. 0.2 für 20%) (optional)
      formula: math.Max((price + charges) * (1 + tax), 0.0) # Formel, Individuelle Formel zur Berechnung des Preises (optional)
      average: # Stündliche Durchschnittskosten verwenden, optional
params:
  - name: tariffDirection
    example:
    default: import
    choice: ['import', 'export']
    unit:
    description: Tarifrichtung
    help: Verwende 'export' für den Einspeisetarif. Frank zahlt den Marktpreis plus eine Einkaufsvergütung (inkoopvergoeding), mit Slim Terugleveren tagsüber zusätzlich einen Bonus von etwa 15%. Trage die aktuelle Vergütung als `formula` ein, z.B. `price + 0.0182` oder mit Slim Terugleveren `price * 1.15 + 0.0182`.
    advanced: false
    optional: true
  - name: charges
    example:
    default:
    choice: []
    unit:
    description: Aufschlag
    help: Zusätzlicher fester Aufschlag pro kWh
    advanced: true
    optional: true
  - name: chargesZones
    example:
    default:
    choice: []
    unit:
    description: Aufschlagszonen
    help: Zeitabhängige Aufschläge, die den Standardaufschlag überschreiben.
    advanced: true
    optional: true
  - name: tax
    example:
    default:
    choice: []
    unit:
    description: Steuer
    help: Zusätzlicher prozentualer Aufschlag (z.B. 0.2 für 20%)
    advanced: true
    optional: true
  - name: formula
    example: math.Max((price + charges) * (1 + tax), 0.0)
    default:
    choice: []
    unit:
    description: Formel
    help: Individuelle Formel zur Berechnung des Preises
    advanced: true
    optional: true
  - name: average
    example:
    default:
    choice: []
    unit:
    description: Stündliche Durchschnittskosten verwenden
    help:
    advanced: true
    optional: true