template: dwd-temperature
product:
  identifier: dwd-bright-sky-temperature
  brand: DWD (Bright Sky) Temperature
  group: Temperaturvorhersage
requirements: ["skiptest"]
description: |
  Außentemperaturprognose auf Basis von MOSMIX-Daten des Deutschen Wetterdienstes (DWD), bereitgestellt als JSON über die freie [Bright Sky](https://brightsky.dev) API. Kein API-Schlüssel erforderlich.
render:
  - default: |
      type: template
      template: dwd-temperature
      lat: 55.7351 # Breitengrad
      lon: 9.1275 # Längengrad
    advanced: |
      type: template
      template: dwd-temperature
      lat: 55.7351 # Breitengrad
      lon: 9.1275 # Längengrad
      interval: 1h # Intervall, optional
params:
  - name: lat
    example: 55.7351
    default:
    choice: []
    unit:
    description: Breitengrad
    help:
    advanced: false
    optional: false
  - name: lon
    example: 9.1275
    default:
    choice: []
    unit:
    description: Längengrad
    help:
    advanced: false
    optional: false
  - name: interval
    example:
    default: 1h
    choice: []
    unit:
    description: Intervall
    help:
    advanced: true
    optional: true