template: stromligning
product:
  identifier: stromligning
  brand: Strømligning
  group: Dynamischer Strompreis
countries: ["DK"]
requirements: ["skiptest"]
render:
  - default: |
      type: template
      template: stromligning
      apikey: # API Key
      supplierid: radius_c # Grid supplier ID
      pricetype: consumption # Price type, [consumption, production] (optional)
      productid: enkel_energi-enkel_kvartal # Product ID, optional
      customergroupid: C_egenproducent # Customer group ID, optional
      agreementstart: '2025-03-01' # Agreement start, optional
    advanced: |
      type: template
      template: stromligning
      apikey: # API Key
      supplierid: radius_c # Grid supplier ID
      pricetype: consumption # Price type, [consumption, production] (optional)
      productid: enkel_energi-enkel_kvartal # Product ID, optional
      customergroupid: C_egenproducent # Customer group ID, optional
      agreementstart: '2025-03-01' # Agreement start, optional
      charges: # Aufschlag, Zusätzlicher fester Aufschlag pro kWh (optional)
      chargesZones: # Aufschlagszonen, Zeitabhängige Aufschläge, die den Standardaufschlag überschreiben. (optional)
      tax: # Steuer, Zusätzlicher prozentualer Aufschlag (z.B. 0.2 für 20%) (optional)
      formula: math.Max((price + charges) * (1 + tax), 0.0) # Formel, Individuelle Formel zur Berechnung des Preises (optional)
