template: spotovaelektrina
product:
  identifier: spotovaelektrina-cz
  brand: spotovaelektrina.cz
  group: Dynamischer Strompreis
countries: ["CZ"]
requirements: ["skiptest"]
description: |
  Tschechische Börsenstrompreise in 15-Minuten-Intervallen, ohne Mehrwertsteuer und weitere Gebühren. Der API-Anbieter bittet Nutzer um eine Nachricht an [info@spotovaelektrina.cz](mailto:info@spotovaelektrina.cz).
render:
  - default: |
      type: template
      template: spotovaelektrina
      currency: CZK # Währung, [CZK, EUR]
    advanced: |
      type: template
      template: spotovaelektrina
      currency: CZK # Währung, [CZK, EUR]
      charges: # Aufschlag, Zusätzlicher fester Aufschlag pro kWh (optional)
      chargesZones: # Aufschlagszonen, Zeitabhängige Aufschläge, die den Standardaufschlag überschreiben. (optional)
      tax: # Steuer, Zusätzlicher prozentualer Aufschlag (z.B. 0.2 für 20%) (optional)
      formula: math.Max((price + charges) * (1 + tax), 0.0) # Formel, Individuelle Formel zur Berechnung des Preises (optional)
      average: # Stündliche Durchschnittskosten verwenden, optional
params:
  - name: currency
    example:
    default: CZK
    choice: ['CZK', 'EUR']
    unit:
    description: Währung
    help:
    advanced: false
    optional: false
  - name: charges
    example:
    default:
    choice: []
    unit:
    description: Aufschlag
    help: Zusätzlicher fester Aufschlag pro kWh
    advanced: true
    optional: true
  - name: chargesZones
    example:
    default:
    choice: []
    unit:
    description: Aufschlagszonen
    help: Zeitabhängige Aufschläge, die den Standardaufschlag überschreiben.
    advanced: true
    optional: true
  - name: tax
    example:
    default:
    choice: []
    unit:
    description: Steuer
    help: Zusätzlicher prozentualer Aufschlag (z.B. 0.2 für 20%)
    advanced: true
    optional: true
  - name: formula
    example: math.Max((price + charges) * (1 + tax), 0.0)
    default:
    choice: []
    unit:
    description: Formel
    help: Individuelle Formel zur Berechnung des Preises
    advanced: true
    optional: true
  - name: average
    example:
    default:
    choice: []
    unit:
    description: Stündliche Durchschnittskosten verwenden
    help:
    advanced: true
    optional: true