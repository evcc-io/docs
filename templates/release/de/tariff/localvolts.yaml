template: localvolts
product:
  identifier: localvolts
  brand: Localvolts
  group: Dynamischer Strompreis
countries: ["AU"]
description: |
  Benötigt den API-Key und die Partner-ID aus der Localvolts Web-App (My Profile, General, API Key). Die Preise sind die standortspezifischen Flex-Preise für die aktuelle und die nächsten 24 Stunden.
render:
  - default: |
      type: template
      template: localvolts
      apikey: # API Key
      partner: # Partner-ID
      nmi: # NMI, National Meter Identifier (10 Zeichen, ohne Prüfziffer)
      channel: # Kanal, Import für den Netztarif, Export für den Einspeisetarif [Import, Export]
    advanced: |
      type: template
      template: localvolts
      apikey: # API Key
      partner: # Partner-ID
      nmi: # NMI, National Meter Identifier (10 Zeichen, ohne Prüfziffer)
      channel: # Kanal, Import für den Netztarif, Export für den Einspeisetarif [Import, Export]
      charges: # Aufschlag, Zusätzlicher fester Aufschlag pro kWh (optional)
      chargesZones: # Aufschlagszonen, Zeitabhängige Aufschläge, die den Standardaufschlag überschreiben. (optional)
      tax: # Steuer, Zusätzlicher prozentualer Aufschlag (z.B. 0.2 für 20%) (optional)
      formula: math.Max((price + charges) * (1 + tax), 0.0) # Formel, Individuelle Formel zur Berechnung des Preises (optional)
params:
  - name: apikey
    example:
    default:
    choice: []
    unit:
    description: API Key
    help:
    advanced: false
    optional: false
  - name: partner
    example:
    default:
    choice: []
    unit:
    description: Partner-ID
    help:
    advanced: false
    optional: false
  - name: nmi
    example:
    default:
    choice: []
    unit:
    description: NMI
    help: National Meter Identifier (10 Zeichen, ohne Prüfziffer)
    advanced: false
    optional: false
  - name: channel
    example:
    default:
    choice: ['Import', 'Export']
    unit:
    description: Kanal
    help: Import für den Netztarif, Export für den Einspeisetarif
    advanced: false
    optional: false
  - name: charges
    example:
    default:
    choice: []
    unit:
    description: Aufschlag
    help: Zusätzlicher fester Aufschlag pro kWh
    advanced: true
    optional: true
  - name: chargesZones
    example:
    default:
    choice: []
    unit:
    description: Aufschlagszonen
    help: Zeitabhängige Aufschläge, die den Standardaufschlag überschreiben.
    advanced: true
    optional: true
  - name: tax
    example:
    default:
    choice: []
    unit:
    description: Steuer
    help: Zusätzlicher prozentualer Aufschlag (z.B. 0.2 für 20%)
    advanced: true
    optional: true
  - name: formula
    example: math.Max((price + charges) * (1 + tax), 0.0)
    default:
    choice: []
    unit:
    description: Formel
    help: Individuelle Formel zur Berechnung des Preises
    advanced: true
    optional: true