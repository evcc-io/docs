template: open-meteo-temperature
product:
  identifier: open-meteo-temperature
  brand: Open-Meteo Temperature
  group: Temperaturvorhersage
requirements: ["skiptest"]
description: |
  Freie Wetter-API [open-meteo.com](https://open-meteo.com) für Außentemperaturdaten in 15-Minuten-Intervallen. Open-Meteo ist eine Open-Source-Wetter-API und bietet kostenlosen Zugriff für nicht-kommerzielle Nutzung. Kein API-Schlüssel erforderlich.
render:
  - default: |
      type: template
      template: open-meteo-temperature
      lat: 55.7351 # Breitengrad
      lon: 9.1275 # Längengrad
      model: best_match # Wettermodell, Siehe Weather Models unter [Open-Meteo API docs](https://open-meteo.com/en/docs) [best_match, chmi_aladin_seamless, cmc_gem_seamless, dmi_seamless, geosphere_seamless, icon_seamless, jma_seamless, kma_seamless, knmi_seamless, meteofrance_seamless, meteoswiss_icon_seamless, metno_seamless, ncep_gfs_seamless, ukmo_seamless]
    advanced: |
      type: template
      template: open-meteo-temperature
      lat: 55.7351 # Breitengrad
      lon: 9.1275 # Längengrad
      model: best_match # Wettermodell, Siehe Weather Models unter [Open-Meteo API docs](https://open-meteo.com/en/docs) [best_match, chmi_aladin_seamless, cmc_gem_seamless, dmi_seamless, geosphere_seamless, icon_seamless, jma_seamless, kma_seamless, knmi_seamless, meteofrance_seamless, meteoswiss_icon_seamless, metno_seamless, ncep_gfs_seamless, ukmo_seamless]
      interval: 1h # Intervall, optional
params:
  - name: lat
    example: 55.7351
    default:
    choice: []
    unit:
    description: Breitengrad
    help:
    advanced: false
    optional: false
  - name: lon
    example: 9.1275
    default:
    choice: []
    unit:
    description: Längengrad
    help:
    advanced: false
    optional: false
  - name: model
    example:
    default: best_match
    choice: ['best_match', 'chmi_aladin_seamless', 'cmc_gem_seamless', 'dmi_seamless', 'geosphere_seamless', 'icon_seamless', 'jma_seamless', 'kma_seamless', 'knmi_seamless', 'meteofrance_seamless', 'meteoswiss_icon_seamless', 'metno_seamless', 'ncep_gfs_seamless', 'ukmo_seamless']
    unit:
    description: Wettermodell
    help: Siehe Weather Models unter [Open-Meteo API docs](https://open-meteo.com/en/docs)
    advanced: false
    optional: false
  - name: interval
    example:
    default: 1h
    choice: []
    unit:
    description: Intervall
    help:
    advanced: true
    optional: true