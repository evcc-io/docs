template: victron-gx
product:
  identifier: victron-ac-load-meter-on-gx-device
  brand: Victron
  description: AC-Zähler am GX-Gerät
description: |
  Für zusätzliche Zähler, die am GX-Gerät angeschlossen sind und dort als AC-Verbraucher (`com.victronenergy.acload`) erscheinen.
  Netz-, PV- und Batteriemessung wird vom Template `Victron Energy` abgedeckt.

render:
  - usage: aux
    default: |
      type: template
      template: victron-gx
      usage: aux
      host: 192.0.2.2 # IP-Adresse oder Hostname
      id: # Zähler Modbus Unit-ID, Auf dem GX-Gerät unter Einstellungen / Integrationen / Modbus-TCP-Server / Verfügbare Dienste zu finden.
      port: 502 # Port, optional
  - usage: charge
    default: |
      type: template
      template: victron-gx
      usage: charge
      host: 192.0.2.2 # IP-Adresse oder Hostname
      id: # Zähler Modbus Unit-ID, Auf dem GX-Gerät unter Einstellungen / Integrationen / Modbus-TCP-Server / Verfügbare Dienste zu finden.
      port: 502 # Port, optional
params:
  - name: host
    example: 192.0.2.2
    default:
    choice: []
    unit:
    description: IP-Adresse oder Hostname
    help:
    advanced: false
    optional: false
  - name: id
    example:
    default:
    choice: []
    unit:
    description: Zähler Modbus Unit-ID
    help: Auf dem GX-Gerät unter Einstellungen / Integrationen / Modbus-TCP-Server / Verfügbare Dienste zu finden.
    advanced: false
    optional: false
  - name: port
    example:
    default: 502
    choice: []
    unit:
    description: Port
    help:
    advanced: false
    optional: true