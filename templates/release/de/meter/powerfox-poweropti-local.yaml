template: powerfox-poweropti-local
product:
  identifier: powerfox-poweropti-local
  brand: Powerfox
  description: Poweropti (lokal)
description: |
  Die lokale Schnittstelle erfordert den powerfox PRO Service und Firmware v2.02.07 oder neuer.
render:
  - usage: grid
    default: |
      type: template
      template: powerfox-poweropti-local
      usage: grid
      host: poweropti # IP-Adresse oder Hostname
      apikey: 1097bd725557 # API Key, Initial die Geräte-ID
    advanced: |
      type: template
      template: powerfox-poweropti-local
      usage: grid
      host: poweropti # IP-Adresse oder Hostname
      apikey: 1097bd725557 # API Key, Initial die Geräte-ID
      cache: 5s # Cache, Zeitintervall für erneute Datenabfrage (optional)
  - usage: pv
    default: |
      type: template
      template: powerfox-poweropti-local
      usage: pv
      host: poweropti # IP-Adresse oder Hostname
      apikey: 1097bd725557 # API Key, Initial die Geräte-ID
    advanced: |
      type: template
      template: powerfox-poweropti-local
      usage: pv
      host: poweropti # IP-Adresse oder Hostname
      apikey: 1097bd725557 # API Key, Initial die Geräte-ID
      cache: 5s # Cache, Zeitintervall für erneute Datenabfrage (optional)
params:
  - name: host
    example: poweropti
    default:
    choice: []
    unit:
    description: IP-Adresse oder Hostname
    help:
    advanced: false
    optional: false
  - name: apikey
    example: 1097bd725557
    default:
    choice: []
    unit:
    description: API Key
    help: Initial die Geräte-ID
    advanced: false
    optional: false
  - name: cache
    example: 5m
    default: 5s
    choice: []
    unit:
    description: Cache
    help: Zeitintervall für erneute Datenabfrage
    advanced: true
    optional: true