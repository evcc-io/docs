template: whatwatt-go
product:
  identifier: whatwatt-go
  brand: whatwatt
  description: Go
description: |
  Erfordert eine aktive Plus-Lizenz oder höher und Zugriff auf die lokale REST-API.
  Die Uhrzeiten des Geräts und von evcc müssen synchronisiert sein.
  Messwerte hängen vom angeschlossenen Zähler ab.

render:
  - usage: grid
    default: |
      type: template
      template: whatwatt-go
      usage: grid
      host: 192.0.2.2 # IP-Adresse oder Hostname
    advanced: |
      type: template
      template: whatwatt-go
      usage: grid
      host: 192.0.2.2 # IP-Adresse oder Hostname
      password: # Passwort, Optionales Passwort der whatwatt-Weboberfläche. Erfordert Firmware mit HTTP-Digest-Authentifizierung. (optional)
      cache: 1s # Cache, Zeitintervall für erneute Datenabfrage (optional)
params:
  - name: host
    example: 192.0.2.2
    default:
    choice: []
    unit:
    description: IP-Adresse oder Hostname
    help:
    advanced: false
    optional: false
  - name: password
    example:
    default:
    choice: []
    unit:
    description: Passwort
    help: Optionales Passwort der whatwatt-Weboberfläche. Erfordert Firmware mit HTTP-Digest-Authentifizierung.
    advanced: true
    optional: true
  - name: cache
    example: 5m
    default: 1s
    choice: []
    unit:
    description: Cache
    help: Zeitintervall für erneute Datenabfrage
    advanced: true
    optional: true