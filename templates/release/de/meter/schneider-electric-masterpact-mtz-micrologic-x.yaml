template: schneider-micrologic
product:
  identifier: schneider-electric-masterpact-mtz-micrologic-x
  brand: Schneider Electric
  description: MasterPacT MTZ (MicroLogic X)
description: |
  Die Auslöseeinheit muss über ein Kommunikationsmodul per Modbus erreichbar sein: IFM (Modbus RTU) oder IFE (Modbus TCP), bei MasterPacT MTZ alternativ EIFE. IFE und EIFE nutzen fest die Modbus-ID 255, beim IFM gilt die an den Drehschaltern eingestellte Adresse.

  4-polige Ausführungen messen den Neutralleiter direkt. 3-polige Ausführungen benötigen dafür einen externen Neutralleiter-Spannungsabgriff (ENVT), der angeschlossen und in der Auslöseeinheit deklariert ist (Systemtyp 40 oder 41). Ohne ENVT sind die Leistungswerte falsch, sobald Strom im Neutralleiter fließt.

  Das Leistungsvorzeichen muss mit "EcoStruxure Power Commission" so eingestellt sein, dass die normale Flussrichtung positiv zählt. Werkseinstellung: von den oberen zu den unteren Anschlussklemmen.

render:
  - usage: grid
    default: |
      type: template
      template: schneider-micrologic
      usage: grid

      # RS485 via adapter (Modbus RTU)
      modbus: rs485serial
      id: 255
      device: /dev/ttyUSB0 # USB-RS485 Adapter Adresse
      baudrate: 19200 # Prüfe die Geräteeinstellungen, typische Werte sind 9600, 19200, 38400, 57600, 115200
      comset: "8E1" # Kommunikationsparameter für den Adapter

      # RS485 via TCP/IP (Modbus RTU)
      modbus: rs485tcpip
      id: 255
      host:  # Hostname
      port: 502 # Port

      # Modbus TCP
      modbus: tcpip
      id: 255
      host:  # Hostname
      port: 502 # Port
