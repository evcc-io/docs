template: viessmann
product:
  identifier: viessmann-heatpump-consumption-api
  brand: Viessmann
  description: Heatpump consumption (API)
requirements: ["skiptest"]
description: |
  Liest die aktuelle elektrische Leistungsaufnahme der Wärmepumpe (heating.power.consumption.current)
  als zusätzlichen Verbraucher (aux). Dadurch erscheint die Wärmepumpe im Energiefluss unter "Verbrauch"
  und ihr Verbrauch fließt in die evcc-Statistik ein - unabhängig davon, ob evcc die Wärmepumpe steuert.

render:
  - usage: aux
    default: |
      type: template
      template: viessmann
      usage: aux
      clientid: # Client ID, Konfigurieren in [app.developer.viessmann-climatesolutions.com](https://app.developer.viessmann-climatesolutions.com)
      redirecturi: # Redirect URI, Redirect-URI der evcc-Instanz. Muss mit der Redirect URI übereinstimmen, die im Viessmann Developer Portal konfiguriert ist.
      gateway_serial: # Gateway Serial, Wird nach der Anmeldung automatisch ermittelt. Alternativ manuell eintragen (ViCare App -> Einstellungen -> Kommunikationsmodul -> Seriennummer)
      installation_id: # Installation ID, Wird nach der Anmeldung automatisch ermittelt.
      device_id: 0 # Device ID, normalerweise `0`
params:
  - name: clientid
    example:
    default:
    choice: []
    unit:
    description: Client ID
    help: Konfigurieren in [app.developer.viessmann-climatesolutions.com](https://app.developer.viessmann-climatesolutions.com)
    advanced: false
    optional: false
  - name: redirecturi
    example:
    default:
    choice: []
    unit:
    description: Redirect URI
    help: Redirect-URI der evcc-Instanz. Muss mit der Redirect URI übereinstimmen, die im Viessmann Developer Portal konfiguriert ist.
    advanced: false
    optional: false
  - name: gateway_serial
    example:
    default:
    choice: []
    unit:
    description: Gateway Serial
    help: Wird nach der Anmeldung automatisch ermittelt. Alternativ manuell eintragen (ViCare App -> Einstellungen -> Kommunikationsmodul -> Seriennummer)
    advanced: false
    optional: false
  - name: installation_id
    example:
    default:
    choice: []
    unit:
    description: Installation ID
    help: Wird nach der Anmeldung automatisch ermittelt.
    advanced: false
    optional: false
  - name: device_id
    example:
    default: 0
    choice: []
    unit:
    description: Device ID
    help: normalerweise `0`
    advanced: false
    optional: false