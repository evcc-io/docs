template: victron-gx
product:
  identifier: victron-ac-load-meter-on-gx-device
  brand: Victron
  description: AC load meter on GX device
description: |
  For additional meters attached to the GX device that appear as AC load (`com.victronenergy.acload`).
  Grid, PV and battery measurement is covered by the `Victron Energy` template.
  The meter's Modbus unit id can be found on the GX device under Settings / Integrations / Modbus TCP server / Available services.

render:
  - usage: aux
    default: |
      type: template
      template: victron-gx
      usage: aux

      # Modbus TCP
      modbus: tcpip
      id: 1
      host:  # Hostname
      port: 502 # Port
  - usage: charge
    default: |
      type: template
      template: victron-gx
      usage: charge

      # Modbus TCP
      modbus: tcpip
      id: 1
      host:  # Hostname
      port: 502 # Port
params:
  - name: modbus
    example:
    default:
    choice: ['tcpip']
    unit:
    description: Modbus Type
    help:
    advanced: false
    optional: false
modbus:
  delay:
  host:
  id: 1
  modbus: tcpip
  port: 502
  tcpip: true
  timeout: