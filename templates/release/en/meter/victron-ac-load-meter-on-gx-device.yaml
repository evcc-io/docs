template: victron-gx
product:
  identifier: victron-ac-load-meter-on-gx-device
  brand: Victron
  description: AC load meter on GX device
description: |
  For additional meters attached to the GX device that appear as AC load (`com.victronenergy.acload`).
  Grid, PV and battery measurement is covered by the `Victron Energy` template.

render:
  - usage: aux
    default: |
      type: template
      template: victron-gx
      usage: aux
      host: 192.0.2.2 # IP address or hostname
      id: # Meter Modbus unit id, Found on the GX device under Settings / Integrations / Modbus TCP server / Available services.
      port: 502 # Port, optional
  - usage: charge
    default: |
      type: template
      template: victron-gx
      usage: charge
      host: 192.0.2.2 # IP address or hostname
      id: # Meter Modbus unit id, Found on the GX device under Settings / Integrations / Modbus TCP server / Available services.
      port: 502 # Port, optional
params:
  - name: host
    example: 192.0.2.2
    default:
    choice: []
    unit:
    description: IP address or hostname
    help:
    advanced: false
    optional: false
  - name: id
    example:
    default:
    choice: []
    unit:
    description: Meter Modbus unit id
    help: Found on the GX device under Settings / Integrations / Modbus TCP server / Available services.
    advanced: false
    optional: false
  - name: port
    example:
    default: 502
    choice: []
    unit:
    description: Port
    help:
    advanced: false
    optional: true