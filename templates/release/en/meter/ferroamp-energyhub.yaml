template: ferroamp-energyhub
product:
  identifier: ferroamp-energyhub
  brand: Ferroamp
  description: EnergyHub
capabilities: ["battery-control"]
description: |
  Modbus TCP has to be enabled for the EnergyHub by the installer or Ferroamp support.
  The interface is only reachable via the EnergyHub's Ethernet interface.
  Grid values are measured by the external current transformers (CTs) at the grid connection point.

render:
  - usage: grid
    default: |
      type: template
      template: ferroamp-energyhub
      usage: grid

      # Modbus TCP
      modbus: tcpip
      id: 1
      host:  # Hostname
      port: 502 # Port
  - usage: pv
    default: |
      type: template
      template: ferroamp-energyhub
      usage: pv

      # Modbus TCP
      modbus: tcpip
      id: 1
      host:  # Hostname
      port: 502 # Port
  - usage: battery
    default: |
      type: template
      template: ferroamp-energyhub
      usage: battery

      # Modbus TCP
      modbus: tcpip
      id: 1
      host:  # Hostname
      port: 502 # Port
      maxchargepower: # Maximum charge power (W), For forced charging of the battery.
      maxdischargepower: # Maximum discharge power (W), Maximum discharge power of the storage.
      minsoc: 25 # Minimum charge (%), Lower limit when discharging the battery in normal operation (optional)
      maxsoc: 95 # Maximum charge (%), Upper limit when charging the battery from the grid (optional)
params:
  - name: modbus
    example:
    default:
    choice: ['tcpip']
    unit:
    description: Modbus Type
    help:
    advanced: false
    optional: false
  - name: maxchargepower
    example:
    default:
    choice: []
    unit: W
    description: Maximum charge power
    help: For forced charging of the battery.
    advanced: false
    optional: false
  - name: maxdischargepower
    example:
    default:
    choice: []
    unit: W
    description: Maximum discharge power
    help: Maximum discharge power of the storage.
    advanced: false
    optional: false
  - name: minsoc
    example: 25
    default:
    choice: []
    unit: '%'
    description: Minimum charge
    help: Lower limit when discharging the battery in normal operation
    advanced: false
    optional: true
  - name: maxsoc
    example: 95
    default:
    choice: []
    unit: '%'
    description: Maximum charge
    help: Upper limit when charging the battery from the grid
    advanced: false
    optional: true
modbus:
  delay:
  host:
  id: 1
  modbus: tcpip
  port: 502
  tcpip: true
  timeout: