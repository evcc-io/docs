template: sma-homemanager-modbus
product:
  identifier: sma-sunny-home-manager-2-0-modbus
  brand: SMA
  description: Sunny Home Manager 2.0 Modbus
capabilities: ["curtail"]
render:
  - usage: grid
    default: |
      type: template
      template: sma-homemanager-modbus
      usage: grid

      # Modbus TCP
      modbus: tcpip
      id: 2
      host:  # Hostname
      port: 502 # Port
params:
  - name: modbus
    example:
    default:
    choice: ['tcpip']
    unit:
    description: Modbus Type
    help: ModbusTCP server needs to be enabled.
    advanced: false
    optional: false
modbus:
  delay:
  host:
  id: 2
  modbus: tcpip
  port: 502
  tcpip: true
  timeout: