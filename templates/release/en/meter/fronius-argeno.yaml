template: fronius-argeno
product:
  identifier: fronius-argeno
  brand: Fronius
  description: Argeno
description: |
  Modbus TCP must be enabled on the inverter (Configuration → Communication → Ethernet → Modbus TCP/UDP). For the grid meter see the "Fronius Smart Meter IP" template — the Argeno uses the Smart Meter IP as a standalone network device.

render:
  - usage: pv
    default: |
      type: template
      template: fronius-argeno
      usage: pv
      host: 192.0.2.2 # IP address or hostname
      port: 502 # Port, optional
params:
  - name: host
    example: 192.0.2.2
    default:
    choice: []
    unit:
    description: IP address or hostname
    help:
    advanced: false
    optional: false
  - name: port
    example:
    default: 502
    choice: []
    unit:
    description: Port
    help:
    advanced: false
    optional: true