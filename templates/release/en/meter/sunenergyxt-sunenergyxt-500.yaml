template: sunenergyxt-500
product:
  identifier: sunenergyxt-sunenergyxt-500
  brand: SunEnergyXT
  description: SunEnergyXT 500
capabilities: ["battery-control"]
description: |
  The battery's local mode must be enabled in the manufacturer's app.
  Furthermore, the device's IP address must be set to a fixed, permanent IP address in the router.
  If the `grid` mode is used, an external meter (e.g., Shelly) must be connected to the battery to measure the grid connection point (via the manufacturer's app).

caveats:
  - description: |
      Currently, each head storage must be individually added in EVCC.
      Connecting multiple head storages into one system has been announced by the manufacturer but is not yet implemented on the software side.

render:
  - usage: grid
    default: |
      type: template
      template: sunenergyxt-500
      usage: grid
      host: 192.0.2.2 # IP address or hostname
    advanced: |
      type: template
      template: sunenergyxt-500
      usage: grid
      host: 192.0.2.2 # IP address or hostname
      cache: 1s # Cache, Time interval for data refresh (optional)
      timeout: 10s # Timeout, optional
  - usage: pv
    default: |
      type: template
      template: sunenergyxt-500
      usage: pv
      host: 192.0.2.2 # IP address or hostname
    advanced: |
      type: template
      template: sunenergyxt-500
      usage: pv
      host: 192.0.2.2 # IP address or hostname
      maxacpower: 800.0 # Maximum AC power of the hybrid inverter (W), optional
      cache: 1s # Cache, Time interval for data refresh (optional)
      timeout: 10s # Timeout, optional
  - usage: battery
    default: |
      type: template
      template: sunenergyxt-500
      usage: battery
      host: 192.0.2.2 # IP address or hostname
      capacity: 4.8 # Battery capacity (kWh), optional
      minsoc: 25 # Minimum charge (%), Lower limit when discharging the battery in normal operation (optional)
      maxsoc: 95 # Maximum charge (%), Upper limit when charging the battery from the grid (optional)
    advanced: |
      type: template
      template: sunenergyxt-500
      usage: battery
      host: 192.0.2.2 # IP address or hostname
      capacity: 4.8 # Battery capacity (kWh), optional
      minsoc: 25 # Minimum charge (%), Lower limit when discharging the battery in normal operation (optional)
      maxsoc: 95 # Maximum charge (%), Upper limit when charging the battery from the grid (optional)
      maxchargepower: 2400.0 # Maximum charge power (W), For forced charging of the battery. (optional)
      maxdischargepower: 800.0 # Maximum discharge power (W), Maximum discharge power of the storage. (optional)
      cache: 1s # Cache, Time interval for data refresh (optional)
      timeout: 10s # Timeout, optional
params:
  - name: host
    example: 192.0.2.2
    default:
    choice: []
    unit:
    description: IP address or hostname
    help:
    advanced: false
    optional: false
  - name: capacity
    example: 50
    default: 4.8
    choice: []
    unit: kWh
    description: Battery capacity
    help:
    advanced: false
    optional: true
  - name: minsoc
    example: 25
    default:
    choice: []
    unit: '%'
    description: Minimum charge
    help: Lower limit when discharging the battery in normal operation
    advanced: false
    optional: true
  - name: maxsoc
    example: 95
    default:
    choice: []
    unit: '%'
    description: Maximum charge
    help: Upper limit when charging the battery from the grid
    advanced: false
    optional: true
  - name: maxacpower
    example: 5000
    default: '800.0'
    choice: []
    unit: W
    description: Maximum AC power of the hybrid inverter
    help:
    advanced: true
    optional: true
  - name: maxchargepower
    example:
    default: '2400.0'
    choice: []
    unit: W
    description: Maximum charge power
    help: For forced charging of the battery.
    advanced: true
    optional: true
  - name: maxdischargepower
