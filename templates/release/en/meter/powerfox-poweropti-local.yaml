template: powerfox-poweropti-local
product:
  identifier: powerfox-poweropti-local
  brand: Powerfox
  description: Poweropti (local)
description: |
  The local interface requires the powerfox PRO service and firmware v2.02.07 or newer.
render:
  - usage: grid
    default: |
      type: template
      template: powerfox-poweropti-local
      usage: grid
      host: poweropti # IP address or hostname
      apikey: 1097bd725557 # API Key, Initially the device id
    advanced: |
      type: template
      template: powerfox-poweropti-local
      usage: grid
      host: poweropti # IP address or hostname
      apikey: 1097bd725557 # API Key, Initially the device id
      cache: 5s # Cache, Time interval for data refresh (optional)
  - usage: pv
    default: |
      type: template
      template: powerfox-poweropti-local
      usage: pv
      host: poweropti # IP address or hostname
      apikey: 1097bd725557 # API Key, Initially the device id
    advanced: |
      type: template
      template: powerfox-poweropti-local
      usage: pv
      host: poweropti # IP address or hostname
      apikey: 1097bd725557 # API Key, Initially the device id
      cache: 5s # Cache, Time interval for data refresh (optional)
params:
  - name: host
    example: poweropti
    default:
    choice: []
    unit:
    description: IP address or hostname
    help:
    advanced: false
    optional: false
  - name: apikey
    example: 1097bd725557
    default:
    choice: []
    unit:
    description: API Key
    help: Initially the device id
    advanced: false
    optional: false
  - name: cache
    example: 5m
    default: 5s
    choice: []
    unit:
    description: Cache
    help: Time interval for data refresh
    advanced: true
    optional: true