template: solplanet-modbus
product:
  identifier: solplanet-hybrid-inverter-modbus-tcp
  brand: Solplanet
  description: Hybrid inverter (Modbus TCP)
capabilities: ["battery-control", "curtail"]
description: |
  Only for inverters with a dedicated Modbus TCP ethernet port (e.g. ASW-TH series, KACO Blueplanet Hybrid NH3, port eth 5&6), protocol AISWEI "MB001_ASW GEN-Modbus" V2.1.7.
  Older devices without that port need the `solplanet-ai-dongle` template instead.
  The grid meter import/export energy counters (46443/46445) are not exposed over Modbus TCP by this firmware.
  With two battery packs (BMS1 + BMS2) add one battery meter each, using battery number 1 and 2.

render:
  - usage: grid
    default: |
      type: template
      template: solplanet-modbus
      usage: grid

      # Modbus TCP
      modbus: tcpip
      id: 1
      host:  # Hostname
      port: 502 # Port
    advanced: |
      type: template
      template: solplanet-modbus
      usage: grid

      # Modbus TCP
      modbus: tcpip
      id: 1
      host:  # Hostname
      port: 502 # Port
  - usage: pv
    default: |
      type: template
      template: solplanet-modbus
      usage: pv

      # Modbus TCP
      modbus: tcpip
      id: 1
      host:  # Hostname
      port: 502 # Port
    advanced: |
      type: template
      template: solplanet-modbus
      usage: pv

      # Modbus TCP
      modbus: tcpip
      id: 1
      host:  # Hostname
      port: 502 # Port
  - usage: battery
    default: |
      type: template
      template: solplanet-modbus
      usage: battery

      # Modbus TCP
      modbus: tcpip
      id: 1
      host:  # Hostname
      port: 502 # Port
      battery: # Battery number, [1, 2]
      maxchargepower: # Maximum charge power (W), Highest power the battery system can charge with. The optimizer plans with charging up to this power. Some devices also use it as grid charging power.
      capacity: 50 # Battery capacity (kWh), optional
      minsoc: 0 # Minimum charge (%), Lower limit as configured on the battery system. Used by optimizer. (optional)
      maxsoc: 100 # Maximum charge (%), Upper limit as configured on the battery system. Used by optimizer and, on some devices, for grid charging. (optional)
    advanced: |
      type: template
      template: solplanet-modbus
      usage: battery

      # Modbus TCP
      modbus: tcpip
      id: 1
      host:  # Hostname
      port: 502 # Port
      battery: # Battery number, [1, 2]
      maxchargepower: # Maximum charge power (W), Highest power the battery system can charge with. The optimizer plans with charging up to this power. Some devices also use it as grid charging power.
      capacity: 50 # Battery capacity (kWh), optional
      minsoc: 0 # Minimum charge (%), Lower limit as configured on the battery system. Used by optimizer. (optional)
      maxsoc: 100 # Maximum charge (%), Upper limit as configured on the battery system. Used by optimizer and, on some devices, for grid charging. (optional)
      maxdischargepower: # Maximum discharge power (W), Highest power the battery system can discharge with. The optimizer plans with discharging up to this power. Smart mode assumes the battery supplies at most this power to vehicle charging. (optional)
params:
  - name: modbus
    example:
    default:
    choice: ['tcpip']
    unit:
    description: Modbus Type
    help:
    advanced: false
    optional: false
  - name: battery
    example:
    default:
    choice: ['1', '2']
    unit:
    description: Battery number
    help:
    advanced: false
    optional: false
  - name: maxchargepower
    example:
    default:
    choice: []
    unit: W
    description: Maximum charge power
    help: Highest power the battery system can charge with. The optimizer plans with charging up to this power. Some devices also use it as grid charging power.
    advanced: false
    optional: false
  - name: capacity
    example: 50
    default:
    choice: []
    unit: kWh
    description: Battery capacity
    help:
    advanced: false
    optional: true
  - name: minsoc
    example: 25
    default: 0
    choice: []
    unit: '%'
    description: Minimum charge
    help: Lower limit as configured on the battery system. Used by optimizer.
    advanced: false
    optional: true
  - name: maxsoc
    example: 95
    default: 100
    choice: []
    unit: '%'
    description: Maximum charge
    help: Upper limit as configured on the battery system. Used by optimizer and, on some devices, for grid charging.
    advanced: false
    optional: true
  - name: maxdischargepower
    example:
    default:
    choice: []
    unit: W
    description: Maximum discharge power
    help: Highest power the battery system can discharge with. The optimizer plans with discharging up to this power. Smart mode assumes the battery supplies at most this power to vehicle charging.
    advanced: true
    optional: true
modbus:
  delay:
  host:
  id: 1
  modbus: tcpip
  port: 502
  tcpip: true
  timeout: