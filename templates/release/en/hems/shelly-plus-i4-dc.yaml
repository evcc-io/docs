template: fnn-shelly-i4
product:
  identifier: shelly-plus-i4-dc
  brand: Shelly
  description: Plus i4 DC
description: |
  Connect the relay contacts of the control box to the inputs SW1 to SW4. All used inputs must be configured as input type "switch" in the Shelly app or web interface, not as "button".
render:
  - default: |
      type: template
      template: fnn-shelly-i4
      host: 192.0.2.2 # IP address or hostname
      maxconsumptionpower: # Guaranteed minimum power (Pmin) (W), Power limit applied to the root circuit while the limit is active.
      w4input: 1 # W4 input, Input number for the W4 signal (Dimmer for controllable loads), 1 to 4 (SW1 = 1)
      w3input: 2 # W3 input, Input number for the W3 signal (Zero export, 0%), 1 to 4 (SW1 = 1)
      password: # Password, Only required if authentication is enabled on the device (user is always admin) (optional)
      productionnominalmax: # Installed generator power (Wp), Rated generator/module power of the installation (reference value according to § 9 EEG). (optional)
      s1input: 3 # S1 input, Input number for the S1 signal (60% export power limit), 1 to 4 (SW1 = 1) (optional)
      s2input: 4 # S2 input, Input number for the S2 signal (30% export power limit), 1 to 4 (SW1 = 1) (optional)
params:
  - name: host
    example: 192.0.2.2
    default:
    choice: []
    unit:
    description: IP address or hostname
    help:
    advanced: false
    optional: false
  - name: maxconsumptionpower
    example:
    default:
    choice: []
    unit: W
    description: Guaranteed minimum power (Pmin)
    help: Power limit applied to the root circuit while the limit is active.
    advanced: false
    optional: false
  - name: w4input
    example:
    default: 1
    choice: []
    unit:
    description: W4 input
    help: Input number for the W4 signal (Dimmer for controllable loads), 1 to 4 (SW1 = 1)
    advanced: false
    optional: false
  - name: w3input
    example:
    default: 2
    choice: []
    unit:
    description: W3 input
    help: Input number for the W3 signal (Zero export, 0%), 1 to 4 (SW1 = 1)
    advanced: false
    optional: false
  - name: password
    example:
    default:
    choice: []
    unit:
    description: Password
    help: Only required if authentication is enabled on the device (user is always admin)
    advanced: false
    optional: true
  - name: productionnominalmax
    example:
    default:
    choice: []
    unit: Wp
    description: Installed generator power
    help: Rated generator/module power of the installation (reference value according to § 9 EEG).
    advanced: false
    optional: true
  - name: s1input
    example: 3
    default:
    choice: []
    unit:
    description: S1 input
    help: Input number for the S1 signal (60% export power limit), 1 to 4 (SW1 = 1)
    advanced: false
    optional: true
  - name: s2input
    example: 4
    default:
    choice: []
    unit:
    description: S2 input
    help: Input number for the S2 signal (30% export power limit), 1 to 4 (SW1 = 1)
    advanced: false
    optional: true