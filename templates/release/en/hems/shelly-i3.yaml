template: fnn-shelly-i3
product:
  identifier: shelly-i3
  brand: Shelly
  description: i3
description: |
  Connect the relay contacts of the control box to the inputs SW1 to SW3. With three inputs only the feed-in limitation (W3, S1, S2) is mapped by default. Dimming of controllable loads (W4) requires reassigning one of the inputs.
render:
  - default: |
      type: template
      template: fnn-shelly-i3
      host: 192.0.2.2 # IP address or hostname
      w3input: 1 # W3 input, Input number for the W3 signal (Zero export, 0%), 1 to 3 (SW1 = 1)
      user: # Username, Only required if authentication is enabled on the device (optional)
      password: # Password, Service account password (optional)
      productionnominalmax: # Installed generator power (Wp), Rated generator/module power of the installation (reference value according to § 9 EEG). (optional)
      s1input: 2 # S1 input, Input number for the S1 signal (60% export power limit), 1 to 3 (SW1 = 1) (optional)
      s2input: 3 # S2 input, Input number for the S2 signal (30% export power limit), 1 to 3 (SW1 = 1) (optional)
    advanced: |
      type: template
      template: fnn-shelly-i3
      host: 192.0.2.2 # IP address or hostname
      w3input: 1 # W3 input, Input number for the W3 signal (Zero export, 0%), 1 to 3 (SW1 = 1)
      user: # Username, Only required if authentication is enabled on the device (optional)
      password: # Password, Service account password (optional)
      productionnominalmax: # Installed generator power (Wp), Rated generator/module power of the installation (reference value according to § 9 EEG). (optional)
      s1input: 2 # S1 input, Input number for the S1 signal (60% export power limit), 1 to 3 (SW1 = 1) (optional)
      s2input: 3 # S2 input, Input number for the S2 signal (30% export power limit), 1 to 3 (SW1 = 1) (optional)
      w4input: # W4 input, Input number for the W4 signal (Dimmer for controllable loads), 1 to 3 (SW1 = 1). Not mapped by default. (optional)
      maxconsumptionpower: # Guaranteed minimum power (Pmin) (W), Power limit applied to the root circuit while the limit is active. Required if W4 is mapped. (optional)
params:
  - name: host
    example: 192.0.2.2
    default:
    choice: []
    unit:
    description: IP address or hostname
    help:
    advanced: false
    optional: false
  - name: w3input
    example:
    default: 1
    choice: []
    unit:
    description: W3 input
    help: Input number for the W3 signal (Zero export, 0%), 1 to 3 (SW1 = 1)
    advanced: false
    optional: false
  - name: user
    example:
    default:
    choice: []
    unit:
    description: Username
    help: Only required if authentication is enabled on the device
    advanced: false
    optional: true
  - name: password
    example:
    default:
    choice: []
    unit:
    description: Password
    help: Service account password
    advanced: false
    optional: true
  - name: productionnominalmax
    example:
    default:
    choice: []
    unit: Wp
    description: Installed generator power
    help: Rated generator/module power of the installation (reference value according to § 9 EEG).
    advanced: false
    optional: true
  - name: s1input
    example:
    default: 2
    choice: []
    unit:
    description: S1 input
    help: Input number for the S1 signal (60% export power limit), 1 to 3 (SW1 = 1)
    advanced: false
    optional: true
  - name: s2input
    example:
    default: 3
    choice: []
    unit:
    description: S2 input
    help: Input number for the S2 signal (30% export power limit), 1 to 3 (SW1 = 1)
