template: ehive-one-fnn
product:
  identifier: ehive-one
  brand: eHive
  description: One
description: |
  Requires ioManager 1.1.3 or later. The relay contacts of the control box are connected to the digital inputs DI1 and DI2.
render:
  - default: |
      type: template
      template: ehive-one-fnn
      host: 127.0.0.1 # IP address or hostname
      maxconsumptionpower: # Guaranteed minimum power (Pmin) (W), Power limit applied to the root circuit while the limit is active. Required if an input is assigned to W4. (optional)
      productionnominalmax: 10000 # Installed generator power (Wp), Rated generator/module power of the installation (reference value according to § 9 EEG). Required if an input is assigned to W3, S1 or S2. (optional)
      di1function: w4 # DI1 signal, W4 (Dimmer for controllable loads), W3 (Zero export, 0%), S1 (60% export power limit), S2 (30% export power limit) or unused [w4, w3, s1, s2, unused] (optional)
      di2function: unused # DI2 signal, W4 (Dimmer for controllable loads), W3 (Zero export, 0%), S1 (60% export power limit), S2 (30% export power limit) or unused [w4, w3, s1, s2, unused] (optional)
    advanced: |
      type: template
      template: ehive-one-fnn
      host: 127.0.0.1 # IP address or hostname
      maxconsumptionpower: # Guaranteed minimum power (Pmin) (W), Power limit applied to the root circuit while the limit is active. Required if an input is assigned to W4. (optional)
      productionnominalmax: 10000 # Installed generator power (Wp), Rated generator/module power of the installation (reference value according to § 9 EEG). Required if an input is assigned to W3, S1 or S2. (optional)
      di1function: w4 # DI1 signal, W4 (Dimmer for controllable loads), W3 (Zero export, 0%), S1 (60% export power limit), S2 (30% export power limit) or unused [w4, w3, s1, s2, unused] (optional)
      di2function: unused # DI2 signal, W4 (Dimmer for controllable loads), W3 (Zero export, 0%), S1 (60% export power limit), S2 (30% export power limit) or unused [w4, w3, s1, s2, unused] (optional)
      port: 3000 # Port, optional
      di1activelow: # DI1 active low, Signal is active while the input reports false. (optional)
      di2activelow: # DI2 active low, Signal is active while the input reports false. (optional)
      maxage: 5s # Maximum sample age, Older or invalid samples are rejected. Must be longer than the acquisition interval of the ioManager. (optional)
      cache: 1s # Cache, Time interval for data refresh (optional)
params:
  - name: host
    example: 192.0.2.2
    default: 127.0.0.1
    choice: []
    unit:
    description: IP address or hostname
    help:
    advanced: false
    optional: false
  - name: maxconsumptionpower
    example:
    default:
    choice: []
    unit: W
    description: Guaranteed minimum power (Pmin)
    help: Power limit applied to the root circuit while the limit is active. Required if an input is assigned to W4.
    advanced: false
    optional: true
  - name: productionnominalmax
    example: 10000
    default:
    choice: []
    unit: Wp
    description: Installed generator power
    help: Rated generator/module power of the installation (reference value according to § 9 EEG). Required if an input is assigned to W3, S1 or S2.
    advanced: false
    optional: true
  - name: di1function
    example:
    default: w4
    choice: ['w4', 'w3', 's1', 's2', 'unused']
    unit:
    description: DI1 signal
    help: W4 (Dimmer for controllable loads), W3 (Zero export, 0%), S1 (60% export power limit), S2 (30% export power limit) or unused
    advanced: false
    optional: true
  - name: di2function
    example:
    default: unused
    choice: ['w4', 'w3', 's1', 's2', 'unused']
    unit:
    description: DI2 signal
    help: W4 (Dimmer for controllable loads), W3 (Zero export, 0%), S1 (60% export power limit), S2 (30% export power limit) or unused
    advanced: false
    optional: true
  - name: port
    example:
    default: 3000
    choice: []
    unit:
    description: Port
    help:
    advanced: true
    optional: true
  - name: di1activelow
    example:
    default:
    choice: []
    unit:
    description: DI1 active low
    help: Signal is active while the input reports false.
    advanced: true
    optional: true
  - name: di2activelow
    example:
    default:
    choice: []
    unit:
    description: DI2 active low
    help: Signal is active while the input reports false.
    advanced: true
    optional: true
  - name: maxage
    example:
    default: 5s
    choice: []
    unit:
    description: Maximum sample age
    help: Older or invalid samples are rejected. Must be longer than the acquisition interval of the ioManager.
    advanced: true
    optional: true
  - name: cache
    example: 5m
    default: 1s
    choice: []
    unit:
    description: Cache
    help: Time interval for data refresh
    advanced: true
    optional: true