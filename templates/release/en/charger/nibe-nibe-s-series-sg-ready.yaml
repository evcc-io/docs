template: nibe-s-series
product:
  identifier: nibe-nibe-s-series-sg-ready
  brand: NIBE
  description: Nibe S-Series (SG Ready)
  group: Heating devices
capabilities: ["dim"]
description: |
  Modbus connection to the NIBE S heat pump.
  Firmware version 4.13.12 or newer is required.
  Required settings in the control unit:
  - In the indoor unit, Modbus must be enabled in menu 7.5.9
  - To use power control, select Modbus ext. power limitation under AUX in menu 7.4. Set the minimum output of the immersion heater in the charging point settings.
  - In menu 7.4, the options “SG-Ready A” and “SG-Ready B” must not be assigned.
  - Enable "Activate SG-Ready via API" in menu 4.2.3.

render:
  - default: |
      type: template
      template: nibe-s-series

      # Modbus TCP
      modbus: tcpip
      id: 1
      host:  # Hostname
      port: 502 # Port
      tempsource: water_mid # Temperature sensor, [water_top, water_mid]
      powercontrol: true # power limitation
params:
  - name: modbus
    example:
    default:
    choice: ['tcpip']
    unit:
    description: Modbus Type
    help:
    advanced: false
    optional: false
  - name: tempsource
    example:
    default: water_mid
    choice: ['water_top', 'water_mid']
    unit:
    description: Temperature sensor
    help:
    advanced: false
    optional: false
  - name: powercontrol
    example:
    default: true
    choice: []
    unit:
    description: power limitation
    help:
    advanced: false
    optional: false
modbus:
  delay:
  host:
  id: 1
  modbus: tcpip
  port: 502
  tcpip: true
  timeout: