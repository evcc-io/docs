template: tuya-feyree
product:
  identifier: isigma-ev-charger
  brand: iSIGMA
  description: EV Charger
capabilities: ["meter", "dim"]
requirements: ["sponsorship"]
description: |
  Local connection via the Tuya protocol for chargers using the Tuya data point layout of Feyree and Kolanky (e.g. Tuya product id `tj9l3ghsjnbdjom6`).
  Device ID and local key must be retrieved once, e.g. using `tinytuya wizard`, which requires an account on the Tuya IoT platform. No cloud access is needed during operation. The device accepts only one local connection at a time, other local integrations (e.g. LocalTuya, Tuya Local) must be disabled.
  Charging is started and paused using the start/stop command of the charger. Delay and timer functions in the app must be disabled.

render:
  - default: |
      type: template
      template: tuya-feyree
      host: 192.0.2.2 # IP address or hostname
      id: # Device ID
      localkey: # Local Key
params:
  - name: host
    example: 192.0.2.2
    default:
    choice: []
    unit:
    description: IP address or hostname
    help:
    advanced: false
    optional: false
  - name: id
    example:
    default:
    choice: []
    unit:
    description: Device ID
    help:
    advanced: false
    optional: false
  - name: localkey
    example:
    default:
    choice: []
    unit:
    description: Local Key
    help:
    advanced: false
    optional: false