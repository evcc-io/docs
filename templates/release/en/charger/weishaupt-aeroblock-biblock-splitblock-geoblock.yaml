template: weishaupt
product:
  identifier: weishaupt-aeroblock-biblock-splitblock-geoblock
  brand: Weishaupt
  description: AEROBLOCK/BIBLOCK/SPLITBLOCK/GEOBLOCK
  group: Heating devices
description: |
  Enable access under Settings -> Modbus TCP on the system device and configure network/netmask accordingly.
  The power setpoint (SollwertPV) overrides the SG Ready function. Mind the response time of the heating system.

render:
  - default: |
      type: template
      template: weishaupt

      # Modbus TCP
      modbus: tcpip
      id: 1
      host:  # Hostname
      port: 502 # Port
      tempsource: warmwater # Temperature source, [warmwater, buffer, flow, outside] (optional)
params:
  - name: modbus
    example:
    default:
    choice: ['tcpip']
    unit:
    description: Modbus Type
    help:
    advanced: false
    optional: false
  - name: tempsource
    example:
    default: warmwater
    choice: ['warmwater', 'buffer', 'flow', 'outside']
    unit:
    description: Temperature source
    help:
    advanced: false
    optional: true
modbus:
  delay:
  host:
  id: 1
  modbus: tcpip
  port: 502
  tcpip: true
  timeout: