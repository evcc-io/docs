template: voltie
product:
  identifier: voltie-charger
  brand: Voltie
  description: Charger
capabilities: ["mA", "1p3p", "meter", "dim"]
requirements: ["sponsorship"]
description: |
  Modbus must be set to "TCP" on the Modbus config screen of the Voltie app, and the slave address configured there (default 11) must match the ID. The communication timeout reduces the charging current to 0 A after a loss of communication, so it has to be set to 0 (disabled) or to a value larger than the evcc update interval. Requires EVSE firmware 350 or later and charger software 1.3.40 or later. Phase switching, the total energy counter, the phase powers and the current limits require EVSE firmware 352 or later.
caveats:
  - description: |
      The charger's auto start mode is disabled persistently when evcc starts and has to be switched back on in the Voltie app after evcc is removed.
  - description: |
      The Modbus TCP gateway forwards at most two transactions per second. Shorter polling intervals produce timeouts rather than fresher data.
  - description: |
      Phase switching is only available on chargers manufactured from 2026 (serial number starting with 1026). On older hardware the charger rejects the switch.
render:
  - default: |
      type: template
      template: voltie

      # Modbus TCP
      modbus: tcpip
      id: 11
      host:  # Hostname
      port: 502 # Port
    advanced: |
      type: template
      template: voltie

      # Modbus TCP
      modbus: tcpip
      id: 11
      host:  # Hostname
      port: 502 # Port
      cache: 1s # Cache, Time interval for data refresh (optional)
params:
  - name: modbus
    example:
    default:
    choice: ['tcpip']
    unit:
    description: Modbus Type
    help:
    advanced: false
    optional: false
  - name: cache
    example: 5m
    default: 1s
    choice: []
    unit:
    description: Cache
    help: Time interval for data refresh
    advanced: true
    optional: true
modbus:
  delay:
  host:
  id: 11
  modbus: tcpip
  port: 502
  tcpip: true
  timeout: