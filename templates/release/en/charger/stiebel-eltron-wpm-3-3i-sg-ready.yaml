template: stiebel-wpm
product:
  identifier: stiebel-eltron-wpm-3-3i-sg-ready
  brand: Stiebel Eltron
  description: WPM 3/3i (SG Ready)
  group: Heating devices
capabilities: ["dim"]
description: |
  SG Ready control via Modbus with the ISG only works in domestic hot water (DHW) mode and in automatic/programmed mode. In comfort mode, SG Ready commands are ignored. The WPM 3/3i does not provide power consumption via Modbus. Without an additional meter, power is estimated from the charge current.
render:
  - default: |
      type: template
      template: stiebel-wpm

      # Modbus TCP
      modbus: tcpip
      id: 1
      host:  # Hostname
      port: 502 # Port
      tempsource: # Temperature source, [warmwater, buffer] (optional)
params:
  - name: modbus
    example:
    default:
    choice: ['tcpip']
    unit:
    description: Modbus Type
    help:
    advanced: false
    optional: false
  - name: tempsource
    example:
    default:
    choice: ['warmwater', 'buffer']
    unit:
    description: Temperature source
    help:
    advanced: false
    optional: true
modbus:
  delay:
  host:
  id: 1
  modbus: tcpip
  port: 502
  tcpip: true
  timeout: