template: tuya-depow
product:
  identifier: de-mobile-wallbox
  brand: dé
  description: Mobile Wallbox
capabilities: ["meter", "dim"]
requirements: ["sponsorship"]
description: |
  Local connection via the Tuya protocol. Supports devices with Tuya product id `gxrtu5vljdthtd3g` or `witok7vhhjohtr02` (app: "dé EV Charger").
  Device ID and local key must be retrieved once, e.g. using `tinytuya wizard`, which requires an account on the Tuya IoT platform. No cloud access is needed during operation. The device accepts only one local connection at a time, other local integrations (e.g. LocalTuya, Tuya Local) must be disabled.
  Charging is started and paused using the start/stop command of the charger. Schedules in the app must be disabled, since they block charging outside their time window.

render:
  - default: |
      type: template
      template: tuya-depow
      host: 192.0.2.2 # IP address or hostname
      id: # Device ID
      localkey: # Local Key
params:
  - name: host
    example: 192.0.2.2
    default:
    choice: []
    unit:
    description: IP address or hostname
    help:
    advanced: false
    optional: false
  - name: id
    example:
    default:
    choice: []
    unit:
    description: Device ID
    help:
    advanced: false
    optional: false
  - name: localkey
    example:
    default:
    choice: []
    unit:
    description: Local Key
    help:
    advanced: false
    optional: false