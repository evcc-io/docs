template: lambda-zewotherm
product:
  identifier: lambda-eu-l-series
  brand: Lambda
  description: EU-L Series
  group: Heating devices
capabilities: ["meter", "dim"]
description: |
  Energy management settings of the device:

  - E-Meter communication type: "ModBus Client"
  - E-Meter measuring point: "Energy-Input"

render:
  - default: |
      type: template
      template: lambda-zewotherm

      # Modbus TCP
      modbus: tcpip
      id: 1
      host:  # Hostname
      port: 502 # Port
      tempsource: # Temperature source, [warmwater_top, warmwater_bottom, buffer_top, buffer_bottom] (optional)
      firmware: <1.1.3 # Firmware version. Choose '>=1.1.3' for word-swap, [<1.1.3, >=1.1.3] (optional)
    advanced: |
      type: template
      template: lambda-zewotherm

      # Modbus TCP
      modbus: tcpip
      id: 1
      host:  # Hostname
      port: 502 # Port
      tempsource: # Temperature source, [warmwater_top, warmwater_bottom, buffer_top, buffer_bottom] (optional)
      firmware: <1.1.3 # Firmware version. Choose '>=1.1.3' for word-swap, [<1.1.3, >=1.1.3] (optional)
      excess: plus # deprecated, set for neg. e-excess to minus, [plus, minus] (optional)
      watchdog: 60s # Watchdog, optional
params:
  - name: modbus
    example:
    default:
    choice: ['tcpip']
    unit:
    description: Modbus Type
    help:
    advanced: false
    optional: false
  - name: tempsource
    example:
    default:
    choice: ['warmwater_top', 'warmwater_bottom', 'buffer_top', 'buffer_bottom']
    unit:
    description: Temperature source
    help:
    advanced: false
    optional: true
  - name: firmware
    example:
    default: <1.1.3
    choice: ['<1.1.3', '>=1.1.3']
    unit:
    description: Firmware version. Choose '>=1.1.3' for word-swap
    help:
    advanced: false
    optional: true
  - name: excess
    example:
    default: plus
    choice: ['plus', 'minus']
    unit:
    description: deprecated, set for neg. e-excess to minus
    help:
    advanced: true
    optional: true
  - name: watchdog
    example:
    default: 60s
    choice: []
    unit:
    description: Watchdog
    help:
    advanced: true
    optional: true
modbus:
  delay:
  host:
  id: 1
  modbus: tcpip
  port: 502
  tcpip: true
  timeout: