template: homeassistant
product:
  identifier: home-assistant
  brand: Home Assistant
  group: Generic support
requirements: ["skiptest"]
description: |
  Home Assistant instances in your network will be auto-discovered and suitable entities (e.g. `sensor.*`) will be suggested.
render:
  - default: |
      type: template
      template: homeassistant
      uri: http://homeassistant.local:8123 # Home Assistant URI
      temp: sensor.boiler_temperature # Temperature Entity, Entity ID for temperature measurement in °C
    advanced: |
      type: template
      template: homeassistant
      uri: http://homeassistant.local:8123 # Home Assistant URI
      temp: sensor.boiler_temperature # Temperature Entity, Entity ID for temperature measurement in °C
      insecure: # Accept self-signed certificates, optional
params:
  - name: uri
    example: http://homeassistant.local:8123
    default:
    choice: []
    unit:
    description: Home Assistant URI
    help:
    advanced: false
    optional: false
  - name: temp
    example: sensor.boiler_temperature
    default:
    choice: []
    unit:
    description: Temperature Entity
    help: Entity ID for temperature measurement in °C
    advanced: false
    optional: false
  - name: insecure
    example:
    default:
    choice: []
    unit:
    description: Accept self-signed certificates
    help:
    advanced: true
    optional: true