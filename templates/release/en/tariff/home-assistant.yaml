template: homeassistant
product:
  identifier: home-assistant
  brand: Home Assistant
  group: PV forecast
requirements: ["skiptest"]
description: |
  Uses the solar forecast that is selected for the solar production in the Home Assistant Energy dashboard, e.g. from Forecast.Solar, Solcast or Helios Forecast. Several forecasts are added up. Values are hourly.
render:
  - default: |
      type: template
      template: homeassistant
      uri: http://homeassistant.local:8123 # Home Assistant URI
    advanced: |
      type: template
      template: homeassistant
      uri: http://homeassistant.local:8123 # Home Assistant URI
      insecure: # Accept self-signed certificates, optional
      interval: 1h # Interval, optional
params:
  - name: uri
    example: http://homeassistant.local:8123
    default:
    choice: []
    unit:
    description: Home Assistant URI
    help:
    advanced: false
    optional: false
  - name: insecure
    example:
    default:
    choice: []
    unit:
    description: Accept self-signed certificates
    help:
    advanced: true
    optional: true
  - name: interval
    example:
    default: 1h
    choice: []
    unit:
    description: Interval
    help:
    advanced: true
    optional: true