template: edf-tempo
product:
  identifier: edf-tempo
  brand: EDF
  description: Tempo
  group: Dynamic electricity price
countries: ["FR"]
requirements: ["skiptest"]
description: |
  EDF Tempo prices based on the daily colour (blue, white, red) announced the day before. Defaults are the regulated EDF prices incl. taxes from 1 August 2026. Check them against your current price list.
render:
  - default: |
      type: template
      template: edf-tempo
      bluehp: 0.1654 # Blue day, peak hours, 06:00 – 22:00 (optional)
      bluehc: 0.1356 # Blue day, off-peak hours, 22:00 – 06:00 (optional)
      whitehp: 0.1921 # White day, peak hours, 06:00 – 22:00 (optional)
      whitehc: 0.1536 # White day, off-peak hours, 22:00 – 06:00 (optional)
      redhp: 0.7295 # Red day, peak hours, 06:00 – 22:00 (optional)
      redhc: 0.1615 # Red day, off-peak hours, 22:00 – 06:00 (optional)
    advanced: |
      type: template
      template: edf-tempo
      bluehp: 0.1654 # Blue day, peak hours, 06:00 – 22:00 (optional)
      bluehc: 0.1356 # Blue day, off-peak hours, 22:00 – 06:00 (optional)
      whitehp: 0.1921 # White day, peak hours, 06:00 – 22:00 (optional)
      whitehc: 0.1536 # White day, off-peak hours, 22:00 – 06:00 (optional)
      redhp: 0.7295 # Red day, peak hours, 06:00 – 22:00 (optional)
      redhc: 0.1615 # Red day, off-peak hours, 22:00 – 06:00 (optional)
      charges: # Charge, Additional fixed charge per kWh (optional)
      chargesZones: # Charges zones, Time-based grid fees that override the default charge. (optional)
      tax: # Tax, Additional percentage charge (e.g. 0.2 for 20%) (optional)
      formula: math.Max((price + charges) * (1 + tax), 0.0) # Formula, Individual formula for calculating the price (optional)
      average: # Average by hour, optional
