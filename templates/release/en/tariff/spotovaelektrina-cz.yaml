template: spotovaelektrina
product:
  identifier: spotovaelektrina-cz
  brand: spotovaelektrina.cz
  group: Dynamic electricity price
countries: ["CZ"]
requirements: ["skiptest"]
description: |
  Czech spot prices in 15-minute intervals, excluding VAT and additional charges. The API provider asks users to notify [info@spotovaelektrina.cz](mailto:info@spotovaelektrina.cz).
render:
  - default: |
      type: template
      template: spotovaelektrina
      currency: CZK # Currency, [CZK, EUR]
    advanced: |
      type: template
      template: spotovaelektrina
      currency: CZK # Currency, [CZK, EUR]
      charges: # Charge, Additional fixed charge per kWh (optional)
      chargesZones: # Charges zones, Time-based grid fees that override the default charge. (optional)
      tax: # Tax, Additional percentage charge (e.g. 0.2 for 20%) (optional)
      formula: math.Max((price + charges) * (1 + tax), 0.0) # Formula, Individual formula for calculating the price (optional)
      average: # Average by hour, optional
params:
  - name: currency
    example:
    default: CZK
    choice: ['CZK', 'EUR']
    unit:
    description: Currency
    help:
    advanced: false
    optional: false
  - name: charges
    example:
    default:
    choice: []
    unit:
    description: Charge
    help: Additional fixed charge per kWh
    advanced: true
    optional: true
  - name: chargesZones
    example:
    default:
    choice: []
    unit:
    description: Charges zones
    help: Time-based grid fees that override the default charge.
    advanced: true
    optional: true
  - name: tax
    example:
    default:
    choice: []
    unit:
    description: Tax
    help: Additional percentage charge (e.g. 0.2 for 20%)
    advanced: true
    optional: true
  - name: formula
    example: math.Max((price + charges) * (1 + tax), 0.0)
    default:
    choice: []
    unit:
    description: Formula
    help: Individual formula for calculating the price
    advanced: true
    optional: true
  - name: average
    example:
    default:
    choice: []
    unit:
    description: Average by hour
    help:
    advanced: true
    optional: true