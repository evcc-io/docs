template: energyforecast
product:
  identifier: energy-forecast
  brand: Energy Forecast
  group: Dynamic electricity price
link: https://www.energyforecast.de
countries: ["DE", "LU", "AT", "FR", "NL", "BE", "PL", "DK", "CH", "CZ", "HU", "SI", "IT", "NO", "SE"]
requirements: ["skiptest"]
description: |
  Charges and tax not set here are taken from your energyforecast.de profile. When setting a charge, also set the tax, otherwise the charge is not taxed.
render:
  - default: |
      type: template
      template: energyforecast
      token: # Token
      domain: # Domain, [DE-LU, AT, FR, NL, BE, PL, DK1, DK2, CH, CZ, HU, SI, IT-North, NO2, SE4] (optional)
    advanced: |
      type: template
      template: energyforecast
      token: # Token
      domain: # Domain, [DE-LU, AT, FR, NL, BE, PL, DK1, DK2, CH, CZ, HU, SI, IT-North, NO2, SE4] (optional)
      charges: # Charge, Additional fixed charge per kWh (optional)
      chargesZones: # Charges zones, Time-based grid fees that override the default charge. (optional)
      tax: # Tax, Additional percentage charge (e.g. 0.2 for 20%) (optional)
      formula: math.Max((price + charges) * (1 + tax), 0.0) # Formula, Individual formula for calculating the price (optional)
      average: # Average by hour, optional
params:
  - name: token
    example:
    default:
    choice: []
    unit:
    description: Token
    help:
    advanced: false
    optional: false
  - name: domain
    example:
    default:
    choice: ['DE-LU', 'AT', 'FR', 'NL', 'BE', 'PL', 'DK1', 'DK2', 'CH', 'CZ', 'HU', 'SI', 'IT-North', 'NO2', 'SE4']
    unit:
    description: Domain
    help:
    advanced: false
    optional: true
  - name: charges
    example:
    default:
    choice: []
    unit:
    description: Charge
    help: Additional fixed charge per kWh
    advanced: true
    optional: true
  - name: chargesZones
    example:
    default:
    choice: []
    unit:
    description: Charges zones
    help: Time-based grid fees that override the default charge.
    advanced: true
    optional: true
  - name: tax
    example:
    default:
    choice: []
    unit:
    description: Tax
    help: Additional percentage charge (e.g. 0.2 for 20%)
    advanced: true
    optional: true
  - name: formula
    example: math.Max((price + charges) * (1 + tax), 0.0)
    default:
    choice: []
    unit:
