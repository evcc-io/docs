template: semp-sma
product:
  identifier: sma-ev-charger-semp
  brand: SMA
  description: EV Charger (SEMP)
capabilities: ["mA", "1p3p", "meter", "dim"]
requirements: ["sponsorship", "skiptest"]
description: |
  Konfiguriere die SEMP Basis-URL (`http://<charger-host>/SEMP`) und die Geräte-ID des Chargers.
  WICHTIG: Der Charger darf NICHT gleichzeitig im Sunny Home Manager bzw. im Sunny Portal direkt als Verbraucher registriert sein!

  Einrichtung beim "SMA EV Charger":
  1. Drehschalter an der Wallbox auf PV/Eco-Laden stellen.
  2. Wallbox im Sunny Portal deaktivieren (kann später über evcc wieder hinzugefügt werden).
  3. "Betrieb mit Netzanschlusspunktzähler" auf "Ja" stellen und einen Zähler einrichten über "Konfiguration -> Parameter -> Zählerkonfiguration" (SMA Sunny Home Manager 2 oder Energy Meter). Erst dadurch wird die SEMP-Schnittstelle freigegeben.
  4. "Ladefreigabe über App" auf "Nein" stellen.
  5. "Trennung nach Vollladung" auf "Nein" stellen.
  6. Geräteneustart auslösen und warten, bis das Gerät wieder online ist.
  7. Die Wallbox in evcc anlegen und prüfen/speichern (eventuell muss ein Fahrzeug angeschlossen sein, damit die SEMP-Schnittstelle den richtigen Status zurückgibt).

render:
  - default: |
      type: template
      template: semp-sma
      uri: http://192.168.178.100/SEMP # SEMP Basis-URL, HTTP(S) Adresse
params:
  - name: uri
    example: http://192.168.178.100/SEMP
    default:
    choice: []
    unit:
    description: SEMP Basis-URL
    help: HTTP(S) Adresse
    advanced: false
    optional: false