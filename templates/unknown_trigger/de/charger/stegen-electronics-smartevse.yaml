template: smart-evse
product:
  identifier: stegen-electronics-smartevse
  brand: Stegen Electronics
  description: SmartEVSE
capabilities: ["mA", "rfid", "1p3p", "dim"]
description: |
  Anbindung über die REST API mit Firmware >= 3.11.2.
  Das Gerät wird in den konfigurierten Modus versetzt und steuert den Ladestrom über `override_current`.

render:
  - default: |
      type: template
      template: smart-evse
      host: 192.0.2.2 # IP-Adresse oder Hostname
    advanced: |
      type: template
      template: smart-evse
      host: 192.0.2.2 # IP-Adresse oder Hostname
      cache: 1s # Cache, Zeitintervall für erneute Datenabfrage (optional)
      chargeMode: normal # Lademodus, [normal, smart] (optional)
params:
  - name: host
    example: 192.0.2.2
    default:
    choice: []
    unit:
    description: IP-Adresse oder Hostname
    help:
    advanced: false
    optional: false
  - name: cache
    example: 5m
    default: 1s
    choice: []
    unit:
    description: Cache
    help: Zeitintervall für erneute Datenabfrage
    advanced: true
    optional: true
  - name: chargeMode
    example:
    default: normal
    choice: ['normal', 'smart']
    unit:
    description: Lademodus
    help:
    advanced: true
    optional: true