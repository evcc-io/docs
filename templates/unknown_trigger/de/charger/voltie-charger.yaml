template: voltie
product:
  identifier: voltie-charger
  brand: Voltie
  description: Charger
capabilities: ["mA", "1p3p", "meter", "dim"]
requirements: ["sponsorship"]
description: |
  Modbus muss in der Voltie App im Modbus-Konfigurationsbildschirm auf "TCP" gestellt werden; die dort eingestellte Slave-Adresse (Standard 11) muss mit der ID übereinstimmen. Der Kommunikations-Timeout regelt die Ladung nach Verbindungsverlust auf 0 A herunter, er muss daher auf 0 gesetzt (deaktiviert) oder größer als das evcc-Aktualisierungsintervall gewählt werden. Benötigt EVSE-Firmware 350 oder neuer und Ladegerät-Software 1.3.40 oder neuer. Phasenumschaltung, Gesamtzähler, Phasenleistungen und die Strom-Grenzwerte benötigen EVSE-Firmware 352 oder neuer.
caveats:
  - description: |
      Der Auto-Start des Ladegeräts wird beim Start von evcc dauerhaft deaktiviert und muss nach dem Entfernen von evcc in der Voltie App wieder eingeschaltet werden.
  - description: |
      Das Modbus-TCP-Gateway leitet höchstens zwei Transaktionen pro Sekunde weiter. Kürzere Abfrageintervalle führen zu Zeitüberschreitungen, nicht zu aktuelleren Daten.
  - description: |
      Die Phasenumschaltung ist nur auf Ladegeräten ab Baujahr 2026 verfügbar (Seriennummer beginnt mit 1026). Auf älteren Geräten weist das Ladegerät die Umschaltung ab.
render:
  - default: |
      type: template
      template: voltie

      # Modbus TCP
      modbus: tcpip
      id: 11
      host:  # Hostname
      port: 502 # Port
    advanced: |
      type: template
      template: voltie

      # Modbus TCP
      modbus: tcpip
      id: 11
      host:  # Hostname
      port: 502 # Port
      cache: 1s # Cache, Zeitintervall für erneute Datenabfrage (optional)
      phases1p3p: false # Phasenumschaltung, Nur auf Ladegeräten ab Baujahr 2026 verfügbar, deren Seriennummer mit 1026 beginnt. Auf älterer Hardware weist das Ladegerät die Umschaltung ab. (optional)
params:
  - name: modbus
    example:
    default:
    choice: ['tcpip']
    unit:
    description: Modbus Typ
    help:
    advanced: false
    optional: false
  - name: cache
    example: 5m
    default: 1s
    choice: []
    unit:
    description: Cache
    help: Zeitintervall für erneute Datenabfrage
    advanced: true
    optional: true
  - name: phases1p3p
    example:
    default: false
    choice: []
    unit:
    description: Phasenumschaltung
    help: Nur auf Ladegeräten ab Baujahr 2026 verfügbar, deren Seriennummer mit 1026 beginnt. Auf älterer Hardware weist das Ladegerät die Umschaltung ab.
    advanced: true
    optional: true
modbus:
  delay:
  host:
  id: 11
  modbus: tcpip
  port: 502
  tcpip: true
  timeout: