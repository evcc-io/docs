template: sigenergy-evdc
product:
  identifier: sigenergy-evdc
  brand: Sigenergy
  description: EVDC
capabilities: ["mA", "meter", "dim"]
requirements: ["sponsorship"]
description: |
  Modbus TCP muss in der Konfigurations-App mit Installateursrechten aktiviert werden. Die Modbus-ID ist die des Hybrid-Wechselrichters, an dem der EVDC angeschlossen ist. Benötigt aktuelle Firmware (Modbus-Protokoll V2.9).
render:
  - default: |
      type: template
      template: sigenergy-evdc

      # Modbus TCP
      modbus: tcpip
      id: 1
      host:  # Hostname
      port: 502 # Port
params:
  - name: modbus
    example:
    default:
    choice: ['tcpip']
    unit:
    description: Modbus Typ
    help:
    advanced: false
    optional: false
modbus:
  delay:
  host:
  id: 1
  modbus: tcpip
  port: 502
  tcpip: true
  timeout: