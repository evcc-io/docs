template: fronius-argeno
product:
  identifier: fronius-argeno
  brand: Fronius
  description: Argeno
description: |
  Modbus TCP muss am Wechselrichter aktiviert sein (Konfiguration → Kommunikation → Ethernet → Modbus TCP/UDP). Für den Netzzähler siehe Template „Fronius Smart Meter IP" — der Argeno nutzt den Smart Meter IP als eigenständiges Netzwerkgerät.

render:
  - usage: pv
    default: |
      type: template
      template: fronius-argeno
      usage: pv
      host: 192.0.2.2 # IP-Adresse oder Hostname
      port: 502 # Port, optional
params:
  - name: host
    example: 192.0.2.2
    default:
    choice: []
    unit:
    description: IP-Adresse oder Hostname
    help:
    advanced: false
    optional: false
  - name: port
    example:
    default: 502
    choice: []
    unit:
    description: Port
    help:
    advanced: false
    optional: true