template: zendure-solarflow-pro
product:
  identifier: zendure-solarflow-800-pro
  brand: Zendure
  description: Solarflow 800 Pro
capabilities: ["battery-control"]
description: |
  Für die aktive Batteriesteuerung muss die lokale API über die Zendure App aktiviert werden (HEMS hinzufügen und wieder verlassen).
  Die Seriennummer des Geräts ist in der Zendure App in den Geräteeinstellungen zu finden.

render:
  - usage: pv
    default: |
      type: template
      template: zendure-solarflow-pro
      usage: pv
      host: 192.0.2.2 # IP-Adresse oder Hostname
    advanced: |
      type: template
      template: zendure-solarflow-pro
      usage: pv
      host: 192.0.2.2 # IP-Adresse oder Hostname
      maxacpower: 800 # Maximale AC Leistung des Hybrid-Wechselrichters (W), optional
      cache: 1s # Cache, Zeitintervall für erneute Datenabfrage (optional)
  - usage: battery
    default: |
      type: template
      template: zendure-solarflow-pro
      usage: battery
      host: 192.0.2.2 # IP-Adresse oder Hostname
      serial: WOB1NHMAMXXXXX3 # Seriennummer, Nur für die aktive Batteriesteuerung. Seriennummer des Geräts (zu finden in der Zendure App) (optional)
      capacity: 1.92 # Akkukapazität (kWh), optional
      minsoc: 25 # Minimaler Ladestand (%), Untere Grenze beim Entladen der Batterie im normalen Betrieb (optional)
      maxsoc: 95 # Maximaler Ladestand (%), Oberes Limit beim Laden der Batterie aus dem Netz (optional)
    advanced: |
      type: template
      template: zendure-solarflow-pro
      usage: battery
      host: 192.0.2.2 # IP-Adresse oder Hostname
      serial: WOB1NHMAMXXXXX3 # Seriennummer, Nur für die aktive Batteriesteuerung. Seriennummer des Geräts (zu finden in der Zendure App) (optional)
      capacity: 1.92 # Akkukapazität (kWh), optional
      minsoc: 25 # Minimaler Ladestand (%), Untere Grenze beim Entladen der Batterie im normalen Betrieb (optional)
      maxsoc: 95 # Maximaler Ladestand (%), Oberes Limit beim Laden der Batterie aus dem Netz (optional)
      maxchargepower: 1000 # Maximale Ladeleistung (W), Für erzwungenes Laden des Speichers. (optional)
      maxdischargepower: # Maximale Entladeleistung (W), Maximale Entladeleistung des Speichers. (optional)
      cache: 1s # Cache, Zeitintervall für erneute Datenabfrage (optional)
params:
  - name: host
    example: 192.0.2.2
    default:
    choice: []
    unit:
    description: IP-Adresse oder Hostname
    help:
    advanced: false
    optional: false
  - name: serial
    example: WOB1NHMAMXXXXX3
    default:
    choice: []
    unit:
    description: Seriennummer
    help: Nur für die aktive Batteriesteuerung. Seriennummer des Geräts (zu finden in der Zendure App)
    advanced: false
    optional: true
  - name: capacity
    example: 50
    default: 1.92
    choice: []
    unit: kWh
    description: Akkukapazität
    help:
    advanced: false
    optional: true
  - name: minsoc
    example: 25
    default:
    choice: []
    unit: '%'
    description: Minimaler Ladestand
    help: Untere Grenze beim Entladen der Batterie im normalen Betrieb
    advanced: false
    optional: true
  - name: maxsoc
    example: 95
    default:
    choice: []
    unit: '%'
    description: Maximaler Ladestand
    help: Oberes Limit beim Laden der Batterie aus dem Netz
    advanced: false
    optional: true
  - name: maxacpower
    example: 5000
    default: 800
    choice: []
    unit: W
    description: Maximale AC Leistung des Hybrid-Wechselrichters
    help:
    advanced: true
    optional: true
  - name: maxchargepower
    example:
    default: 1000
    choice: []
    unit: W
    description: Maximale Ladeleistung
    help: Für erzwungenes Laden des Speichers.
    advanced: true
    optional: true
  - name: maxdischargepower
    example:
    default:
    choice: []
    unit: W
    description: Maximale Entladeleistung
    help: Maximale Entladeleistung des Speichers.
    advanced: true
    optional: true
  - name: cache
    example: 5m
    default: 1s
    choice: []
    unit:
    description: Cache
    help: Zeitintervall für erneute Datenabfrage
    advanced: true
    optional: true