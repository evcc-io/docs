      template: sunenergyxt-500
      usage: grid
      model: # Modell, `standard` für die SunEnergyXT 500, `pro` für die SunEnergyXT 500 PRO. Bestimmt die maximale AC- und Entladeleistung (800 W bzw. 2400 W). [standard, pro]
      host: 192.0.2.2 # IP-Adresse oder Hostname
    advanced: |
