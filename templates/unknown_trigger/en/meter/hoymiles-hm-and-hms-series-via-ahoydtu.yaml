template: hoymiles-ahoydtu
product:
  identifier: hoymiles-hm-and-hms-series-via-ahoydtu
  brand: Hoymiles
  description: HM & HMS Series (via AhoyDTU)
render:
  - usage: pv
    default: |
      type: template
      template: hoymiles-ahoydtu
      usage: pv
      host: 192.0.2.2 # IP address or hostname
      id: 0 # Inverter ID, If multiple exist. The numbering starts at 0. See AhoyDTU webinterface -> Inverter #[ID] (optional)
    advanced: |
      type: template
      template: hoymiles-ahoydtu
      usage: pv
      host: 192.0.2.2 # IP address or hostname
      id: 0 # Inverter ID, If multiple exist. The numbering starts at 0. See AhoyDTU webinterface -> Inverter #[ID] (optional)
      cache: 1s # Cache, Time interval for data refresh (optional)
params:
  - name: host
    example: 192.0.2.2
    default:
    choice: []
    unit:
    description: IP address or hostname
    help:
    advanced: false
    optional: false
  - name: id
    example:
    default: 0
    choice: []
    unit:
    description: Inverter ID
    help: 'If multiple exist. The numbering starts at 0. See AhoyDTU webinterface -> Inverter #[ID]'
    advanced: false
    optional: true
  - name: cache
    example: 5m
    default: 1s
    choice: []
    unit:
    description: Cache
    help: Time interval for data refresh
    advanced: true
    optional: true