template: semp-sma
product:
  identifier: sma-ev-charger-semp
  brand: SMA
  description: EV Charger (SEMP)
capabilities: ["mA", "1p3p", "meter", "dim"]
requirements: ["sponsorship", "skiptest"]
description: |
  Configure the SEMP base URL (`http://<charger-host>/SEMP`) and the device ID of the charger.
  IMPORTANT: The charger must NOT be registered directly as a consumer in the Sunny Home Manager / Sunny Portal at the same time!

  Setup on the "SMA EV Charger":
  1. Set the rotary switch on the wallbox to PV/Eco charging.
  2. Deactivate the wallbox in the Sunny Portal (it can be added back via evcc later).
  3. Set "Operation with grid connection point meter" to "Yes" and set up a meter (SMA Sunny Home Manager 2 or Energy Meter) under "Configuration -> Parameters -> Meter configuration". This is required for the SEMP interface to be enabled.
  4. Set "Charging release via app" to "No".
  5. Set "Disconnect after full charge" to "No".
  6. Restart the device and wait for it to come back online.
  7. Add the charger in evcc and check/save the configuration (a vehicle may need to be connected for the SEMP interface to report the correct status).

render:
  - default: |
      type: template
      template: semp-sma
      uri: http://192.168.178.100/SEMP # SEMP base URL, HTTP(S) address
params:
  - name: uri
    example: http://192.168.178.100/SEMP
    default:
    choice: []
    unit:
    description: SEMP base URL
    help: HTTP(S) address
    advanced: false
    optional: false