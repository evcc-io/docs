template: smart-evse
product:
  identifier: stegen-electronics-smartevse
  brand: Stegen Electronics
  description: SmartEVSE
capabilities: ["mA", "rfid", "1p3p", "dim"]
description: |
  Uses the REST API, requires firmware >= 3.11.2.
  The device is put into the configured mode and controls the charge current via `override_current`.

render:
  - default: |
      type: template
      template: smart-evse
      host: 192.0.2.2 # IP address or hostname
    advanced: |
      type: template
      template: smart-evse
      host: 192.0.2.2 # IP address or hostname
      cache: 1s # Cache, Time interval for data refresh (optional)
      chargeMode: normal # Charge mode, [normal, smart] (optional)
params:
  - name: host
    example: 192.0.2.2
    default:
    choice: []
    unit:
    description: IP address or hostname
    help:
    advanced: false
    optional: false
  - name: cache
    example: 5m
    default: 1s
    choice: []
    unit:
    description: Cache
    help: Time interval for data refresh
    advanced: true
    optional: true
  - name: chargeMode
    example:
    default: normal
    choice: ['normal', 'smart']
    unit:
    description: Charge mode
    help:
    advanced: true
    optional: true