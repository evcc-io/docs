template: foxess-evc
product:
  identifier: foxess-ac-ev-charger-modbus
  brand: FoxESS
  description: AC EV Charger (Modbus)
capabilities: ["mA", "rfid", "meter", "1p3p"]
requirements: ["sponsorship"]
description: |
  The work mode must be set to "Modbus TCP" in the Fox Switch app. How a session starts depends on the charger's own operating mode - start either via app or RFID card, or automatically on plug-in.
render:
  - default: |
      type: template
      template: foxess-evc

      # Modbus TCP
      modbus: tcpip
      id: 1
      host:  # Hostname
      port: 502 # Port
params:
  - name: modbus
    example:
    default:
    choice: ['tcpip']
    unit:
    description: Modbus Type
    help:
    advanced: false
    optional: false
modbus:
  delay:
  host:
  id: 1
  modbus: tcpip
  port: 502
  tcpip: true
  timeout: