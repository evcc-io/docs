template: sigenergy-evdc
product:
  identifier: sigenergy-evdc
  brand: Sigenergy
  description: EVDC
capabilities: ["mA", "meter", "dim"]
requirements: ["sponsorship"]
description: |
  Modbus TCP must be enabled in the configuration app with installer rights. The Modbus ID is that of the hybrid inverter the EVDC is attached to. Requires current firmware (Modbus protocol V2.9).
render:
  - default: |
      type: template
      template: sigenergy-evdc

      # Modbus TCP
      modbus: tcpip
      id: 1
      host:  # Hostname
      port: 502 # Port
params:
  - name: modbus
    example:
    default:
    choice: ['tcpip']
    unit:
    description: Modbus Type
    help:
    advanced: false
    optional: false
modbus:
  delay:
  host:
  id: 1
  modbus: tcpip
  port: 502
  tcpip: true
  timeout: