template: dwd-temperature
product:
  identifier: dwd-bright-sky-temperature
  brand: DWD (Bright Sky) Temperature
  group: Temperature forecast
requirements: ["skiptest"]
description: |
  Outdoor temperature forecast based on Deutscher Wetterdienst (DWD) MOSMIX data, provided as JSON by the free [Bright Sky](https://brightsky.dev) API. No API key required.
render:
  - default: |
      type: template
      template: dwd-temperature
      lat: 55.7351 # Latitude
      lon: 9.1275 # Longitude
    advanced: |
      type: template
      template: dwd-temperature
      lat: 55.7351 # Latitude
      lon: 9.1275 # Longitude
      interval: 1h # Interval, optional
params:
  - name: lat
    example: 55.7351
    default:
    choice: []
    unit:
    description: Latitude
    help:
    advanced: false
    optional: false
  - name: lon
    example: 9.1275
    default:
    choice: []
    unit:
    description: Longitude
    help:
    advanced: false
    optional: false
  - name: interval
    example:
    default: 1h
    choice: []
    unit:
    description: Interval
    help:
    advanced: true
    optional: true