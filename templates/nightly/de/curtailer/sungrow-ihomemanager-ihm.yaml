template: sungrow-ihm
product:
  identifier: sungrow-ihomemanager-ihm
  brand: Sungrow
  description: iHomeManager (iHM)
description: |
  Die Abregelung begrenzt die Einspeiseleistung auf den gewünschten Prozentsatz der Nennleistung der angeschlossenen Wechselrichter.

render:
  - default: |
      type: template
      template: sungrow-ihm

      # RS485 via adapter (Modbus RTU)
      modbus: rs485serial
      id: 247
      device: /dev/ttyUSB0 # USB-RS485 Adapter Adresse
      baudrate: 9600 # Prüfe die Geräteeinstellungen, typische Werte sind 9600, 19200, 38400, 57600, 115200
      comset: "8N1" # Kommunikationsparameter für den Adapter

      # RS485 via TCP/IP (Modbus RTU)
      modbus: rs485tcpip
      id: 247
      host:  # Hostname
      port: 502 # Port

      # Modbus TCP
      modbus: tcpip
      id: 247
      host:  # Hostname
      port: 502 # Port
params:
  - name: modbus
    example:
    default:
    choice: ['tcpip', 'rs485']
    unit:
    description: Modbus Typ
    help:
    advanced: false
    optional: false
modbus:
  baudrate: 9600
  comset: 8N1
  delay:
  device: /dev/ttyUSB0
  host:
  id: 247
  port: 502
  rs485serial: true
  rs485tcpip: true
  tcpip: true
  timeout: