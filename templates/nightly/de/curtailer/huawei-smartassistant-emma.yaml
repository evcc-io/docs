template: huawei-emma
product:
  identifier: huawei-smartassistant-emma
  brand: Huawei
  description: SmartAssistant (EMMA)
description: |
  Die Abregelung begrenzt die Einspeiseleistung auf den gewünschten Prozentsatz der maximalen AC-Leistung der angeschlossenen Wechselrichter.

render:
  - default: |
      type: template
      template: huawei-emma

      # Modbus TCP
      modbus: tcpip
      id: 0
      host:  # Hostname
      port: 502 # Port
params:
  - name: modbus
    example:
    default:
    choice: ['tcpip']
    unit:
    description: Modbus Typ
    help:
    advanced: false
    optional: false
modbus:
  delay:
  host:
  id: 0
  modbus: tcpip
  port: 502
  tcpip: true
  timeout: