template: kaco-nh3
product:
  identifier: kaco-blueplanet-hybrid-nh3
  brand: KACO
  description: blueplanet hybrid NH3
capabilities: ["curtail"]
requirements: ["skiptest"]
description: |
  Für KACO blueplanet Hybrid NH3 mit AI-Dongle/WLAN-Stick. Modbus TCP muss über die IP-Adresse des Sticks erreichbar sein (Port 502, Geräte-ID 3).
  Die Abregelung verwendet die SunSpec-Steuerung des Wechselrichters und begrenzt die Wirkleistung auf den gewünschten Prozentsatz.

render:
  - default: |
      type: template
      template: kaco-nh3

      # Modbus TCP
      modbus: tcpip
      id: 3
      host:  # Hostname
      port: 502 # Port
params:
  - name: modbus
    example:
    default:
    choice: ['tcpip']
    unit:
    description: Modbus Typ
    help:
    advanced: false
    optional: false
modbus:
  delay:
  host:
  id: 3
  modbus: tcpip
  port: 502
  tcpip: true
  timeout: