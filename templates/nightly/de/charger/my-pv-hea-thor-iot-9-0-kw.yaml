template: mypv-hea-90
product:
  identifier: my-pv-hea-thor-iot-9-0-kw
  brand: my-PV
  description: HEA•THOR IoT 9.0 kW
  group: Wärmeerzeuger
capabilities: ["meter"]
requirements: ["sponsorship"]
description: |
  Modbus TCP zur Ansteuerung verwenden und im Ladepunkt `phases: 3` einstellen.
  Die Leistung wird in Stufen von 3, 6 und 9 kW geschaltet. Die Leistungsgrenzen werden automatisch berücksichtigt.
  Das zusätzliche SELV-Relais wird nicht angesteuert.

render:
  - default: |
      type: template
      template: mypv-hea-90

      # Modbus TCP
      modbus: tcpip
      id: 1
      host:  # Hostname
      port: 502 # Port
      tempsource: 1 # Temperaturquelle, [1, 2] (optional)
params:
  - name: modbus
    example:
    default:
    choice: ['tcpip']
    unit:
    description: Modbus Typ
    help:
    advanced: false
    optional: false
  - name: tempsource
    example:
    default: 1
    choice: ['1', '2']
    unit:
    description: Temperaturquelle
    help:
    advanced: false
    optional: true
modbus:
  delay:
  host:
  id: 1
  modbus: tcpip
  port: 502
  tcpip: true
  timeout: