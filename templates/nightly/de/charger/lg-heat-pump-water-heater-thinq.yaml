template: lg-thinq
product:
  identifier: lg-heat-pump-water-heater-thinq
  brand: LG
  description: Warmwasser-Wärmepumpe (ThinQ)
  group: Wärmeerzeuger
description: |
  Steuert LG Warmwasser-Wärmepumpen (z.B. WH27S) über die LG ThinQ Connect Cloud API.
  Ein persönlicher Zugriffstoken (PAT) muss unter https://connect-pat.lgthinq.com mit den Rechten "Geräte anzeigen", "Gerätestatus abfragen" und "Geräte steuern" erstellt werden.
  evcc setzt die Zieltemperatur des Warmwasserbereiters: außerhalb des Boosts auf die normale Temperatur, während des Boosts auf die Boost Temperatur.

render:
  - default: |
      type: template
      template: lg-thinq
      token: # Persönlicher Zugriffstoken (PAT)
      country: DE # Ländercode, Ländercode des LG Kontos (ISO 3166-1 alpha-2) (optional)
      device: # Geräte-ID, Notwendig falls mehrere Warmwasserbereiter im Konto vorhanden sind (optional)
      normal: 50 # Normale Temperatur (°C), Zieltemperatur außerhalb des Boosts (optional)
      setpoint: 60 # Boost Temperatur (°C), Zieltemperatur während des Boosts, muss über der normalen Temperatur liegen (optional)
    advanced: |
      type: template
      template: lg-thinq
      token: # Persönlicher Zugriffstoken (PAT)
      country: DE # Ländercode, Ländercode des LG Kontos (ISO 3166-1 alpha-2) (optional)
      device: # Geräte-ID, Notwendig falls mehrere Warmwasserbereiter im Konto vorhanden sind (optional)
      normal: 50 # Normale Temperatur (°C), Zieltemperatur außerhalb des Boosts (optional)
      setpoint: 60 # Boost Temperatur (°C), Zieltemperatur während des Boosts, muss über der normalen Temperatur liegen (optional)
      cache: 1m # Cache, Zeitintervall für erneute Datenabfrage (optional)
params:
  - name: token
    example:
    default:
    choice: []
    unit:
    description: Persönlicher Zugriffstoken (PAT)
    help:
    advanced: false
    optional: false
  - name: country
    example:
    default: DE
    choice: []
    unit:
    description: Ländercode
    help: Ländercode des LG Kontos (ISO 3166-1 alpha-2)
    advanced: false
    optional: true
  - name: device
    example:
    default:
    choice: []
    unit:
    description: Geräte-ID
    help: Notwendig falls mehrere Warmwasserbereiter im Konto vorhanden sind
    advanced: false
    optional: true
  - name: normal
    example:
    default: 50
    choice: []
    unit: °C
    description: Normale Temperatur
    help: Zieltemperatur außerhalb des Boosts
    advanced: false
    optional: true
  - name: setpoint
    example:
    default: 60
    choice: []
    unit: °C
    description: Boost Temperatur
    help: Zieltemperatur während des Boosts, muss über der normalen Temperatur liegen
    advanced: false
    optional: true
  - name: cache
    example: 5m
    default: 1m
    choice: []
    unit:
    description: Cache
    help: Zeitintervall für erneute Datenabfrage
    advanced: true
    optional: true