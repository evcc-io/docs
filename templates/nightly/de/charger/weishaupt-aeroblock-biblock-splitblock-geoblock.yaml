      type: template
      template: weishaupt

      # Modbus TCP
      modbus: tcpip
      id: 1
      host:  # Hostname
      port: 502 # Port
      tempsource: warmwater # Temperaturquelle, [warmwater, buffer, flow, outside] (optional)
params:
  - name: modbus
    example:
    default:
    choice: ['tcpip']
    unit:
    description: Modbus Typ
    help:
    advanced: false
    optional: false
  - name: tempsource
    example:
    default: warmwater
    choice: ['warmwater', 'buffer', 'flow', 'outside']
    unit:
    description: Temperaturquelle
    help:
    advanced: false
    optional: true
