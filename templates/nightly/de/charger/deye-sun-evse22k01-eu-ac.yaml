template: deye-evse
product:
  identifier: deye-sun-evse22k01-eu-ac
  brand: Deye
  description: SUN-EVSE22K01-EU-AC
capabilities: ["mA", "meter"]
requirements: ["sponsorship"]
description: |
  Die Verbindung erfolgt über den Solarman-WLAN-Logger der Wallbox (Port 8899). Die Register sind nicht offiziell dokumentiert, sondern per Reverse Engineering ermittelt.
  Der Kommunikationsmodus der Wallbox muss auf "WiFi" stehen, im Modus "LoRa" überschreibt der Wechselrichter die Leistungsvorgabe von evcc.

render:
  - default: |
      type: template
      template: deye-evse
      host: 192.0.2.2 # IP-Adresse oder Hostname
      serial: 1234567890 # Seriennummer, Seriennummer des WLAN-Loggers. Sie wird auf dessen Statusseite unter Geräteinformationen angezeigt.
    advanced: |
      type: template
      template: deye-evse
      host: 192.0.2.2 # IP-Adresse oder Hostname
      serial: 1234567890 # Seriennummer, Seriennummer des WLAN-Loggers. Sie wird auf dessen Statusseite unter Geräteinformationen angezeigt.
      port: 8899 # Port, optional
      id: 162 # ID, optional
