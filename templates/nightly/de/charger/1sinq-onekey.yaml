template: onekey
product:
  identifier: 1sinq-onekey
  brand: 1SINQ
  description: OneKey
  group: Wärmeerzeuger
capabilities: ["meter", "dim"]
requirements: ["skiptest"]
description: |
  OneKey-Heizungsregelung mit aktivierter evcc-Anbindung. Die Wärmepumpe
  wird über SG-Ready-Zustände geführt (1=Dimmen, 2=Normal, 3=Boost).
  Dazu muss im OneKey-Gerät der Energiemanager im Modus SG-Ready laufen
  und evcc als SG-Ready-Quelle eingestellt sein. Läuft evcc auf dem
  OneKey-Gerät selbst, ist der Broker `localhost`.

render:
  - default: |
      type: template
      template: onekey
      host: 192.0.2.2 # IP-Adresse oder Hostname, IP Adresse oder der Hostname des MQTT Brokers
      port: 1883 # Port, MQTT Broker Port (optional)
      topic: onekey # Basis-Topic des OneKey-Geräts, Topic (ohne / am Anfang) (optional)
      timeout: 90s # Zeitüberschreitung, Ab wann ein Messwert als veraltet gilt — Standard 90 s, das Dreifache des 30-s-Herzschlags des Geräts (optional)
    advanced: |
      type: template
      template: onekey
      host: 192.0.2.2 # IP-Adresse oder Hostname, IP Adresse oder der Hostname des MQTT Brokers
      port: 1883 # Port, MQTT Broker Port (optional)
      topic: onekey # Basis-Topic des OneKey-Geräts, Topic (ohne / am Anfang) (optional)
      timeout: 90s # Zeitüberschreitung, Ab wann ein Messwert als veraltet gilt — Standard 90 s, das Dreifache des 30-s-Herzschlags des Geräts (optional)
      user: # Benutzerkonto, bspw. E-Mail Adresse, User Id, etc. (optional)
      password: # Passwort, Zugangspasswort des Dienstes (optional)
params:
  - name: host
    example: 192.0.2.2
    default:
    choice: []
    unit:
    description: IP-Adresse oder Hostname
    help: IP Adresse oder der Hostname des MQTT Brokers
    advanced: false
    optional: false
  - name: port
    example:
    default: 1883
    choice: []
    unit:
    description: Port
    help: MQTT Broker Port
    advanced: false
    optional: true
  - name: topic
    example:
    default: onekey
    choice: []
    unit:
    description: Basis-Topic des OneKey-Geräts
    help: Topic (ohne / am Anfang)
    advanced: false
    optional: true
  - name: timeout
    example: 10s
    default: 90s
    choice: []
    unit:
    description: Zeitüberschreitung
    help: Ab wann ein Messwert als veraltet gilt — Standard 90 s, das Dreifache des 30-s-Herzschlags des Geräts
    advanced: false
    optional: true
  - name: user
    example:
    default:
    choice: []
    unit:
    description: Benutzerkonto
    help: bspw. E-Mail Adresse, User Id, etc.
    advanced: true
    optional: true
  - name: password
    example:
    default:
    choice: []
    unit:
    description: Passwort
    help: Zugangspasswort des Dienstes
    advanced: true
    optional: true