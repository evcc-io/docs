template: nibe-s-series
product:
  identifier: nibe-nibe-s-series-sg-ready
  brand: NIBE
  description: Nibe S-Series (SG Ready)
  group: Wärmeerzeuger
capabilities: ["dim"]
description: |
  Modbus Verbindung zur NIBE S Wärmepumpe.
  Firmware 4.13.12 oder neuer benötigt.
  Benötigte Einstellungen in der Steuereinheit:
  - In der Inneneinheit muss im Menü 7.5.9 Modbus aktiviert sein.
  - Zur Verwendung der Leistungssteuerung muss im Menü 7.4 unter dem Punkt AUX von Modbus ext. Leistungsbegrenzung ausgewählt sein. In den Ladepunkteinstellungen muss die minimale Leistung des Heizstabs eingestellt werden.
  - Im Menü 7.4 dürfen die Optionen SG-Ready A und SG-Ready B nicht vergeben sein.
  - Im Menü 4.2.3 muss die Option "SG-Ready via API aktivieren" aktiv sein.

render:
  - default: |
      type: template
      template: nibe-s-series

      # Modbus TCP
      modbus: tcpip
      id: 1
      host:  # Hostname
      port: 502 # Port
      tempsource: water_mid # Temperatursensor, [water_top, water_mid]
      powercontrol: true # Leistungssteuerung
params:
  - name: modbus
    example:
    default:
    choice: ['tcpip']
    unit:
    description: Modbus Typ
    help:
    advanced: false
    optional: false
  - name: tempsource
    example:
    default: water_mid
    choice: ['water_top', 'water_mid']
    unit:
    description: Temperatursensor
    help:
    advanced: false
    optional: false
  - name: powercontrol
    example:
    default: true
    choice: []
    unit:
    description: Leistungssteuerung
    help:
    advanced: false
    optional: false
modbus:
  delay:
  host:
  id: 1
  modbus: tcpip
  port: 502
  tcpip: true
  timeout: