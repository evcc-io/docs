template: stiebel-wpmsystem
product:
  identifier: stiebel-eltron-wpmsystem-sg-ready
  brand: Stiebel Eltron
  description: WPMsystem (SG Ready)
  group: Wärmeerzeuger
capabilities: ["meter", "dim"]
description: |
  Die SG Ready Steuerung über Modbus mit einem ISG funktioniert nur im Warmwasserbetrieb sowie im Automatik-/Programmbetrieb. Im Komfortbetrieb werden die SG Ready Befehle ignoriert.
render:
  - default: |
      type: template
      template: stiebel-wpmsystem

      # Modbus TCP
      modbus: tcpip
      id: 1
      host:  # Hostname
      port: 502 # Port
      tempsource: # Temperaturquelle, [warmwater, buffer] (optional)
params:
  - name: modbus
    example:
    default:
    choice: ['tcpip']
    unit:
    description: Modbus Typ
    help:
    advanced: false
    optional: false
  - name: tempsource
    example:
    default:
    choice: ['warmwater', 'buffer']
    unit:
    description: Temperaturquelle
    help:
    advanced: false
    optional: true
modbus:
  delay:
  host:
  id: 1
  modbus: tcpip
  port: 502
  tcpip: true
  timeout: