template: livewire
product:
  identifier: livewire-s2
  brand: LiveWire
  description: S2
description: |
  evcc liest den Ladezustand über die Cloud-API der LiveWire App. Diese antwortet nur Geräten, die einmalig mit dem Motorrad gekoppelt wurden.
  Die Kopplung übernimmt das Skript [livewire-pair.py](https://github.com/j4velin/livewire-pairing) (Python 3, keine weiteren Pakete). Es fragt Zugangsdaten und den Code ab, den das Motorrad dabei auf dem Display anzeigt, und gibt am Ende die Geräte-UUID aus, die hier eingetragen wird.
  Du musst dafür einmal mit eingeschalteter Zündung am Motorrad stehen.

  Das Motorrad meldet "angesteckt" erst, wenn das Ladegerät mit Strom versorgt wird. Die automatische Fahrzeugerkennung ist deshalb standardmäßig deaktiviert.

render:
  - default: |
      type: template
      template: livewire
      user: # Benutzerkonto, bspw. E-Mail Adresse, User Id, etc.
      password: # Passwort, Zugangspasswort des Dienstes
      deviceuuid: 6ba7b810-9dad-11d1-80b4-00c04fd430c8 # Geräte-UUID, Ausgabe des Kopplungsskripts von [github.com/j4velin/livewire-pairing](https://github.com/j4velin/livewire-pairing). Eine andere UUID muss erneut am Motorrad gekoppelt werden.
      vin: W... # Fahrzeugidentifikationsnummer, Wenn mehrere Fahrzeuge eines Herstellers vorhanden sind (optional)
      title: # Titel, Wird in der Benutzeroberfläche angezeigt (optional)
      capacity: 10.5 # Akkukapazität (kWh), optional
    advanced: |
      type: template
      template: livewire
      user: # Benutzerkonto, bspw. E-Mail Adresse, User Id, etc.
      password: # Passwort, Zugangspasswort des Dienstes
      deviceuuid: 6ba7b810-9dad-11d1-80b4-00c04fd430c8 # Geräte-UUID, Ausgabe des Kopplungsskripts von [github.com/j4velin/livewire-pairing](https://github.com/j4velin/livewire-pairing). Eine andere UUID muss erneut am Motorrad gekoppelt werden.
      vin: W... # Fahrzeugidentifikationsnummer, Wenn mehrere Fahrzeuge eines Herstellers vorhanden sind (optional)
      title: # Titel, Wird in der Benutzeroberfläche angezeigt (optional)
      capacity: 10.5 # Akkukapazität (kWh), optional
      icon: motorcycle # Icon, Wird in der Benutzeroberfläche angezeigt [car, bike, bus, moped, motorcycle, rocket, scooter, taxi, tractor, rickshaw, shuttle, van, airpurifier, battery, bulb, climate, coffeemaker, compute, cooking, cooler, desktop, device, dishwasher, dryer, floorlamp, generic, heater, heatexchange, heatpump, kettle, laundry, laundry2, machine, meter, microwave, pump, smartconsumer, tool, waterheater] (optional)
      phases: # Maximale Phasenanzahl, Wird für die Bestimmung des minimalen Solar-Überschusses und der Planungsdauer verwendet. [1, 2, 3] (optional)
      minCurrent: 6 # Minimale Stromstärke (A), Definiert die minimale Stromstärke pro angeschlossener Phase die genutzt werden kann (optional)
      maxCurrent: 16 # Maximale Stromstärke (A), Definiert die maximale Stromstärke pro angeschlossener Phase die genutzt werden kann (optional)
      maxPower: 10000 # Ladeleistungs-Hinweis (W), Definiert die maximale Ladeleistung des Fahrzeugs. Hilft, die Ladeplanung zu verbessern, wenn das Fahrzeug üblicherweise weniger Strom nutzt als angeboten oder höhere Ströme bei einphasigem Laden erlaubt als bei dreiphasigem. _Der bereitgestellte Strom des Ladepunktes wird nicht beeinflusst._ (optional)
      identifiers: # RFID-Identifikation, Für die Zuordnung des Fahrzeugs an einen Ladepunkt via RFID-Karte. Die Kennung wird am Ladepunkt angezeigt. Übernehme den Wert von dort. [Mehr erfahren.](https://docs.evcc.io/docs/features/vehicle) (optional)
      priority: # Priorität, Priorität des Ladepunktes oder Fahrzeugs in Relation zu anderen Ladepunkten oder Fahrzeugen für die Zuweisung von Überschussenergie (höhere Werte, höhere Priorität). (optional)
      cache: 15m # Cache, Zeitintervall für erneute Datenabfrage (optional)
      climaterdisabled: # Klimatisierungserkennung deaktivieren, Klimatisierungsstatus des Fahrzeugs für die Ladesteuerung ignorieren, sodass der Ladevorgang am SoC- oder Energielimit endet, auch wenn das Fahrzeug einen aktiven Klimatisierungswunsch signalisiert. (optional)
      autodetectdisabled: true # Von automatischer Erkennung ausschließen, Das Fahrzeug von der automatischen Erkennung beim Anschließen eines Fahrzeugs ausschließen (optional)
      wakeupdisabled: # Aufweck-Aufrufe deaktivieren, Keine Aufweck-Aufrufe an Fahrzeug oder Ladegerät senden, hilfreich bei Fahrzeugen, die nach wiederholtem Aufwecken das Laden verweigern. (optional)
