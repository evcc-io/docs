template: homeassistant
product:
  identifier: home-assistant
  brand: Home Assistant
  group: PV Vorhersage
requirements: ["skiptest"]
description: |
  Verwendet die Solarprognose, die im Home Assistant Energie-Dashboard für die Solarproduktion ausgewählt ist, z.B. von Forecast.Solar, Solcast oder Helios Forecast. Mehrere Prognosen werden addiert. Die Werte sind stündlich.
render:
  - default: |
      type: template
      template: homeassistant
      uri: http://homeassistant.local:8123 # Home Assistant URI
    advanced: |
      type: template
      template: homeassistant
      uri: http://homeassistant.local:8123 # Home Assistant URI
      insecure: # Selbstsignierte Zertifikate akzeptieren, optional
      interval: 1h # Intervall, optional
params:
  - name: uri
    example: http://homeassistant.local:8123
    default:
    choice: []
    unit:
    description: Home Assistant URI
    help:
    advanced: false
    optional: false
  - name: insecure
    example:
    default:
    choice: []
    unit:
    description: Selbstsignierte Zertifikate akzeptieren
    help:
    advanced: true
    optional: true
  - name: interval
    example:
    default: 1h
    choice: []
    unit:
    description: Intervall
    help:
    advanced: true
    optional: true