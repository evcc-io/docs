template: lekker
product:
  identifier: lekker-energie
  brand: lekker Energie
  group: Dynamischer Strompreis
countries: ["DE"]
requirements: ["skiptest"]
description: |
  Hol dir deinen API-Token im [lekker Service Portal](https://www.lekker.de/service/api-key).
render:
  - default: |
      type: template
      template: lekker
      token: # API-Token (z.B. lek_prod_...).
    advanced: |
      type: template
      template: lekker
      token: # API-Token (z.B. lek_prod_...).
      interval: 1h # Intervall, optional
      charges: # Aufschlag, Zusätzlicher fester Aufschlag pro kWh (optional)
      chargesZones: # Aufschlagszonen, Zeitabhängige Aufschläge, die den Standardaufschlag überschreiben. (optional)
      tax: # Steuer, Zusätzlicher prozentualer Aufschlag (z.B. 0.2 für 20%) (optional)
      formula: math.Max((price + charges) * (1 + tax), 0.0) # Formel, Individuelle Formel zur Berechnung des Preises (optional)
params:
  - name: token
    example:
    default:
    choice: []
    unit:
    description: API-Token (z.B. lek_prod_...).
    help:
    advanced: false
    optional: false
  - name: interval
    example:
    default: 1h
    choice: []
    unit:
    description: Intervall
    help:
    advanced: true
    optional: true
  - name: charges
    example:
    default:
    choice: []
    unit:
    description: Aufschlag
    help: Zusätzlicher fester Aufschlag pro kWh
    advanced: true
    optional: true
  - name: chargesZones
    example:
    default:
    choice: []
    unit:
    description: Aufschlagszonen
    help: Zeitabhängige Aufschläge, die den Standardaufschlag überschreiben.
    advanced: true
    optional: true
  - name: tax
    example:
    default:
    choice: []
    unit:
    description: Steuer
    help: Zusätzlicher prozentualer Aufschlag (z.B. 0.2 für 20%)
    advanced: true
    optional: true
  - name: formula
    example: math.Max((price + charges) * (1 + tax), 0.0)
    default:
    choice: []
    unit:
    description: Formel
    help: Individuelle Formel zur Berechnung des Preises
    advanced: true
    optional: true