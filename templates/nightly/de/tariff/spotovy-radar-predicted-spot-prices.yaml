template: spotovyradar
product:
  identifier: spotovy-radar-predicted-spot-prices
  brand: Spotový Radar
  description: Predicted spot prices
  group: Dynamischer Strompreis
countries: ["CZ"]
requirements: ["skiptest"]
description: |
  Tschechische OTE Day-Ahead-Preise in 15-Minuten-Intervallen plus 72-Stunden-Prognose. Optional der Endpreis inklusive Netzentgelte und Mehrwertsteuer aus den Tarifeinstellungen auf spotovyradar.cz. Benötigt einen API-Key von [spotovyradar.cz](https://spotovyradar.cz/ucet/api) (Tarif Smart Home).
render:
  - default: |
      type: template
      template: spotovyradar
      apikey: sr_live_abcdefgh_… # API Key, Key erstellen unter [spotovyradar.cz/ucet/api](https://spotovyradar.cz/ucet/api).
      price: spot # Preis, spot = Börsenpreis in CZK/kWh ohne Mehrwertsteuer und Gebühren (über charges und tax ergänzen). final = Endpreis gemäß dem auf spotovyradar.cz gespeicherten Tarif (Händleraufschlag, Netzentgelt HT/NT, weitere Umlagen, Mehrwertsteuer). final nicht mit charges oder tax kombinieren. [spot, final] (optional)
    advanced: |
      type: template
      template: spotovyradar
      apikey: sr_live_abcdefgh_… # API Key, Key erstellen unter [spotovyradar.cz/ucet/api](https://spotovyradar.cz/ucet/api).
      price: spot # Preis, spot = Börsenpreis in CZK/kWh ohne Mehrwertsteuer und Gebühren (über charges und tax ergänzen). final = Endpreis gemäß dem auf spotovyradar.cz gespeicherten Tarif (Händleraufschlag, Netzentgelt HT/NT, weitere Umlagen, Mehrwertsteuer). final nicht mit charges oder tax kombinieren. [spot, final] (optional)
      charges: # Aufschlag, Zusätzlicher fester Aufschlag pro kWh (optional)
      chargesZones: # Aufschlagszonen, Zeitabhängige Aufschläge, die den Standardaufschlag überschreiben. (optional)
      tax: # Steuer, Zusätzlicher prozentualer Aufschlag (z.B. 0.2 für 20%) (optional)
      formula: math.Max((price + charges) * (1 + tax), 0.0) # Formel, Individuelle Formel zur Berechnung des Preises (optional)
      average: # Stündliche Durchschnittskosten verwenden, optional
params:
  - name: apikey
    example: sr_live_abcdefgh_…
    default:
    choice: []
    unit:
    description: API Key
    help: Key erstellen unter [spotovyradar.cz/ucet/api](https://spotovyradar.cz/ucet/api).
    advanced: false
    optional: false
  - name: price
    example:
    default: spot
    choice: ['spot', 'final']
    unit:
    description: Preis
    help: spot = Börsenpreis in CZK/kWh ohne Mehrwertsteuer und Gebühren (über charges und tax ergänzen). final = Endpreis gemäß dem auf spotovyradar.cz gespeicherten Tarif (Händleraufschlag, Netzentgelt HT/NT, weitere Umlagen, Mehrwertsteuer). final nicht mit charges oder tax kombinieren.
    advanced: false
    optional: true
  - name: charges
    example:
    default:
    choice: []
    unit:
    description: Aufschlag
    help: Zusätzlicher fester Aufschlag pro kWh
    advanced: true
    optional: true
  - name: chargesZones
    example:
    default:
    choice: []
    unit:
    description: Aufschlagszonen
    help: Zeitabhängige Aufschläge, die den Standardaufschlag überschreiben.
    advanced: true
    optional: true
  - name: tax
    example:
    default:
    choice: []
    unit:
    description: Steuer
    help: Zusätzlicher prozentualer Aufschlag (z.B. 0.2 für 20%)
    advanced: true
    optional: true
  - name: formula
    example: math.Max((price + charges) * (1 + tax), 0.0)
    default:
    choice: []
    unit:
    description: Formel
    help: Individuelle Formel zur Berechnung des Preises
    advanced: true
    optional: true
  - name: average
    example:
    default:
    choice: []
    unit:
    description: Stündliche Durchschnittskosten verwenden
    help:
    advanced: true
    optional: true