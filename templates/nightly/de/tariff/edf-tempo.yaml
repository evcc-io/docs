template: edf-tempo
product:
  identifier: edf-tempo
  brand: EDF
  description: Tempo
  group: Dynamischer Strompreis
countries: ["FR"]
requirements: ["skiptest"]
description: |
  EDF-Tempo-Preise auf Basis der Tagesfarbe (blau, weiß, rot), die am Vortag bekanntgegeben wird. Standardwerte sind die regulierten EDF-Preise inkl. Steuern ab 1. August 2026. Bitte mit der aktuellen Preisliste abgleichen.
render:
  - default: |
      type: template
      template: edf-tempo
      bluehp: 0.1654 # Blauer Tag, Hochtarif, 06:00 – 22:00 (optional)
      bluehc: 0.1356 # Blauer Tag, Niedertarif, 22:00 – 06:00 (optional)
      whitehp: 0.1921 # Weißer Tag, Hochtarif, 06:00 – 22:00 (optional)
      whitehc: 0.1536 # Weißer Tag, Niedertarif, 22:00 – 06:00 (optional)
      redhp: 0.7295 # Roter Tag, Hochtarif, 06:00 – 22:00 (optional)
      redhc: 0.1615 # Roter Tag, Niedertarif, 22:00 – 06:00 (optional)
    advanced: |
      type: template
      template: edf-tempo
      bluehp: 0.1654 # Blauer Tag, Hochtarif, 06:00 – 22:00 (optional)
      bluehc: 0.1356 # Blauer Tag, Niedertarif, 22:00 – 06:00 (optional)
      whitehp: 0.1921 # Weißer Tag, Hochtarif, 06:00 – 22:00 (optional)
      whitehc: 0.1536 # Weißer Tag, Niedertarif, 22:00 – 06:00 (optional)
      redhp: 0.7295 # Roter Tag, Hochtarif, 06:00 – 22:00 (optional)
      redhc: 0.1615 # Roter Tag, Niedertarif, 22:00 – 06:00 (optional)
      charges: # Aufschlag, Zusätzlicher fester Aufschlag pro kWh (optional)
      chargesZones: # Aufschlagszonen, Zeitabhängige Aufschläge, die den Standardaufschlag überschreiben. (optional)
      tax: # Steuer, Zusätzlicher prozentualer Aufschlag (z.B. 0.2 für 20%) (optional)
      formula: math.Max((price + charges) * (1 + tax), 0.0) # Formel, Individuelle Formel zur Berechnung des Preises (optional)
      average: # Stündliche Durchschnittskosten verwenden, optional
