template: epexprijzen-be
product:
  identifier: epexprijzen-be
  brand: epexprijzen.be
  group: Dynamischer Strompreis
countries: ["BE"]
requirements: ["skiptest"]
description: |
  Aktuelle Energiepreise in Belgien. Preise enthalten standardmäßig Energiesteuer und Anbietergebühr. Wenn 'tax' oder 'charges' konfiguriert sind, werden die enthaltenen Beträge automatisch abgezogen, um Doppelzählungen zu vermeiden.
render:
  - default: |
      type: template
      template: epexprijzen-be
      provider: # Energieversorger, [bolt, dots-energy, ebem, ecofix, ecopower, eneco, energiebe, energy-knights, energyvision, engie, evident-energie, frank-energie, hoa-energy, luminus, mega, octaplus, power2you, servolt-energie, smappee-smiles, totalenergies, trevion, wase-wind]
      region: vlaanderen # Region, [vlaanderen, wallonie, brussel]
      price-interval: quarterly # Preisintervall, [hourly, quarterly]
    advanced: |
      type: template
      template: epexprijzen-be
      provider: # Energieversorger, [bolt, dots-energy, ebem, ecofix, ecopower, eneco, energiebe, energy-knights, energyvision, engie, evident-energie, frank-energie, hoa-energy, luminus, mega, octaplus, power2you, servolt-energie, smappee-smiles, totalenergies, trevion, wase-wind]
      region: vlaanderen # Region, [vlaanderen, wallonie, brussel]
      price-interval: quarterly # Preisintervall, [hourly, quarterly]
      charges: # Aufschlag, Zusätzlicher fester Aufschlag pro kWh (optional)
      chargesZones: # Aufschlagszonen, Zeitabhängige Aufschläge, die den Standardaufschlag überschreiben. (optional)
      tax: # Steuer, Zusätzlicher prozentualer Aufschlag (z.B. 0.2 für 20%) (optional)
      formula: math.Max((price + charges) * (1 + tax), 0.0) # Formel, Individuelle Formel zur Berechnung des Preises (optional)
      interval: 1h # Intervall, optional
