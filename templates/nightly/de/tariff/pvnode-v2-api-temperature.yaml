template: pvnode-v2-temperature
product:
  identifier: pvnode-v2-api-temperature
  brand: pvnode V2 API Temperature
  group: Temperaturvorhersage
requirements: ["skiptest"]
description: |
  [pvnode V2 API](https://pvnode.com) liefert Außentemperaturdaten in 15-Minuten-Intervallen per REST API Version 2 mit Standort-ID und leichter Konfiguration über Web-App
  Ein API-Key ist erforderlich (kostenloser Plan möglich)
  **Achtung**: Mit dem kostenlosen Plan ist nur ein Standort (fest) möglich mit einer Prognose für Heute & Morgen und nur einem Update pro Tag und 250 gecached Abfragen.

render:
  - default: |
      type: template
      template: pvnode-v2-temperature
      apikey: # API Key
      siteid: # Site ID
    advanced: |
      type: template
      template: pvnode-v2-temperature
      apikey: # API Key
      siteid: # Site ID
      forecast_days: 1 # Vorhersagetage, Der kostenlose Plan von pvnode erlaubt nur 1 Vorhersagetag (1 = heute + morgen). (optional)
      interval: 24h # Intervall, optional
params:
  - name: apikey
    example:
    default:
    choice: []
    unit:
    description: API Key
    help:
    advanced: false
    optional: false
  - name: siteid
    example:
    default:
    choice: []
    unit:
    description: Site ID
    help:
    advanced: false
    optional: false
  - name: forecast_days
    example:
    default: 1
    choice: []
    unit:
    description: Vorhersagetage
    help: Der kostenlose Plan von pvnode erlaubt nur 1 Vorhersagetag (1 = heute + morgen).
    advanced: true
    optional: true
  - name: interval
    example:
    default: 24h
    choice: []
    unit:
    description: Intervall
    help:
    advanced: true
    optional: true