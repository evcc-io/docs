template: elpriser
product:
  identifier: elpriser-org-spot-prices
  brand: elpriser.org
  description: Spot prices
  group: Dynamischer Strompreis
countries: ["EU", "DK", "NO", "CH", "GB", "IE", "RS", "ME", "MK", "AL"]
requirements: ["skiptest"]
description: |
  Börsenstrompreise (Day-Ahead) für 40 europäische Preiszonen in 15-Minuten-Auflösung, wo der Markt sie hat, danach rund eine Woche Prognose (statistisches Modell von elpriser.org, keine offizielle Prognose).
  Außerhalb Dänemarks ist es der reine Börsenpreis ohne Steuern, Abgaben und Netzentgelte; diese lassen sich mit `charges`, `tax` oder `formula` ergänzen.
  Für Dänemark (`dk1`, `dk2`) liefert die Preisart `net_inkl_alt` den vollen Preis inklusive Netztarif; dafür wird die GLN des Netzbetreibers benötigt.
  Die Preise sind in der Währung der Zone (DKK, SEK, NOK, PLN, GBP, ...) oder in EUR. Die Währung in evcc muss dazu passen.

render:
  - default: |
      type: template
      template: elpriser
      zone: de # Preiszone, Zonencode, z.B. `de`, `fr`, `dk1`, `se3`, `no2`. [dk1, dk2, no1, no2, no3, no4, no5, se1, se2, se3, se4, fi, nl, de, fr, pl, it-n, at, be, ch, cz, hu, si, es, pt, sk, gr, ro, bg, hr, rs, ee, lv, lt, me, mk, al, xk, gb, ie]
      currency: local # Währung, `local` = Währung der Zone (DKK, SEK, NOK, PLN, ... mit dem EZB-Referenzkurs umgerechnet), `eur` = Euro. Muss zur Währung in evcc passen. Großbritannien ist immer GBP. [local, eur]
      pricemode: inkl_alt # Preisart (nur Dänemark), Nur für dk1 und dk2. `inkl_alt` = Spot + Energinet-Tarife + Elafgift + MwSt. (alles außer dem Netztarif des Netzbetreibers); `net_inkl_alt` = der volle Preis inkl. Netztarif, braucht `gln`; `spot_ex` / `spot_inkl` = Börsenpreis ohne / mit MwSt. [inkl_alt, spot_inkl, spot_ex, inkl_alt_minus, inkl_alt_elvarme, net_inkl_alt, net_inkl_alt_elvarme, net_inkl_tarif] (optional)
      gln: 5790000705689 # GLN des Netzbetreibers (nur Dänemark), 13-stellige GLN-Nummer des dänischen Netzbetreibers, nur für die Preisarten net_*. Liste: [elpriser.org/tariffer](https://elpriser.org/tariffer) (optional)
    advanced: |
      type: template
      template: elpriser
      zone: de # Preiszone, Zonencode, z.B. `de`, `fr`, `dk1`, `se3`, `no2`. [dk1, dk2, no1, no2, no3, no4, no5, se1, se2, se3, se4, fi, nl, de, fr, pl, it-n, at, be, ch, cz, hu, si, es, pt, sk, gr, ro, bg, hr, rs, ee, lv, lt, me, mk, al, xk, gb, ie]
      currency: local # Währung, `local` = Währung der Zone (DKK, SEK, NOK, PLN, ... mit dem EZB-Referenzkurs umgerechnet), `eur` = Euro. Muss zur Währung in evcc passen. Großbritannien ist immer GBP. [local, eur]
      pricemode: inkl_alt # Preisart (nur Dänemark), Nur für dk1 und dk2. `inkl_alt` = Spot + Energinet-Tarife + Elafgift + MwSt. (alles außer dem Netztarif des Netzbetreibers); `net_inkl_alt` = der volle Preis inkl. Netztarif, braucht `gln`; `spot_ex` / `spot_inkl` = Börsenpreis ohne / mit MwSt. [inkl_alt, spot_inkl, spot_ex, inkl_alt_minus, inkl_alt_elvarme, net_inkl_alt, net_inkl_alt_elvarme, net_inkl_tarif] (optional)
      gln: 5790000705689 # GLN des Netzbetreibers (nur Dänemark), 13-stellige GLN-Nummer des dänischen Netzbetreibers, nur für die Preisarten net_*. Liste: [elpriser.org/tariffer](https://elpriser.org/tariffer) (optional)
      actualonly: # Nur veröffentlichte Preise, Lässt die Tage aus, die nur eine Modell-Prognose sind (ab Veröffentlichung der Day-Ahead-Preise gegen 13 Uhr MEZ ist das der nächste Tag). (optional)
      charges: # Aufschlag, Zusätzlicher fester Aufschlag pro kWh (optional)
      chargesZones: # Aufschlagszonen, Zeitabhängige Aufschläge, die den Standardaufschlag überschreiben. (optional)
      tax: # Steuer, Zusätzlicher prozentualer Aufschlag (z.B. 0.2 für 20%) (optional)
      formula: math.Max((price + charges) * (1 + tax), 0.0) # Formel, Individuelle Formel zur Berechnung des Preises (optional)
      average: # Stündliche Durchschnittskosten verwenden, optional
params:
  - name: zone
    example: de
    default:
    choice: ['dk1', 'dk2', 'no1', 'no2', 'no3', 'no4', 'no5', 'se1', 'se2', 'se3', 'se4', 'fi', 'nl', 'de', 'fr', 'pl', 'it-n', 'at', 'be', 'ch', 'cz', 'hu', 'si', 'es', 'pt', 'sk', 'gr', 'ro', 'bg', 'hr', 'rs', 'ee', 'lv', 'lt', 'me', 'mk', 'al', 'xk', 'gb', 'ie']
    unit:
    description: Preiszone
    help: Zonencode, z.B. `de`, `fr`, `dk1`, `se3`, `no2`.
    advanced: false
    optional: false
  - name: currency
    example:
    default: local
    choice: ['local', 'eur']
    unit:
    description: Währung
    help: '`local` = Währung der Zone (DKK, SEK, NOK, PLN, ... mit dem EZB-Referenzkurs umgerechnet), `eur` = Euro. Muss zur Währung in evcc passen. Großbritannien ist immer GBP.'
    advanced: false
    optional: false
  - name: pricemode
    example:
    default: inkl_alt
    choice: ['inkl_alt', 'spot_inkl', 'spot_ex', 'inkl_alt_minus', 'inkl_alt_elvarme', 'net_inkl_alt', 'net_inkl_alt_elvarme', 'net_inkl_tarif']
    unit:
    description: Preisart (nur Dänemark)
    help: Nur für dk1 und dk2. `inkl_alt` = Spot + Energinet-Tarife + Elafgift + MwSt. (alles außer dem Netztarif des Netzbetreibers); `net_inkl_alt` = der volle Preis inkl. Netztarif, braucht `gln`; `spot_ex` / `spot_inkl` = Börsenpreis ohne / mit MwSt.
    advanced: false
    optional: true
  - name: gln
    example: 5790000705689
    default:
    choice: []
    unit:
    description: GLN des Netzbetreibers (nur Dänemark)
    help: '13-stellige GLN-Nummer des dänischen Netzbetreibers, nur für die Preisarten net_*. Liste: [elpriser.org/tariffer](https://elpriser.org/tariffer)'
    advanced: false
    optional: true
  - name: actualonly
    example:
    default:
    choice: []
    unit:
    description: Nur veröffentlichte Preise
    help: Lässt die Tage aus, die nur eine Modell-Prognose sind (ab Veröffentlichung der Day-Ahead-Preise gegen 13 Uhr MEZ ist das der nächste Tag).
    advanced: true
    optional: true
  - name: charges
    example:
    default:
    choice: []
    unit:
    description: Aufschlag
    help: Zusätzlicher fester Aufschlag pro kWh
    advanced: true
    optional: true
  - name: chargesZones
    example:
    default:
    choice: []
    unit:
    description: Aufschlagszonen
    help: Zeitabhängige Aufschläge, die den Standardaufschlag überschreiben.
    advanced: true
    optional: true
  - name: tax
    example:
    default:
    choice: []
    unit:
    description: Steuer
    help: Zusätzlicher prozentualer Aufschlag (z.B. 0.2 für 20%)
    advanced: true
    optional: true
  - name: formula
    example: math.Max((price + charges) * (1 + tax), 0.0)
