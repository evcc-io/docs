template: energyforecast
product:
  identifier: energy-forecast
  brand: Energy Forecast
  group: Dynamischer Strompreis
countries: ["DE", "LU", "AT", "FR", "NL", "BE", "PL", "DK", "CH", "CZ", "HU", "SI", "IT", "NO", "SE"]
requirements: ["skiptest"]
description: |
  Aufschlag und Steuer, die hier nicht gesetzt sind, werden aus dem Profil auf energyforecast.de übernommen. Wer nur einen Aufschlag setzt, sollte auch die Steuer setzen, da der Aufschlag sonst unversteuert bleibt.
render:
  - default: |
      type: template
      template: energyforecast
      token: # Token
      domain: # Domain, [DE-LU, AT, FR, NL, BE, PL, DK1, DK2, CH, CZ, HU, SI, IT-North, NO2, SE4] (optional)
    advanced: |
      type: template
      template: energyforecast
      token: # Token
      domain: # Domain, [DE-LU, AT, FR, NL, BE, PL, DK1, DK2, CH, CZ, HU, SI, IT-North, NO2, SE4] (optional)
      charges: # Aufschlag, Zusätzlicher fester Aufschlag pro kWh (optional)
      chargesZones: # Aufschlagszonen, Zeitabhängige Aufschläge, die den Standardaufschlag überschreiben. (optional)
      tax: # Steuer, Zusätzlicher prozentualer Aufschlag (z.B. 0.2 für 20%) (optional)
      formula: math.Max((price + charges) * (1 + tax), 0.0) # Formel, Individuelle Formel zur Berechnung des Preises (optional)
      average: # Stündliche Durchschnittskosten verwenden, optional
