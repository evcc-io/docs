template: zendure-hyper
product:
  identifier: zendure-hyper-2000
  brand: Zendure
  description: Hyper 2000
requirements: ["skiptest"]
render:
  - usage: pv
    default: |
      type: template
      template: zendure-hyper
      usage: pv
      account: dev@zendure.com # Account ID
      serial: VU5D99F74021B04 # Seriennummer, Zu finden in der Zendure App in den Einstellungen des Geräts
      region: EU # Region, [EU, Global]
      timeout: 10s # Zeitüberschreitung, optional
    advanced: |
      type: template
      template: zendure-hyper
      usage: pv
      account: dev@zendure.com # Account ID
      serial: VU5D99F74021B04 # Seriennummer, Zu finden in der Zendure App in den Einstellungen des Geräts
      region: EU # Region, [EU, Global]
      timeout: 10s # Zeitüberschreitung, optional
  - usage: battery
    default: |
      type: template
      template: zendure-hyper
      usage: battery
      account: dev@zendure.com # Account ID
      serial: VU5D99F74021B04 # Seriennummer, Zu finden in der Zendure App in den Einstellungen des Geräts
      region: EU # Region, [EU, Global]
      minsoc: 0 # Minimaler Ladestand (%), Untere Grenze wie am Batteriesystem eingestellt. Wird vom Optimizer genutzt. (optional)
      maxsoc: 100 # Maximaler Ladestand (%), Obere Grenze wie am Batteriesystem eingestellt. Genutzt vom Optimizer und, bei manchen Geräten, für Netzladen. (optional)
      timeout: 10s # Zeitüberschreitung, optional
    advanced: |
      type: template
      template: zendure-hyper
      usage: battery
      account: dev@zendure.com # Account ID
      serial: VU5D99F74021B04 # Seriennummer, Zu finden in der Zendure App in den Einstellungen des Geräts
      region: EU # Region, [EU, Global]
      minsoc: 0 # Minimaler Ladestand (%), Untere Grenze wie am Batteriesystem eingestellt. Wird vom Optimizer genutzt. (optional)
      maxsoc: 100 # Maximaler Ladestand (%), Obere Grenze wie am Batteriesystem eingestellt. Genutzt vom Optimizer und, bei manchen Geräten, für Netzladen. (optional)
      timeout: 10s # Zeitüberschreitung, optional
      capacity: 2 # Akkukapazität (kWh), optional
      maxchargepower: 1200 # Maximale Ladeleistung (W), Höchste Leistung, mit der das Batteriesystem laden kann. Der Optimizer plant mit Laden bis zu dieser Leistung. Manche Geräte nutzen diesen Wert auch als Leistung für Netzladen. (optional)
      maxdischargepower: 800 # Maximale Entladeleistung (W), Höchste Leistung, mit der das Batteriesystem entladen kann. Der Optimizer plant mit Entladen bis zu dieser Leistung. Der Smart-Modus geht davon aus, dass die Batterie höchstens diese Leistung zum Fahrzeugladen beisteuert. (optional)
params:
  - name: account
    example: dev@zendure.com
    default:
    choice: []
    unit:
    description: Account ID
    help:
    advanced: false
    optional: false
  - name: serial
    example: VU5D99F74021B04
    default:
    choice: []
    unit:
    description: Seriennummer
    help: Zu finden in der Zendure App in den Einstellungen des Geräts
    advanced: false
    optional: false
  - name: region
    example:
    default: EU
    choice: ['EU', 'Global']
    unit:
    description: Region
    help:
    advanced: false
    optional: false
  - name: minsoc
    example: 25
    default: 0
    choice: []
    unit: '%'
    description: Minimaler Ladestand
    help: Untere Grenze wie am Batteriesystem eingestellt. Wird vom Optimizer genutzt.
    advanced: false
    optional: true
  - name: maxsoc
    example: 95
    default: 100
    choice: []
    unit: '%'
    description: Maximaler Ladestand
    help: Obere Grenze wie am Batteriesystem eingestellt. Genutzt vom Optimizer und, bei manchen Geräten, für Netzladen.
    advanced: false
    optional: true
  - name: timeout
    example: 10s
    default:
    choice: []
    unit:
    description: Zeitüberschreitung
    help:
    advanced: false
    optional: true
  - name: capacity
    example: 50
    default: 2
    choice: []
    unit: kWh
    description: Akkukapazität
    help:
    advanced: true
    optional: true
  - name: maxchargepower
    example:
    default: 1200
    choice: []
    unit: W
    description: Maximale Ladeleistung
    help: Höchste Leistung, mit der das Batteriesystem laden kann. Der Optimizer plant mit Laden bis zu dieser Leistung. Manche Geräte nutzen diesen Wert auch als Leistung für Netzladen.
    advanced: true
    optional: true
  - name: maxdischargepower
    example:
    default: 800
    choice: []
    unit: W
    description: Maximale Entladeleistung
    help: Höchste Leistung, mit der das Batteriesystem entladen kann. Der Optimizer plant mit Entladen bis zu dieser Leistung. Der Smart-Modus geht davon aus, dass die Batterie höchstens diese Leistung zum Fahrzeugladen beisteuert.
    advanced: true
    optional: true