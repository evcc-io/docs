template: anker-solix-x1
product:
  identifier: anker-solix-x1-hybrid-inverter
  brand: Anker
  description: SOLIX X1 Hybrid Inverter
capabilities: ["battery-control"]
description: |
  Die Modbus-TCP-Schnittstelle muss in der Anker-App freigeschaltet werden.
  Diese Konfiguration wurde mit der Firmware-Version 1.0.16.1 getestet.
  Ältere oder neuere Firmware-Versionen können andere Registeradressen verwenden und daher falsche Daten liefern.
  evcc kann die Batterie aus dem Netz laden (Arbeitsmodus Drittanbietersteuerung mit der maximalen Ladeleistung `maxchargepower`) und sie zurück in den Eigenverbrauch schalten. Ein in der Anker-App eingestellter Arbeitsmodus wird dabei überschrieben.
  evcc schreibt nur auf den X1, wenn eine Batteriefunktion aktiv ist (Netzladen, Entladesperre, automatische Steuerung des Optimizers oder ein externer Batteriemodus). Ohne diese behält der X1 den in der Anker-App eingestellten Modus.
  Der X1 kehrt nicht von selbst in den Eigenverbrauch zurück: Endet evcc unerwartet während des Netzladens, lädt der X1 weiter, bis evcc wieder einen Modus setzt.
  Halten wird nicht unterstützt und fällt auf den Normalbetrieb zurück: Der X1 bietet keine Möglichkeit, das Entladen zu sperren und gleichzeitig PV-Überschuss zu speichern.

render:
  - usage: grid
    default: |
      type: template
      template: anker-solix-x1
      usage: grid

      # Modbus TCP
      modbus: tcpip
      id: 1
      host:  # Hostname
      port: 502 # Port
    advanced: |
      type: template
      template: anker-solix-x1
      usage: grid

      # Modbus TCP
      modbus: tcpip
      id: 1
      host:  # Hostname
      port: 502 # Port
      watchdog: 60s # Watchdog, optional
  - usage: pv
    default: |
      type: template
      template: anker-solix-x1
      usage: pv

      # Modbus TCP
      modbus: tcpip
      id: 1
      host:  # Hostname
      port: 502 # Port
    advanced: |
      type: template
      template: anker-solix-x1
      usage: pv

      # Modbus TCP
      modbus: tcpip
      id: 1
      host:  # Hostname
      port: 502 # Port
      maxacpower: 0 # Maximale AC Leistung des Hybrid-Wechselrichters (W), optional
      watchdog: 60s # Watchdog, optional
  - usage: battery
    default: |
      type: template
      template: anker-solix-x1
      usage: battery

      # Modbus TCP
      modbus: tcpip
      id: 1
      host:  # Hostname
      port: 502 # Port
      maxchargepower: # Maximale Ladeleistung (W), Höchste Leistung, mit der das Batteriesystem laden kann. Der Optimizer plant mit Laden bis zu dieser Leistung. Manche Geräte nutzen diesen Wert auch als Leistung für Netzladen.
      capacity: 50 # Akkukapazität (kWh), optional
      minsoc: 0 # Minimaler Ladestand (%), Untere Grenze wie am Batteriesystem eingestellt. Wird vom Optimizer genutzt. (optional)
      maxsoc: 100 # Maximaler Ladestand (%), Obere Grenze wie am Batteriesystem eingestellt. Genutzt vom Optimizer und, bei manchen Geräten, für Netzladen. (optional)
    advanced: |
      type: template
      template: anker-solix-x1
      usage: battery

      # Modbus TCP
      modbus: tcpip
      id: 1
      host:  # Hostname
      port: 502 # Port
      maxchargepower: # Maximale Ladeleistung (W), Höchste Leistung, mit der das Batteriesystem laden kann. Der Optimizer plant mit Laden bis zu dieser Leistung. Manche Geräte nutzen diesen Wert auch als Leistung für Netzladen.
      capacity: 50 # Akkukapazität (kWh), optional
      minsoc: 0 # Minimaler Ladestand (%), Untere Grenze wie am Batteriesystem eingestellt. Wird vom Optimizer genutzt. (optional)
      maxsoc: 100 # Maximaler Ladestand (%), Obere Grenze wie am Batteriesystem eingestellt. Genutzt vom Optimizer und, bei manchen Geräten, für Netzladen. (optional)
      maxdischargepower: # Maximale Entladeleistung (W), Höchste Leistung, mit der das Batteriesystem entladen kann. Der Optimizer plant mit Entladen bis zu dieser Leistung. Der Smart-Modus geht davon aus, dass die Batterie höchstens diese Leistung zum Fahrzeugladen beisteuert. (optional)
      watchdog: 60s # Watchdog, optional
params:
  - name: modbus
    example:
    default:
    choice: ['tcpip']
    unit:
    description: Modbus Typ
    help:
    advanced: false
    optional: false
  - name: maxchargepower
    example:
    default:
    choice: []
    unit: W
    description: Maximale Ladeleistung
    help: Höchste Leistung, mit der das Batteriesystem laden kann. Der Optimizer plant mit Laden bis zu dieser Leistung. Manche Geräte nutzen diesen Wert auch als Leistung für Netzladen.
    advanced: false
