template: sunenergyxt-500
product:
  identifier: sunenergyxt-sunenergyxt-500
  brand: SunEnergyXT
  description: SunEnergyXT 500
capabilities: ["battery-control"]
description: |
  Der lokale Modus der Batterie muss in der Hersteller-App aktiviert werden.
  Des Weiteren muss die IP-Adresse des Geräts im Router auf eine feste, dauerhafte IP-Adresse eingestellt werden.
  Wenn der `grid` Modus verwendet wird, muss mit der Batterie ein externer Zähler (z. B. Shelly) verbunden sein, der den Hausanschlusspunkt misst (dieser wird über die Hersteller-App hinzugefügt).

caveats:
  - description: |
      Aktuell muss jeder Kopfspeicher einzeln in EVCC angelegt werden.
      Mehrere Kopfspeicher in ein System zu verbinden, ist vom Hersteller angekündigt, jedoch softwareseitig noch nicht umgesetzt.

render:
  - usage: grid
    default: |
      type: template
      template: sunenergyxt-500
      usage: grid
      host: 192.0.2.2 # IP-Adresse oder Hostname
    advanced: |
      type: template
      template: sunenergyxt-500
      usage: grid
      host: 192.0.2.2 # IP-Adresse oder Hostname
      cache: 1s # Cache, Zeitintervall für erneute Datenabfrage (optional)
      timeout: 10s # Zeitüberschreitung, optional
  - usage: pv
    default: |
      type: template
      template: sunenergyxt-500
      usage: pv
      host: 192.0.2.2 # IP-Adresse oder Hostname
    advanced: |
      type: template
      template: sunenergyxt-500
      usage: pv
      host: 192.0.2.2 # IP-Adresse oder Hostname
      maxacpower: 800.0 # Maximale AC Leistung des Hybrid-Wechselrichters (W), optional
      cache: 1s # Cache, Zeitintervall für erneute Datenabfrage (optional)
      timeout: 10s # Zeitüberschreitung, optional
  - usage: battery
    default: |
      type: template
      template: sunenergyxt-500
      usage: battery
      host: 192.0.2.2 # IP-Adresse oder Hostname
      capacity: 4.8 # Akkukapazität (kWh), optional
      minsoc: 25 # Minimaler Ladestand (%), Untere Grenze beim Entladen der Batterie im normalen Betrieb (optional)
      maxsoc: 95 # Maximaler Ladestand (%), Oberes Limit beim Laden der Batterie aus dem Netz (optional)
    advanced: |
      type: template
      template: sunenergyxt-500
      usage: battery
      host: 192.0.2.2 # IP-Adresse oder Hostname
      capacity: 4.8 # Akkukapazität (kWh), optional
      minsoc: 25 # Minimaler Ladestand (%), Untere Grenze beim Entladen der Batterie im normalen Betrieb (optional)
      maxsoc: 95 # Maximaler Ladestand (%), Oberes Limit beim Laden der Batterie aus dem Netz (optional)
      maxchargepower: 2400.0 # Maximale Ladeleistung (W), Für erzwungenes Laden des Speichers. (optional)
      maxdischargepower: 800.0 # Maximale Entladeleistung (W), Maximale Entladeleistung des Speichers. (optional)
      cache: 1s # Cache, Zeitintervall für erneute Datenabfrage (optional)
      timeout: 10s # Zeitüberschreitung, optional
params:
