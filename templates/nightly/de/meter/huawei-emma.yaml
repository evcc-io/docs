template: huawei-emma
product:
  identifier: huawei-emma
  brand: Huawei
  description: EMMA
capabilities: ["curtail"]
description: |
  Modbus TCP muss auf der EMMA mit dem Installateur-Konto in der FusionSolar-App aktiviert werden (Gerät in Betrieb nehmen, Kommunikationseinstellungen, Modbus TCP). Die EMMA antwortet auf Unit-ID 0, die das Template verwendet.

  Die EMMA akzeptiert nur einen Modbus-TCP-Client gleichzeitig; weitere Verbindungen werden zurückgesetzt. Um sie mit anderen Systemen wie Home Assistant zu teilen, den [Modbus-Proxy](https://docs.evcc.io/de/reference/configuration/modbusproxy) von evcc verwenden.

  Die Batteriewerte der EMMA sind nur lesbar. Für die aktive Batteriesteuerung die Batterie stattdessen mit dem Template SUN2000 Hybrid konfigurieren, mit der Adresse der EMMA und der Unit-ID des Wechselrichters: die EMMA leitet diese Anfragen an den Wechselrichter weiter. Die Unit-ID wird dynamisch vergeben und ist in FusionSolar oder durch Ausprobieren zu finden. Wenn evcc die Batterie steuert, die KI-Energieoptimierung der EMMA in der FusionSolar-App deaktivieren und die EMMA im Modus maximaler Eigenverbrauch belassen: nur ein System sollte die Batterie planen.

render:
  - usage: grid
    default: |
      type: template
      template: huawei-emma
      usage: grid

      # Modbus TCP
      modbus: tcpip
      id: 1
      host:  # Hostname
      port: 502 # Port
    advanced: |
      type: template
      template: huawei-emma
      usage: grid

      # Modbus TCP
      modbus: tcpip
      id: 1
      host:  # Hostname
      port: 502 # Port
  - usage: pv
    default: |
      type: template
      template: huawei-emma
      usage: pv

      # Modbus TCP
      modbus: tcpip
      id: 1
      host:  # Hostname
      port: 502 # Port
    advanced: |
      type: template
      template: huawei-emma
      usage: pv

      # Modbus TCP
      modbus: tcpip
      id: 1
      host:  # Hostname
      port: 502 # Port
  - usage: battery
    default: |
      type: template
      template: huawei-emma
      usage: battery

      # Modbus TCP
      modbus: tcpip
      id: 1
      host:  # Hostname
      port: 502 # Port
      capacity: 50 # Akkukapazität (kWh), optional
      minsoc: 0 # Minimaler Ladestand (%), Untere Grenze wie am Batteriesystem eingestellt. Wird vom Optimizer genutzt. (optional)
      maxsoc: 100 # Maximaler Ladestand (%), Obere Grenze wie am Batteriesystem eingestellt. Wird vom Optimizer und für Netzladen genutzt. (optional)
    advanced: |
      type: template
      template: huawei-emma
      usage: battery

      # Modbus TCP
      modbus: tcpip
      id: 1
      host:  # Hostname
      port: 502 # Port
      capacity: 50 # Akkukapazität (kWh), optional
      minsoc: 0 # Minimaler Ladestand (%), Untere Grenze wie am Batteriesystem eingestellt. Wird vom Optimizer genutzt. (optional)
      maxsoc: 100 # Maximaler Ladestand (%), Obere Grenze wie am Batteriesystem eingestellt. Wird vom Optimizer und für Netzladen genutzt. (optional)
      maxchargepower: # Maximale Ladeleistung (W), Für erzwungenes Laden des Speichers. (optional)
      maxdischargepower: # Maximale Entladeleistung (W), Maximale Entladeleistung des Speichers. (optional)
