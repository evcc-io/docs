template: rct-power
product:
  identifier: rct-power
  brand: RCT
  description: Power
capabilities: ["battery-control", "curtail"]
requirements: ["skiptest"]
render:
  - usage: grid
    default: |
      type: template
      template: rct-power
      usage: grid
      host: 192.0.2.2 # IP-Adresse oder Hostname
      port: 8899 # Port
    advanced: |
      type: template
      template: rct-power
      usage: grid
      host: 192.0.2.2 # IP-Adresse oder Hostname
      port: 8899 # Port
      cache: 30s # Cache, Zeitintervall für erneute Datenabfrage (optional)
  - usage: pv
    default: |
      type: template
      template: rct-power
      usage: pv
      host: 192.0.2.2 # IP-Adresse oder Hostname
      port: 8899 # Port
    advanced: |
      type: template
      template: rct-power
      usage: pv
      host: 192.0.2.2 # IP-Adresse oder Hostname
      port: 8899 # Port
      maxacpower: 0 # Maximale AC Leistung des Hybrid-Wechselrichters (W), optional
      externalpower: # Externe Leistung, Externe Leistung aller an S0 angeschlossenen Geräte abfragen (optional)
      cache: 30s # Cache, Zeitintervall für erneute Datenabfrage (optional)
  - usage: battery
    default: |
      type: template
      template: rct-power
      usage: battery
      host: 192.0.2.2 # IP-Adresse oder Hostname
      port: 8899 # Port
      capacity: 50 # Akkukapazität (kWh), optional
      minsoc: 7 # Minimaler Ladestand (%), Untere Grenze wie am Batteriesystem eingestellt. Wird vom Optimizer genutzt. (optional)
      maxsoc: 97 # Maximaler Ladestand (%), Obere Grenze wie am Batteriesystem eingestellt. Genutzt vom Optimizer und, bei manchen Geräten, für Netzladen. (optional)
      capacity2: 50 # Akkukapazität der zweiten Batterie (kWh), optional
    advanced: |
      type: template
      template: rct-power
      usage: battery
      host: 192.0.2.2 # IP-Adresse oder Hostname
      port: 8899 # Port
      capacity: 50 # Akkukapazität (kWh), optional
      minsoc: 7 # Minimaler Ladestand (%), Untere Grenze wie am Batteriesystem eingestellt. Wird vom Optimizer genutzt. (optional)
      maxsoc: 97 # Maximaler Ladestand (%), Obere Grenze wie am Batteriesystem eingestellt. Genutzt vom Optimizer und, bei manchen Geräten, für Netzladen. (optional)
      capacity2: 50 # Akkukapazität der zweiten Batterie (kWh), optional
      maxchargepower: # Maximale Ladeleistung (W), Höchste Leistung, mit der das Batteriesystem laden kann. Der Optimizer plant mit Laden bis zu dieser Leistung. Manche Geräte nutzen diesen Wert auch als Leistung für Netzladen. (optional)
      maxdischargepower: # Maximale Entladeleistung (W), Höchste Leistung, mit der das Batteriesystem entladen kann. Der Optimizer plant mit Entladen bis zu dieser Leistung. Der Smart-Modus geht davon aus, dass die Batterie höchstens diese Leistung zum Fahrzeugladen beisteuert. (optional)
      cache: 30s # Cache, Zeitintervall für erneute Datenabfrage (optional)
params:
  - name: host
    example: 192.0.2.2
    default:
    choice: []
    unit:
    description: IP-Adresse oder Hostname
    help:
    advanced: false
    optional: false
  - name: port
    example:
    default: 8899
    choice: []
    unit:
    description: Port
    help:
    advanced: false
    optional: false
  - name: capacity
    example: 50
    default:
    choice: []
    unit: kWh
    description: Akkukapazität
    help:
    advanced: false
    optional: true
  - name: minsoc
    example: 25
    default: 7
    choice: []
    unit: '%'
    description: Minimaler Ladestand
    help: Untere Grenze wie am Batteriesystem eingestellt. Wird vom Optimizer genutzt.
    advanced: false
    optional: true
  - name: maxsoc
    example: 95
    default: 97
    choice: []
    unit: '%'
    description: Maximaler Ladestand
    help: Obere Grenze wie am Batteriesystem eingestellt. Genutzt vom Optimizer und, bei manchen Geräten, für Netzladen.
    advanced: false
    optional: true
  - name: capacity2
    example: 50
    default:
    choice: []
    unit: kWh
    description: Akkukapazität der zweiten Batterie
    help:
    advanced: false
    optional: true
  - name: maxacpower
    example: 5000
    default: 0
    choice: []
    unit: W
    description: Maximale AC Leistung des Hybrid-Wechselrichters
    help:
    advanced: true
    optional: true
  - name: externalpower
    example:
    default:
    choice: []
    unit:
    description: Externe Leistung
    help: Externe Leistung aller an S0 angeschlossenen Geräte abfragen
    advanced: true
    optional: true
  - name: maxchargepower
    example:
    default:
    choice: []
    unit: W
    description: Maximale Ladeleistung
    help: Höchste Leistung, mit der das Batteriesystem laden kann. Der Optimizer plant mit Laden bis zu dieser Leistung. Manche Geräte nutzen diesen Wert auch als Leistung für Netzladen.
    advanced: true
    optional: true
  - name: maxdischargepower
    example:
    default:
    choice: []
    unit: W
    description: Maximale Entladeleistung
    help: Höchste Leistung, mit der das Batteriesystem entladen kann. Der Optimizer plant mit Entladen bis zu dieser Leistung. Der Smart-Modus geht davon aus, dass die Batterie höchstens diese Leistung zum Fahrzeugladen beisteuert.
    advanced: true
    optional: true
  - name: cache
    example: 5m
    default: 30s
    choice: []
    unit:
    description: Cache
    help: Zeitintervall für erneute Datenabfrage
    advanced: true
    optional: true