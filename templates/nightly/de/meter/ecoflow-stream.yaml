template: ecoflow-stream
product:
  identifier: ecoflow-stream
  brand: EcoFlow
  description: Stream
capabilities: ["battery-control"]
description: |
  Für die Nutzung des EcoFlow Stream Meters benötigen Sie:
  - Einen gültigen Access Key von der EcoFlow Developer Console
  - Den entsprechenden Secret Key
  - Die Seriennummer des Hauptgerätes Ihres Stream Systems

  Diese Credentials erhalten Sie über die EcoFlow Developer Console nach der Registrierung Ihrer Anwendung.

  Im Normalbetrieb wird die Backup Reserve auf `minsoc` gesetzt, beim Netzladen auf `maxsoc`.

  **Achtung**: Die aktive Batteriesteuerung überschreibt die in der EcoFlow App eingestellte
  Backup Reserve. Das Gerät verlangt, dass die Backup Reserve das Entladelimit um 3 übersteigt,
  niedrigere Werte für `minsoc` werden angehoben. Ohne `minsoc` entlädt die Batterie bis zum
  Entladelimit des Geräts.

render:
  - usage: grid
    default: |
      type: template
      template: ecoflow-stream
      usage: grid
      accesskey: # Access Key, Access Key aus der EcoFlow Developer Console
      secretkey: # Secret Key, Secret Key aus der EcoFlow Developer Console
      serial: # Seriennummer, Seriennummer des Hauptgeräts (normalerweise das erste Gerät) Ihres Stream Systems. Falls das Hauptgerät wechselt, die Seriennummern aller Geräte durch Kommas getrennt angeben, das aktuelle Hauptgerät wird automatisch erkannt.
    advanced: |
      type: template
      template: ecoflow-stream
      usage: grid
      accesskey: # Access Key, Access Key aus der EcoFlow Developer Console
      secretkey: # Secret Key, Secret Key aus der EcoFlow Developer Console
      serial: # Seriennummer, Seriennummer des Hauptgeräts (normalerweise das erste Gerät) Ihres Stream Systems. Falls das Hauptgerät wechselt, die Seriennummern aller Geräte durch Kommas getrennt angeben, das aktuelle Hauptgerät wird automatisch erkannt.
      region: auto # API Region, Manche Nutzer, z.B. mit Starlink-Internet, sehen gelegentlich in den Logs den "error code 8513". Das passiert, wenn die API Region nicht korrekt erkannt wird. Um das zu beheben, kann man die API Region manuell setzen. Mögliche Werte: auto (Standard), europe oder america. [auto, europe, america] (optional)
      cache: 30s # Cache, Zeitintervall für erneute Datenabfrage (optional)
  - usage: pv
    default: |
      type: template
      template: ecoflow-stream
      usage: pv
      accesskey: # Access Key, Access Key aus der EcoFlow Developer Console
      secretkey: # Secret Key, Secret Key aus der EcoFlow Developer Console
      serial: # Seriennummer, Seriennummer des Hauptgeräts (normalerweise das erste Gerät) Ihres Stream Systems. Falls das Hauptgerät wechselt, die Seriennummern aller Geräte durch Kommas getrennt angeben, das aktuelle Hauptgerät wird automatisch erkannt.
    advanced: |
      type: template
      template: ecoflow-stream
      usage: pv
      accesskey: # Access Key, Access Key aus der EcoFlow Developer Console
      secretkey: # Secret Key, Secret Key aus der EcoFlow Developer Console
      serial: # Seriennummer, Seriennummer des Hauptgeräts (normalerweise das erste Gerät) Ihres Stream Systems. Falls das Hauptgerät wechselt, die Seriennummern aller Geräte durch Kommas getrennt angeben, das aktuelle Hauptgerät wird automatisch erkannt.
      region: auto # API Region, Manche Nutzer, z.B. mit Starlink-Internet, sehen gelegentlich in den Logs den "error code 8513". Das passiert, wenn die API Region nicht korrekt erkannt wird. Um das zu beheben, kann man die API Region manuell setzen. Mögliche Werte: auto (Standard), europe oder america. [auto, europe, america] (optional)
      cache: 30s # Cache, Zeitintervall für erneute Datenabfrage (optional)
  - usage: battery
    default: |
      type: template
      template: ecoflow-stream
      usage: battery
      accesskey: # Access Key, Access Key aus der EcoFlow Developer Console
      secretkey: # Secret Key, Secret Key aus der EcoFlow Developer Console
      serial: # Seriennummer, Seriennummer des Hauptgeräts (normalerweise das erste Gerät) Ihres Stream Systems. Falls das Hauptgerät wechselt, die Seriennummern aller Geräte durch Kommas getrennt angeben, das aktuelle Hauptgerät wird automatisch erkannt.
      capacity: 50 # Akkukapazität (kWh), optional
      minsoc: 0 # Minimaler Ladestand (%), Untere Grenze wie am Batteriesystem eingestellt. Wird vom Optimizer genutzt. (optional)
      maxsoc: 100 # Maximaler Ladestand (%), Obere Grenze wie am Batteriesystem eingestellt. Genutzt vom Optimizer und, bei manchen Geräten, für Netzladen. (optional)
    advanced: |
      type: template
      template: ecoflow-stream
      usage: battery
      accesskey: # Access Key, Access Key aus der EcoFlow Developer Console
      secretkey: # Secret Key, Secret Key aus der EcoFlow Developer Console
      serial: # Seriennummer, Seriennummer des Hauptgeräts (normalerweise das erste Gerät) Ihres Stream Systems. Falls das Hauptgerät wechselt, die Seriennummern aller Geräte durch Kommas getrennt angeben, das aktuelle Hauptgerät wird automatisch erkannt.
      capacity: 50 # Akkukapazität (kWh), optional
      minsoc: 0 # Minimaler Ladestand (%), Untere Grenze wie am Batteriesystem eingestellt. Wird vom Optimizer genutzt. (optional)
      maxsoc: 100 # Maximaler Ladestand (%), Obere Grenze wie am Batteriesystem eingestellt. Genutzt vom Optimizer und, bei manchen Geräten, für Netzladen. (optional)
      region: auto # API Region, Manche Nutzer, z.B. mit Starlink-Internet, sehen gelegentlich in den Logs den "error code 8513". Das passiert, wenn die API Region nicht korrekt erkannt wird. Um das zu beheben, kann man die API Region manuell setzen. Mögliche Werte: auto (Standard), europe oder america. [auto, europe, america] (optional)
      cache: 30s # Cache, Zeitintervall für erneute Datenabfrage (optional)
      maxchargepower: # Maximale Ladeleistung (W), Höchste Leistung, mit der das Batteriesystem laden kann. Der Optimizer plant mit Laden bis zu dieser Leistung. Manche Geräte nutzen diesen Wert auch als Leistung für Netzladen. (optional)
      maxdischargepower: # Maximale Entladeleistung (W), Höchste Leistung, mit der das Batteriesystem entladen kann. Der Optimizer plant mit Entladen bis zu dieser Leistung. Der Smart-Modus geht davon aus, dass die Batterie höchstens diese Leistung zum Fahrzeugladen beisteuert. (optional)
