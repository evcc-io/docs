template: fronius-smart-meter-ip
product:
  identifier: fronius-smart-meter-ip
  brand: Fronius
  description: Smart Meter IP
description: |
  Modbus TCP muss in der Weboberfläche des Zählers aktiviert sein (Einstellungen → Datenschnittstellen → Modbus (TCP und RTU)). Der Zähler wird direkt über seine eigene IP-Adresse ausgelesen, nicht über den Wechselrichter.

render:
  - usage: grid
    default: |
      type: template
      template: fronius-smart-meter-ip
      usage: grid
      host: 192.0.2.2 # IP-Adresse oder Hostname
      port: 502 # Port, optional
    advanced: |
      type: template
      template: fronius-smart-meter-ip
      usage: grid
      host: 192.0.2.2 # IP-Adresse oder Hostname
      port: 502 # Port, optional
      id: 1 # ID, optional
params:
  - name: host
    example: 192.0.2.2
    default:
    choice: []
    unit:
    description: IP-Adresse oder Hostname
    help:
    advanced: false
    optional: false
  - name: port
    example:
    default: 502
    choice: []
    unit:
    description: Port
    help:
    advanced: false
    optional: true
  - name: id
    example:
    default: 1
    choice: []
    unit:
    description: ID
    help:
    advanced: true
    optional: true