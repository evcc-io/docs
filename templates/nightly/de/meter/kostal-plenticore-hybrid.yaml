template: kostal-plenticore-gen2
product:
  identifier: kostal-plenticore-hybrid
  brand: Kostal
  description: Plenticore Hybrid
capabilities: ["battery-control", "curtail"]
description: |
  Anwendbar für verschiedene Wechselrichter Generationen (G1/G2/G3). Für die aktive Batteriesteuerung muss die Funktion externe Batteriesteuerung über Modbus mit dem Handwerkerzugang aktiviert sein.

caveats:
  - description: |
      Nur ein System kann und darf auf den Wechselrichter zugreifen! Plenticore G1 erfordert mindestens Firmware UI 01.16.05025 (04.11.2020, MC >=01.44).

    link: https://github.com/evcc-io/evcc/wiki/Kostal-Plenticore
render:
  - usage: pv
    default: |
      type: template
      template: kostal-plenticore-gen2
      usage: pv

      # Modbus TCP
      modbus: tcpip
      id: 71
      host:  # Hostname
      port: 1502 # Port
    advanced: |
      type: template
      template: kostal-plenticore-gen2
      usage: pv

      # Modbus TCP
      modbus: tcpip
      id: 71
      host:  # Hostname
      port: 1502 # Port
      endianness: little # Byte-Reihenfolge (Little/Big), [little, big] (optional)
      maxacpower: 0 # Maximale AC Leistung des Hybrid-Wechselrichters (W), optional
      watchdog: 60s # Watchdog, optional
  - usage: battery
    default: |
      type: template
      template: kostal-plenticore-gen2
      usage: battery

      # Modbus TCP
      modbus: tcpip
      id: 71
      host:  # Hostname
      port: 1502 # Port
      capacity: 50 # Akkukapazität (kWh), optional
      minsoc: 0 # Minimaler Ladestand (%), Untere Grenze wie am Batteriesystem eingestellt. Wird vom Optimizer genutzt. (optional)
      maxsoc: 100 # Maximaler Ladestand (%), Obere Grenze wie am Batteriesystem eingestellt. Genutzt vom Optimizer und, bei manchen Geräten, für Netzladen. (optional)
    advanced: |
      type: template
      template: kostal-plenticore-gen2
      usage: battery

      # Modbus TCP
      modbus: tcpip
      id: 71
      host:  # Hostname
      port: 1502 # Port
      capacity: 50 # Akkukapazität (kWh), optional
      minsoc: 0 # Minimaler Ladestand (%), Untere Grenze wie am Batteriesystem eingestellt. Wird vom Optimizer genutzt. (optional)
      maxsoc: 100 # Maximaler Ladestand (%), Obere Grenze wie am Batteriesystem eingestellt. Genutzt vom Optimizer und, bei manchen Geräten, für Netzladen. (optional)
      endianness: little # Byte-Reihenfolge (Little/Big), [little, big] (optional)
      maxchargepower: # Maximale Ladeleistung (W), Höchste Leistung, mit der das Batteriesystem laden kann. Der Optimizer plant mit Laden bis zu dieser Leistung. Manche Geräte nutzen diesen Wert auch als Leistung für Netzladen. (optional)
      maxdischargepower: # Maximale Entladeleistung (W), Höchste Leistung, mit der das Batteriesystem entladen kann. Der Optimizer plant mit Entladen bis zu dieser Leistung. Der Smart-Modus geht davon aus, dass die Batterie höchstens diese Leistung zum Fahrzeugladen beisteuert. (optional)
      watchdog: 60s # Watchdog, optional
