template: openems
product:
  identifier: openems-rest-api
  brand: OpenEMS
  description: REST-API
capabilities: ["battery-control"]
description: |
  ##### Lizenzhinweis:
  Für FENECON FEMS Systeme ist für die aktive Batteriesteuerung eine kommerzielle Lizenz *FEMS App REST/JSON Schreibzugriff* erforderlich.

  ##### FEMS-Dokumentation:
  - FEMS App REST/JSON Lesezugriff: [docs.fenecon.de](https://docs.fenecon.de/de/fems/fems-app/App_REST-JSON_Lesezugriff.html)
  - FEMS App REST/JSON Schreibzugriff: [docs.fenecon.de](https://docs.fenecon.de/de/fems/fems-app/App_REST-JSON_Schreibzugriff.html)
  ##### OpenEMS-Dokumentation:
  - OpenEMS Edge REST-Api Controller: [openems.github.io](https://openems.github.io/openems.io/openems/latest/edge/controller.d/io.openems.edge.controller.api.rest.html)

render:
  - usage: grid
    default: |
      type: template
      template: openems
      usage: grid
      host: 192.0.2.2 # IP-Adresse oder Hostname
    advanced: |
      type: template
      template: openems
      usage: grid
      host: 192.0.2.2 # IP-Adresse oder Hostname
      password: user # Passwort, Zugangspasswort des Dienstes (optional)
      cache: 1s # Cache, Zeitintervall für erneute Datenabfrage (optional)
  - usage: pv
    default: |
      type: template
      template: openems
      usage: pv
      host: 192.0.2.2 # IP-Adresse oder Hostname
    advanced: |
      type: template
      template: openems
      usage: pv
      host: 192.0.2.2 # IP-Adresse oder Hostname
      password: user # Passwort, Zugangspasswort des Dienstes (optional)
      maxacpower: 0 # Maximale AC Leistung des Hybrid-Wechselrichters (W), optional
      cache: 1s # Cache, Zeitintervall für erneute Datenabfrage (optional)
  - usage: battery
    default: |
      type: template
      template: openems
      usage: battery
      host: 192.0.2.2 # IP-Adresse oder Hostname
      capacity: 50 # Akkukapazität (kWh), optional
      minsoc: 0 # Minimaler Ladestand (%), Untere Grenze wie am Batteriesystem eingestellt. Wird vom Optimizer genutzt. (optional)
      maxsoc: 100 # Maximaler Ladestand (%), Obere Grenze wie am Batteriesystem eingestellt. Genutzt vom Optimizer und, bei manchen Geräten, für Netzladen. (optional)
    advanced: |
      type: template
      template: openems
      usage: battery
      host: 192.0.2.2 # IP-Adresse oder Hostname
      capacity: 50 # Akkukapazität (kWh), optional
      minsoc: 0 # Minimaler Ladestand (%), Untere Grenze wie am Batteriesystem eingestellt. Wird vom Optimizer genutzt. (optional)
      maxsoc: 100 # Maximaler Ladestand (%), Obere Grenze wie am Batteriesystem eingestellt. Genutzt vom Optimizer und, bei manchen Geräten, für Netzladen. (optional)
      password: user # Passwort, Zugangspasswort des Dienstes (optional)
      battery: ess0 # Steuerbare Batterie Komponente, aktive Batteriesteuerung (REST/JSON schreibend) (optional)
      watchdog: 60s # FEMS/OpenEMS Batteriesteuerung API-Timeout, FEMS/OpenEMS Standard 60s (optional)
      maxchargepower: # Maximale Ladeleistung (W), Höchste Leistung, mit der das Batteriesystem laden kann. Der Optimizer plant mit Laden bis zu dieser Leistung. Manche Geräte nutzen diesen Wert auch als Leistung für Netzladen. (optional)
      maxdischargepower: # Maximale Entladeleistung (W), Höchste Leistung, mit der das Batteriesystem entladen kann. Der Optimizer plant mit Entladen bis zu dieser Leistung. Der Smart-Modus geht davon aus, dass die Batterie höchstens diese Leistung zum Fahrzeugladen beisteuert. (optional)
      cache: 1s # Cache, Zeitintervall für erneute Datenabfrage (optional)
params:
  - name: host
    example: 192.0.2.2
    default:
    choice: []
    unit:
    description: IP-Adresse oder Hostname
    help:
    advanced: false
    optional: false
  - name: capacity
    example: 50
    default:
    choice: []
    unit: kWh
    description: Akkukapazität
    help:
    advanced: false
    optional: true
  - name: minsoc
    example: 25
    default: 0
    choice: []
    unit: '%'
    description: Minimaler Ladestand
    help: Untere Grenze wie am Batteriesystem eingestellt. Wird vom Optimizer genutzt.
    advanced: false
    optional: true
  - name: maxsoc
    example: 95
    default: 100
    choice: []
    unit: '%'
    description: Maximaler Ladestand
    help: Obere Grenze wie am Batteriesystem eingestellt. Genutzt vom Optimizer und, bei manchen Geräten, für Netzladen.
    advanced: false
    optional: true
  - name: password
    example:
    default: user
    choice: []
    unit:
    description: Passwort
    help: Zugangspasswort des Dienstes
    advanced: true
    optional: true
  - name: maxacpower
    example: 5000
    default: 0
    choice: []
    unit: W
    description: Maximale AC Leistung des Hybrid-Wechselrichters
    help:
    advanced: true
    optional: true
  - name: battery
    example: ess0
    default:
    choice: []
    unit:
    description: Steuerbare Batterie Komponente
    help: aktive Batteriesteuerung (REST/JSON schreibend)
    advanced: true
    optional: true
  - name: watchdog
    example:
    default: 60s
    choice: []
    unit:
    description: FEMS/OpenEMS Batteriesteuerung API-Timeout
    help: FEMS/OpenEMS Standard 60s
    advanced: true
    optional: true
  - name: maxchargepower
    example:
    default:
    choice: []
    unit: W
    description: Maximale Ladeleistung
    help: Höchste Leistung, mit der das Batteriesystem laden kann. Der Optimizer plant mit Laden bis zu dieser Leistung. Manche Geräte nutzen diesen Wert auch als Leistung für Netzladen.
    advanced: true
    optional: true
  - name: maxdischargepower
    example:
    default:
    choice: []
    unit: W
    description: Maximale Entladeleistung
    help: Höchste Leistung, mit der das Batteriesystem entladen kann. Der Optimizer plant mit Entladen bis zu dieser Leistung. Der Smart-Modus geht davon aus, dass die Batterie höchstens diese Leistung zum Fahrzeugladen beisteuert.
    advanced: true
    optional: true
  - name: cache
    example: 5m
    default: 1s
    choice: []
    unit:
    description: Cache
    help: Zeitintervall für erneute Datenabfrage
    advanced: true
    optional: true