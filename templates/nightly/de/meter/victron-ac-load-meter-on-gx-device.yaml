template: victron-gx
product:
  identifier: victron-ac-load-meter-on-gx-device
  brand: Victron
  description: AC-Zähler am GX-Gerät
description: |
  Für zusätzliche Zähler, die am GX-Gerät angeschlossen sind und dort als AC-Verbraucher (`com.victronenergy.acload`) erscheinen.
  Netz-, PV- und Batteriemessung wird vom Template `Victron Energy` abgedeckt.
  Die Modbus Unit-ID des Zählers ist auf dem GX-Gerät unter Einstellungen / Integrationen / Modbus-TCP-Server / Verfügbare Dienste zu finden.

render:
  - usage: aux
    default: |
      type: template
      template: victron-gx
      usage: aux

      # Modbus TCP
      modbus: tcpip
      id: 1
      host:  # Hostname
      port: 502 # Port
  - usage: charge
    default: |
      type: template
      template: victron-gx
      usage: charge

      # Modbus TCP
      modbus: tcpip
      id: 1
      host:  # Hostname
      port: 502 # Port
params:
  - name: modbus
    example:
    default:
    choice: ['tcpip']
    unit:
    description: Modbus Typ
    help:
    advanced: false
    optional: false
modbus:
  delay:
  host:
  id: 1
  modbus: tcpip
  port: 502
  tcpip: true
  timeout: