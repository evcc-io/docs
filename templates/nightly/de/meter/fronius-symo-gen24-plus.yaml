template: fronius-gen24
product:
  identifier: fronius-symo-gen24-plus
  brand: Fronius
  description: Symo GEN24 Plus
capabilities: ["battery-control", "curtail"]
description: |
  Um die aktive Ladesteuerung zu nutzen darf der Energiekosten-Assistent (ECA) im Fronius Solar.web nicht aktiviert sein. (Fronius Solar.web->Einstellungen->Betriebsmodus->Eigenverbrauch)
  Zähleradresse von Primär- oder Sekundärzählern: auf der Weboberfläche des Wechselrichters kann nur die Adresse des ersten Zählers (z.B. 200) eingestellt werden. Zusätzliche Zähler erhalten eine aufsteigende Nummer (z.B: 201).

render:
  - usage: grid
    default: |
      type: template
      template: fronius-gen24
      usage: grid

      # Modbus TCP
      modbus: tcpip
      id: 200
      host:  # Hostname
      port: 502 # Port
    advanced: |
      type: template
      template: fronius-gen24
      usage: grid

      # Modbus TCP
      modbus: tcpip
      id: 200
      host:  # Hostname
      port: 502 # Port
  - usage: pv
    default: |
      type: template
      template: fronius-gen24
      usage: pv

      # Modbus TCP
      modbus: tcpip
      id: 200
      host:  # Hostname
      port: 502 # Port
    advanced: |
      type: template
      template: fronius-gen24
      usage: pv

      # Modbus TCP
      modbus: tcpip
      id: 200
      host:  # Hostname
      port: 502 # Port
  - usage: battery
    default: |
      type: template
      template: fronius-gen24
      usage: battery

      # Modbus TCP
      modbus: tcpip
      id: 200
      host:  # Hostname
      port: 502 # Port
      capacity: 50 # Akkukapazität (kWh), optional
      minsoc: 0 # Minimaler Ladestand (%), Untere Grenze wie am Batteriesystem eingestellt. Wird vom Optimizer genutzt. (optional)
      maxsoc: 100 # Maximaler Ladestand (%), Obere Grenze wie am Batteriesystem eingestellt. Wird vom Optimizer und für Netzladen genutzt. (optional)
    advanced: |
      type: template
      template: fronius-gen24
      usage: battery

      # Modbus TCP
      modbus: tcpip
      id: 200
      host:  # Hostname
      port: 502 # Port
      capacity: 50 # Akkukapazität (kWh), optional
      minsoc: 0 # Minimaler Ladestand (%), Untere Grenze wie am Batteriesystem eingestellt. Wird vom Optimizer genutzt. (optional)
      maxsoc: 100 # Maximaler Ladestand (%), Obere Grenze wie am Batteriesystem eingestellt. Wird vom Optimizer und für Netzladen genutzt. (optional)
      maxchargepower: # Maximale Ladeleistung (W), Für erzwungenes Laden des Speichers. (optional)
      maxdischargepower: # Maximale Entladeleistung (W), Maximale Entladeleistung des Speichers. (optional)
      maxchargerate: 100 # Maximale prozentuale Ladeleistung (%), Für erzwungenes Laden des Speichers in Prozent in Relation zur maximalen Ladeleistung des Batteriewechselrichters. (optional)
params:
  - name: modbus
    example:
    default:
    choice: ['tcpip']
    unit:
    description: Modbus Typ
    help:
    advanced: false
    optional: false
  - name: capacity
    example: 50
    default:
    choice: []
    unit: kWh
    description: Akkukapazität
    help:
    advanced: false
    optional: true
  - name: minsoc
    example: 25
    default: 0
    choice: []
    unit: '%'
    description: Minimaler Ladestand
    help: Untere Grenze wie am Batteriesystem eingestellt. Wird vom Optimizer genutzt.
    advanced: false
    optional: true
  - name: maxsoc
    example: 95
    default: 100
    choice: []
    unit: '%'
    description: Maximaler Ladestand
    help: Obere Grenze wie am Batteriesystem eingestellt. Wird vom Optimizer und für Netzladen genutzt.
    advanced: false
    optional: true
  - name: maxchargepower
    example:
    default:
    choice: []
    unit: W
    description: Maximale Ladeleistung
    help: Für erzwungenes Laden des Speichers.
    advanced: true
    optional: true
  - name: maxdischargepower
    example:
    default:
    choice: []
    unit: W
    description: Maximale Entladeleistung
    help: Maximale Entladeleistung des Speichers.
    advanced: true
    optional: true
  - name: maxchargerate
    example:
    default: 100
    choice: []
    unit: '%'
    description: Maximale prozentuale Ladeleistung
    help: Für erzwungenes Laden des Speichers in Prozent in Relation zur maximalen Ladeleistung des Batteriewechselrichters.
    advanced: true
    optional: true
modbus:
  delay:
  host:
  id: 200
  modbus: tcpip
  port: 502
  tcpip: true
  timeout: