template: roche-energy-rel261
product:
  identifier: roche-energy-rel261
  brand: Roche Energy
  description: REL261
description: |
  AC-gekoppelter Gewerbespeicher (261 kWh, 125 kW) mit integriertem PCS. Nur Messwerte, keine Batteriesteuerung.

  Modbus TCP muss im HMI des Speichers unter „Remote Management" aktiviert sein. Leistung und SoC liegen auf unterschiedlichen Modbus-IDs: PCS (ID 2) und BMS (ID 34).

  Die Leistung (Register 30135) spiegelt die vom PCS umgesetzte Soll-Leistung und ist kein unabhängiger Messwert. Wird der Speicher extern gesteuert und folgt er dem Kommando nicht (z. B. bei einer PCS-Störung), weicht der Wert von der tatsächlichen Leistung ab.

render:
  - usage: battery
    default: |
      type: template
      template: roche-energy-rel261
      usage: battery
      host: 192.0.2.2 # IP-Adresse oder Hostname
      port: 502 # Port, optional
      capacity: 50 # Akkukapazität (kWh), optional
