template: tuya
product:
  identifier: tuya-smart-plug
  brand: Tuya
  description: Smart Plug
  group: Schaltbare Steckdosen
description: |
  Lokale Verbindung über das Tuya-Protokoll für Steckdosen mit Energiemessung (Apps: „Smart Life“, „Tuya“).
  Device ID und Local Key müssen einmalig ermittelt werden, z. B. mit `tinytuya wizard`, das dafür ein Konto auf der Tuya-IoT-Plattform benötigt. Im Betrieb ist kein Cloud-Zugang nötig. Das Gerät erlaubt nur eine lokale Verbindung gleichzeitig, andere lokale Integrationen (z. B. LocalTuya, Tuya Local) müssen deaktiviert werden.

render:
  - usage: pv
    default: |
      type: template
      template: tuya
      usage: pv
      host: 192.0.2.2 # IP-Adresse oder Hostname
      id: # Device ID
      localkey: # Local Key
  - usage: charge
    default: |
      type: template
      template: tuya
      usage: charge
      host: 192.0.2.2 # IP-Adresse oder Hostname
      id: # Device ID
      localkey: # Local Key
params:
  - name: host
    example: 192.0.2.2
    default:
    choice: []
    unit:
    description: IP-Adresse oder Hostname
    help:
    advanced: false
    optional: false
  - name: id
    example:
    default:
    choice: []
    unit:
    description: Device ID
    help:
    advanced: false
    optional: false
  - name: localkey
    example:
    default:
    choice: []
    unit:
    description: Local Key
    help:
    advanced: false
    optional: false