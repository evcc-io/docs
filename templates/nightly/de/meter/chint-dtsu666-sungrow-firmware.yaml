template: sungrow-meter
product:
  identifier: chint-dtsu666-sungrow-firmware
  brand: CHINT
  description: DTSU666 (Sungrow firmware)
description: |
  Der Zähler darf nicht gleichzeitig am Meter-Port eines Sungrow-Wechselrichters angeschlossen sein. In diesem Fall die Netzwerte über das Wechselrichter-Template auslesen.
render:
  - usage: grid
    default: |
      type: template
      template: sungrow-meter
      usage: grid

      # RS485 via adapter (Modbus RTU)
      modbus: rs485serial
      id: 254
      device: /dev/ttyUSB0 # USB-RS485 Adapter Adresse
      baudrate: 9600 # Prüfe die Geräteeinstellungen, typische Werte sind 9600, 19200, 38400, 57600, 115200
      comset: "8N1" # Kommunikationsparameter für den Adapter

      # RS485 via TCP/IP (Modbus RTU)
      modbus: rs485tcpip
      id: 254
      host:  # Hostname
      port: 502 # Port
  - usage: pv
    default: |
      type: template
      template: sungrow-meter
      usage: pv

      # RS485 via adapter (Modbus RTU)
      modbus: rs485serial
      id: 254
      device: /dev/ttyUSB0 # USB-RS485 Adapter Adresse
      baudrate: 9600 # Prüfe die Geräteeinstellungen, typische Werte sind 9600, 19200, 38400, 57600, 115200
      comset: "8N1" # Kommunikationsparameter für den Adapter

      # RS485 via TCP/IP (Modbus RTU)
      modbus: rs485tcpip
      id: 254
      host:  # Hostname
      port: 502 # Port
  - usage: charge
    default: |
      type: template
      template: sungrow-meter
      usage: charge

      # RS485 via adapter (Modbus RTU)
      modbus: rs485serial
      id: 254
      device: /dev/ttyUSB0 # USB-RS485 Adapter Adresse
      baudrate: 9600 # Prüfe die Geräteeinstellungen, typische Werte sind 9600, 19200, 38400, 57600, 115200
      comset: "8N1" # Kommunikationsparameter für den Adapter

      # RS485 via TCP/IP (Modbus RTU)
      modbus: rs485tcpip
      id: 254
      host:  # Hostname
      port: 502 # Port
params:
  - name: modbus
    example:
    default:
    choice: ['rs485']
    unit:
    description: Modbus Typ
    help:
    advanced: false
    optional: false
modbus:
  baudrate: 9600
  comset: 8N1
  delay:
  device: /dev/ttyUSB0
  host:
  id: 254
  port: 502
  rs485serial: true
  rs485tcpip: true
  timeout: