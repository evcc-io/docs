template: enphase
product:
  identifier: enphase-iq-gateway
  brand: Enphase
  description: IQ Gateway
render:
  - usage: grid
    default: |
      type: template
      template: enphase
      usage: grid
      host: 192.0.2.2 # IP-Adresse oder Hostname
      token: # Token, Ab Envoy Firmware D7.x.xxx notwendig. Token ist ein Jahr gültig. Anleitung (Obtaining a token via web UI): [enphase.com](https://enphase.com/download/accessing-iq-gateway-local-apis-or-local-ui-token-based-authentication) (optional)
    advanced: |
      type: template
      template: enphase
      usage: grid
      host: 192.0.2.2 # IP-Adresse oder Hostname
      token: # Token, Ab Envoy Firmware D7.x.xxx notwendig. Token ist ein Jahr gültig. Anleitung (Obtaining a token via web UI): [enphase.com](https://enphase.com/download/accessing-iq-gateway-local-apis-or-local-ui-token-based-authentication) (optional)
      schema: https # Schema, [https, http] (optional)
      cache: 1s # Cache, Zeitintervall für erneute Datenabfrage (optional)
      timeout: 10s # Zeitüberschreitung, optional
  - usage: pv
    default: |
      type: template
      template: enphase
      usage: pv
      host: 192.0.2.2 # IP-Adresse oder Hostname
      token: # Token, Ab Envoy Firmware D7.x.xxx notwendig. Token ist ein Jahr gültig. Anleitung (Obtaining a token via web UI): [enphase.com](https://enphase.com/download/accessing-iq-gateway-local-apis-or-local-ui-token-based-authentication) (optional)
    advanced: |
      type: template
      template: enphase
      usage: pv
      host: 192.0.2.2 # IP-Adresse oder Hostname
      token: # Token, Ab Envoy Firmware D7.x.xxx notwendig. Token ist ein Jahr gültig. Anleitung (Obtaining a token via web UI): [enphase.com](https://enphase.com/download/accessing-iq-gateway-local-apis-or-local-ui-token-based-authentication) (optional)
      schema: https # Schema, [https, http] (optional)
      cache: 1s # Cache, Zeitintervall für erneute Datenabfrage (optional)
      timeout: 10s # Zeitüberschreitung, optional
  - usage: battery
    default: |
      type: template
      template: enphase
      usage: battery
      host: 192.0.2.2 # IP-Adresse oder Hostname
      token: # Token, Ab Envoy Firmware D7.x.xxx notwendig. Token ist ein Jahr gültig. Anleitung (Obtaining a token via web UI): [enphase.com](https://enphase.com/download/accessing-iq-gateway-local-apis-or-local-ui-token-based-authentication) (optional)
      capacity: 50 # Akkukapazität (kWh), optional
      minsoc: 0 # Minimaler Ladestand (%), Untere Grenze wie am Batteriesystem eingestellt. Wird vom Optimizer genutzt. (optional)
      maxsoc: 100 # Maximaler Ladestand (%), Obere Grenze wie am Batteriesystem eingestellt. Genutzt vom Optimizer und, bei manchen Geräten, für Netzladen. (optional)
    advanced: |
      type: template
      template: enphase
      usage: battery
      host: 192.0.2.2 # IP-Adresse oder Hostname
      token: # Token, Ab Envoy Firmware D7.x.xxx notwendig. Token ist ein Jahr gültig. Anleitung (Obtaining a token via web UI): [enphase.com](https://enphase.com/download/accessing-iq-gateway-local-apis-or-local-ui-token-based-authentication) (optional)
      capacity: 50 # Akkukapazität (kWh), optional
      minsoc: 0 # Minimaler Ladestand (%), Untere Grenze wie am Batteriesystem eingestellt. Wird vom Optimizer genutzt. (optional)
      maxsoc: 100 # Maximaler Ladestand (%), Obere Grenze wie am Batteriesystem eingestellt. Genutzt vom Optimizer und, bei manchen Geräten, für Netzladen. (optional)
      schema: https # Schema, [https, http] (optional)
      battery_type: ac # Enphase Batterietyp (AC oder IQ), Wähle 'iq' falls die neuere 'IQ Battery' Generation installiert ist. Standardeinstellung 'ac' für die ältere 'AC Battery' Generation. [ac, iq] (optional)
      maxchargepower: # Maximale Ladeleistung (W), Höchste Leistung, mit der das Batteriesystem laden kann. Der Optimizer plant mit Laden bis zu dieser Leistung. Manche Geräte nutzen diesen Wert auch als Leistung für Netzladen. (optional)
      maxdischargepower: # Maximale Entladeleistung (W), Höchste Leistung, mit der das Batteriesystem entladen kann. Der Optimizer plant mit Entladen bis zu dieser Leistung. Der Smart-Modus geht davon aus, dass die Batterie höchstens diese Leistung zum Fahrzeugladen beisteuert. (optional)
      cache: 1s # Cache, Zeitintervall für erneute Datenabfrage (optional)
      timeout: 10s # Zeitüberschreitung, optional
params:
  - name: host
    example: 192.0.2.2
    default:
    choice: []
    unit:
    description: IP-Adresse oder Hostname
    help:
    advanced: false
    optional: false
  - name: token
    example:
    default:
    choice: []
    unit:
    description: Token
    help: 'Ab Envoy Firmware D7.x.xxx notwendig. Token ist ein Jahr gültig. Anleitung (Obtaining a token via web UI): [enphase.com](https://enphase.com/download/accessing-iq-gateway-local-apis-or-local-ui-token-based-authentication)'
    advanced: false
    optional: true
  - name: capacity
    example: 50
    default:
    choice: []
    unit: kWh
    description: Akkukapazität
    help:
    advanced: false
    optional: true
  - name: minsoc
    example: 25
    default: 0
    choice: []
    unit: '%'
    description: Minimaler Ladestand
    help: Untere Grenze wie am Batteriesystem eingestellt. Wird vom Optimizer genutzt.
    advanced: false
    optional: true
  - name: maxsoc
    example: 95
    default: 100
    choice: []
    unit: '%'
    description: Maximaler Ladestand
    help: Obere Grenze wie am Batteriesystem eingestellt. Genutzt vom Optimizer und, bei manchen Geräten, für Netzladen.
    advanced: false
    optional: true
  - name: schema
    example:
    default: https
    choice: ['https', 'http']
    unit:
    description: Schema
    help:
    advanced: true
    optional: true
  - name: battery_type
    example:
    default: ac
    choice: ['ac', 'iq']
    unit:
    description: Enphase Batterietyp (AC oder IQ)
    help: Wähle 'iq' falls die neuere 'IQ Battery' Generation installiert ist. Standardeinstellung 'ac' für die ältere 'AC Battery' Generation.
    advanced: true
    optional: true
  - name: maxchargepower
    example:
    default:
    choice: []
    unit: W
    description: Maximale Ladeleistung
    help: Höchste Leistung, mit der das Batteriesystem laden kann. Der Optimizer plant mit Laden bis zu dieser Leistung. Manche Geräte nutzen diesen Wert auch als Leistung für Netzladen.
    advanced: true
    optional: true
  - name: maxdischargepower
    example:
    default:
    choice: []
    unit: W
    description: Maximale Entladeleistung
    help: Höchste Leistung, mit der das Batteriesystem entladen kann. Der Optimizer plant mit Entladen bis zu dieser Leistung. Der Smart-Modus geht davon aus, dass die Batterie höchstens diese Leistung zum Fahrzeugladen beisteuert.
    advanced: true
    optional: true
  - name: cache
    example: 5m
    default: 1s
    choice: []
    unit:
    description: Cache
    help: Zeitintervall für erneute Datenabfrage
    advanced: true
    optional: true
  - name: timeout
    example: 10s
    default: 10s
    choice: []
    unit:
    description: Zeitüberschreitung
    help:
    advanced: true
    optional: true