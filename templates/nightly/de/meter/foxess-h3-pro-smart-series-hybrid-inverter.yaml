template: fox-ess-h3-smart
product:
  identifier: foxess-h3-pro-smart-series-hybrid-inverter
  brand: FoxESS
  description: H3-Pro/Smart Series Hybrid Inverter
capabilities: ["battery-control"]
render:
  - usage: grid
    default: |
      type: template
      template: fox-ess-h3-smart
      usage: grid

      # RS485 via adapter (Modbus RTU)
      modbus: rs485serial
      id: 247
      device: /dev/ttyUSB0 # USB-RS485 Adapter Adresse
      baudrate: 9600 # Prüfe die Geräteeinstellungen, typische Werte sind 9600, 19200, 38400, 57600, 115200
      comset: "8N1" # Kommunikationsparameter für den Adapter

      # RS485 via TCP/IP (Modbus RTU)
      modbus: rs485tcpip
      id: 247
      host:  # Hostname
      port: 502 # Port

      # Modbus TCP
      modbus: tcpip
      id: 247
      host:  # Hostname
      port: 502 # Port
      maxdischargecurrent: # Max Entladestrom, Maximaler Batterieentladestrom in A, wird beim Verlassen des Haltemodus zurückgeschrieben. Werkseinstellung 50 A bei H3-Pro/Smart (26 A bei H3).
    advanced: |
      type: template
      template: fox-ess-h3-smart
      usage: grid

