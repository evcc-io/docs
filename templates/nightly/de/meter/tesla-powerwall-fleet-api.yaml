template: tesla-powerwall-fleet
product:
  identifier: tesla-powerwall-fleet-api
  brand: Tesla
  description: Powerwall (Fleet API)
capabilities: ["battery-control"]
description: |
  Tesla bietet eine offizielle, aber kostenpflichtige Fleet API an.
  Für private Nutzung kannst du dir einen Tesla Developer Account bei [developer.tesla.com](https://developer.tesla.com/) erstellen und erhältst ein monatliches API-Guthaben von 10 €.

  Die Anleitung von [myteslamate.com](https://www.myteslamate.com/tesla-api-application-registration/) erklärt den Prozess und generiert dir kostenfrei die für evcc benötigten Access- und Refresh-Token.
  Mit diesem Tokenpaar und deiner im Tesla Developer Account erstellten Client ID kann evcc direkt mit der Tesla Fleet API kommunizieren.

render:
  - default: |
      type: template
      template: tesla-powerwall-fleet
      host: 192.0.2.2 # IP-Adresse oder Hostname
      password: # Passwort, Passwort des Benutzers "Kunde". Default sind die letzten 5 Zeichen des auf dem Tesla Gateway genannten Passworts.
      clientId: # Client ID, von [developer.tesla.com](https://developer.tesla.com/dashboard).
      accessToken: # Access token, von [myteslamate.com](https://app.myteslamate.com/).
      refreshToken: # Refresh token, von [myteslamate.com](https://app.myteslamate.com/).
      siteId: # Site ID, optionale Product ID dieser Energy Site, zum Übersteuern der automatischen Erkennung (optional)
    advanced: |
      type: template
      template: tesla-powerwall-fleet
      host: 192.0.2.2 # IP-Adresse oder Hostname
      password: # Passwort, Passwort des Benutzers "Kunde". Default sind die letzten 5 Zeichen des auf dem Tesla Gateway genannten Passworts.
      clientId: # Client ID, von [developer.tesla.com](https://developer.tesla.com/dashboard).
      accessToken: # Access token, von [myteslamate.com](https://app.myteslamate.com/).
      refreshToken: # Refresh token, von [myteslamate.com](https://app.myteslamate.com/).
      siteId: # Site ID, optionale Product ID dieser Energy Site, zum Übersteuern der automatischen Erkennung (optional)
      minsoc: 25 # Minimaler Ladestand (%), Untere Grenze beim Entladen der Batterie im normalen Betrieb (optional)
      maxsoc: 95 # Maximaler Ladestand (%), Oberes Limit beim Laden der Batterie aus dem Netz (optional)
      maxchargepower: # Maximale Ladeleistung (W), Für erzwungenes Laden des Speichers. (optional)
      maxdischargepower: # Maximale Entladeleistung (W), Maximale Entladeleistung des Speichers. (optional)
params:
