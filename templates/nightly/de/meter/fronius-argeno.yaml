template: fronius-argeno
product:
  identifier: fronius-argeno
  brand: Fronius
  description: Argeno
description: |
  Modbus TCP muss am Wechselrichter aktiviert sein (Konfiguration → Kommunikation → Ethernet → Modbus TCP/UDP). Für den Netzzähler siehe Template „Fronius Smart Meter IP" — der Argeno nutzt den Smart Meter IP als eigenständiges Netzwerkgerät.

render:
  - usage: pv
    default: |
      type: template
      template: fronius-argeno
      usage: pv

      # Modbus TCP
      modbus: tcpip
      id: 1
      host:  # Hostname
      port: 502 # Port
params:
  - name: modbus
    example:
    default:
    choice: ['tcpip']
    unit:
    description: Modbus Typ
    help:
    advanced: false
    optional: false
modbus:
  delay:
  host:
  id: 1
  modbus: tcpip
  port: 502
  tcpip: true
  timeout: