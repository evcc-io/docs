template: matismart-mpm4000
product:
  identifier: matismart-mpm4000
  brand: Matismart
  description: MPM4000
description: |
  Jeder der vier dreiphasigen Messkreise (X1 bis X4) wird als eigener Zähler konfiguriert, z. B. Netz auf X1 und Wallbox auf X2.

  Anschlussart und Stromrichtung werden am Gerät eingestellt.

render:
  - usage: grid
    default: |
      type: template
      template: matismart-mpm4000
      usage: grid

      # RS485 via adapter (Modbus RTU)
      modbus: rs485serial
      id: 1
      device: /dev/ttyUSB0 # USB-RS485 Adapter Adresse
      baudrate: 9600 # Prüfe die Geräteeinstellungen, typische Werte sind 9600, 19200, 38400, 57600, 115200
      comset: "8N1" # Kommunikationsparameter für den Adapter

      # RS485 via TCP/IP (Modbus RTU)
      modbus: rs485tcpip
      id: 1
      host:  # Hostname
      port: 502 # Port

      # Modbus TCP
      modbus: tcpip
      id: 1
      host:  # Hostname
      port: 502 # Port
      channel: 1 # Messkreis, Messkreis X1 bis X4 [1, 2, 3, 4]
  - usage: pv
    default: |
      type: template
      template: matismart-mpm4000
      usage: pv

      # RS485 via adapter (Modbus RTU)
