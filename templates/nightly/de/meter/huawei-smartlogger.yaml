    example: 5000
    default: 0
    choice: []
    unit: W
    description: Maximale AC Leistung des Hybrid-Wechselrichters
    help:
    advanced: true
    optional: true
modbus:
  delay:
  host:
  id: 0
  modbus: tcpip
  port: 502
  tcpip: true
  timeout: