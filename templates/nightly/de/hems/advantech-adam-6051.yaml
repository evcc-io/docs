template: fnn-modbus
product:
  identifier: advantech-adam-6051
  brand: Advantech
  description: ADAM-6051
description: |
  Die Schaltkontakte der Steuerbox werden an die Digitaleingänge des Moduls angeschlossen. Das Modul muss die Eingänge als Discrete Inputs (Funktionscode 02) bereitstellen, ein geschlossener Kontakt wird als aktiv gelesen.
caveats:
  - description: |
      Die Eingänge sind ab 0 beschriftet (DI0 = Eingang 1). Die Adresszuordnung ist noch nicht am Gerät bestätigt. Wird der falsche Eingang gelesen, die Nummer um 1 erhöhen.
render:
  - default: |
      type: template
      template: fnn-modbus

      # Modbus TCP
      modbus: tcpip
      id: 1
      host:  # Hostname
      port: 502 # Port
      maxconsumptionpower: # Garantierte Mindestleistung (Pmin) (W), Leistungsbegrenzung des Hauptstromkreises während die Limitierung aktiv ist.
      w4input: 1 # W4-Eingang, Nummer des Digitaleingangs für das W4-Signal (Dimmen der steuerbaren Verbrauchseinrichtungen), gezählt ab 1 (erster Eingang = 1)
      w3input: 2 # W3-Eingang, Nummer des Digitaleingangs für das W3-Signal (Keine Netzeinspeisung, 0%), gezählt ab 1 (erster Eingang = 1)
      productionnominalmax: # Installierte Generatorleistung (Wp), Gesamtnennleistung bzw. Modul- oder Generatorleistung der Anlage (Bezugsgröße nach § 9 EEG). (optional)
      s1input: 3 # S1-Eingang, Nummer des Digitaleingangs für das S1-Signal (Reduzierung der Einspeiseleistung auf 60%), gezählt ab 1 (erster Eingang = 1) (optional)
      s2input: 4 # S2-Eingang, Nummer des Digitaleingangs für das S2-Signal (Reduzierung der Einspeiseleistung auf 30%), gezählt ab 1 (erster Eingang = 1) (optional)
params:
  - name: modbus
    example:
    default:
    choice: ['tcpip']
    unit:
    description: Modbus Typ
    help:
    advanced: false
    optional: false
  - name: maxconsumptionpower
    example:
    default:
    choice: []
    unit: W
    description: Garantierte Mindestleistung (Pmin)
    help: Leistungsbegrenzung des Hauptstromkreises während die Limitierung aktiv ist.
    advanced: false
    optional: false
  - name: w4input
    example:
    default: 1
    choice: []
    unit:
    description: W4-Eingang
    help: Nummer des Digitaleingangs für das W4-Signal (Dimmen der steuerbaren Verbrauchseinrichtungen), gezählt ab 1 (erster Eingang = 1)
    advanced: false
    optional: false
  - name: w3input
    example:
    default: 2
    choice: []
    unit:
    description: W3-Eingang
    help: Nummer des Digitaleingangs für das W3-Signal (Keine Netzeinspeisung, 0%), gezählt ab 1 (erster Eingang = 1)
    advanced: false
    optional: false
  - name: productionnominalmax
    example:
    default:
    choice: []
    unit: Wp
    description: Installierte Generatorleistung
    help: Gesamtnennleistung bzw. Modul- oder Generatorleistung der Anlage (Bezugsgröße nach § 9 EEG).
    advanced: false
    optional: true
  - name: s1input
    example: 3
    default:
    choice: []
    unit:
    description: S1-Eingang
    help: Nummer des Digitaleingangs für das S1-Signal (Reduzierung der Einspeiseleistung auf 60%), gezählt ab 1 (erster Eingang = 1)
    advanced: false
    optional: true
  - name: s2input
    example: 4
    default:
    choice: []
    unit:
    description: S2-Eingang
    help: Nummer des Digitaleingangs für das S2-Signal (Reduzierung der Einspeiseleistung auf 30%), gezählt ab 1 (erster Eingang = 1)
    advanced: false
    optional: true
modbus:
  delay:
  host:
  id: 1
  modbus: tcpip
  port: 502
  tcpip: true
