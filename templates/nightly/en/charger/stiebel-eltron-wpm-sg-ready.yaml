template: stiebel-wpm
product:
  identifier: stiebel-eltron-wpm-sg-ready
  brand: Stiebel Eltron
  description: WPM (SG Ready)
  group: Heating devices
capabilities: ["meter", "dim"]
render:
  - default: |
      type: template
      template: stiebel-wpm

      # Modbus TCP
      modbus: tcpip
      id: 1
      host:  # Hostname
      port: 502 # Port
      tempsource: # Temperature source, [warmwater, buffer] (optional)
    advanced: |
      type: template
      template: stiebel-wpm

      # Modbus TCP
      modbus: tcpip
      id: 1
      host:  # Hostname
      port: 502 # Port
      tempsource: # Temperature source, [warmwater, buffer] (optional)
      power: # Read power consumption, Inverter power consumption. Only available on WPMsystem (WPM 4), not on WPM 3/3i. (optional)
params:
  - name: modbus
    example:
    default:
    choice: ['tcpip']
    unit:
    description: Modbus Type
    help:
    advanced: false
    optional: false
  - name: tempsource
    example:
    default:
    choice: ['warmwater', 'buffer']
    unit:
    description: Temperature source
    help:
    advanced: false
    optional: true
  - name: power
    example:
    default:
    choice: []
    unit:
    description: Read power consumption
    help: Inverter power consumption. Only available on WPMsystem (WPM 4), not on WPM 3/3i.
    advanced: true
    optional: true
modbus:
  delay:
  host:
  id: 1
  modbus: tcpip
  port: 502
  tcpip: true
  timeout: