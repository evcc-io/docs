template: lg-thinq
product:
  identifier: lg-heat-pump-water-heater-thinq
  brand: LG
  description: Heat pump water heater (ThinQ)
  group: Heating devices
description: |
  Controls LG heat pump water heaters (e.g. WH27S) via the LG ThinQ Connect cloud API.
  A personal access token (PAT) must be created at https://connect-pat.lgthinq.com with the permissions "view devices", "view device status" and "control devices".
  evcc sets the water heater target temperature: the normal temperature outside of boost, the boost temperature during boost.

render:
  - default: |
      type: template
      template: lg-thinq
      token: # Personal access token (PAT)
      country: DE # Country code, Country code of the LG account (ISO 3166-1 alpha-2) (optional)
      device: # Device ID, Required if multiple water heaters are present in the account (optional)
      normal: 50 # Normal temperature (°C), Target temperature outside of boost (optional)
      setpoint: 60 # Boost temperature (°C), Target temperature during boost, must exceed the normal temperature (optional)
    advanced: |
      type: template
      template: lg-thinq
      token: # Personal access token (PAT)
      country: DE # Country code, Country code of the LG account (ISO 3166-1 alpha-2) (optional)
      device: # Device ID, Required if multiple water heaters are present in the account (optional)
      normal: 50 # Normal temperature (°C), Target temperature outside of boost (optional)
      setpoint: 60 # Boost temperature (°C), Target temperature during boost, must exceed the normal temperature (optional)
      cache: 1m # Cache, Time interval for data refresh (optional)
params:
  - name: token
    example:
    default:
    choice: []
    unit:
    description: Personal access token (PAT)
    help:
    advanced: false
    optional: false
  - name: country
    example:
    default: DE
    choice: []
    unit:
    description: Country code
    help: Country code of the LG account (ISO 3166-1 alpha-2)
    advanced: false
    optional: true
  - name: device
    example:
    default:
    choice: []
    unit:
    description: Device ID
    help: Required if multiple water heaters are present in the account
    advanced: false
    optional: true
  - name: normal
    example:
    default: 50
    choice: []
    unit: °C
    description: Normal temperature
    help: Target temperature outside of boost
    advanced: false
    optional: true
  - name: setpoint
    example:
    default: 60
    choice: []
    unit: °C
    description: Boost temperature
    help: Target temperature during boost, must exceed the normal temperature
    advanced: false
    optional: true
  - name: cache
    example: 5m
    default: 1m
    choice: []
    unit:
    description: Cache
    help: Time interval for data refresh
    advanced: true
    optional: true