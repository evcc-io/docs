template: mypv-hea-35
product:
  identifier: my-pv-hea-thor-iot-3-5-kw
  brand: my-PV
  description: HEA•THOR IoT 3.5 kW
  group: Heating devices
capabilities: ["meter"]
requirements: ["sponsorship"]
description: |
  Use Modbus TCP control and configure `phases: 1` in the loadpoint.
  Power is switched in one 3.5 kW stage. Power limits are applied automatically.
  The additional SELV relay is not controlled.

render:
  - default: |
      type: template
      template: mypv-hea-35

      # Modbus TCP
      modbus: tcpip
      id: 1
      host:  # Hostname
      port: 502 # Port
      tempsource: 1 # Temperature source, [1, 2] (optional)
params:
  - name: modbus
    example:
    default:
    choice: ['tcpip']
    unit:
    description: Modbus Type
    help:
    advanced: false
    optional: false
  - name: tempsource
    example:
    default: 1
    choice: ['1', '2']
    unit:
    description: Temperature source
    help:
    advanced: false
    optional: true
modbus:
  delay:
  host:
  id: 1
  modbus: tcpip
  port: 502
  tcpip: true
  timeout: