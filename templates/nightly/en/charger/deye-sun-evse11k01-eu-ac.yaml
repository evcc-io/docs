template: deye-evse
product:
  identifier: deye-sun-evse11k01-eu-ac
  brand: Deye
  description: SUN-EVSE11K01-EU-AC
capabilities: ["mA", "meter"]
requirements: ["sponsorship"]
description: |
  The connection uses the charger's Solarman WiFi logger (port 8899). The registers are not officially documented but reverse engineered.
  The charger's communication mode must be set to "WiFi", in "LoRa" mode the inverter overrides the power setpoint written by evcc.

render:
  - default: |
      type: template
      template: deye-evse
      host: 192.0.2.2 # IP address or hostname
      serial: 1234567890 # Serial, WiFi logger serial number. It is shown under device information on the logger status page.
    advanced: |
      type: template
      template: deye-evse
      host: 192.0.2.2 # IP address or hostname
      serial: 1234567890 # Serial, WiFi logger serial number. It is shown under device information on the logger status page.
      port: 8899 # Port, optional
      id: 162 # ID, optional
params:
  - name: host
    example: 192.0.2.2
    default:
    choice: []
    unit:
    description: IP address or hostname
    help:
    advanced: false
    optional: false
  - name: serial
    example: 1234567890
    default:
    choice: []
    unit:
    description: Serial
    help: WiFi logger serial number. It is shown under device information on the logger status page.
    advanced: false
    optional: false
  - name: port
    example:
    default: 8899
    choice: []
    unit:
    description: Port
    help:
    advanced: true
    optional: true
  - name: id
    example:
    default: 162
    choice: []
    unit:
    description: ID
    help:
    advanced: true
    optional: true