template: kermi
product:
  identifier: kermi-x-center-pro
  brand: Kermi
  description: x-center pro
  group: Heating devices
capabilities: ["meter", "dim"]
render:
  - default: |
      type: template
      template: kermi

      # Modbus TCP
      modbus: tcpip
      id: 1
      host:  # Hostname
      port: 502 # Port
      tempsource: # Temperature source, [warmwater, buffer] (optional)
    advanced: |
      type: template
      template: kermi

      # Modbus TCP
      modbus: tcpip
      id: 1
      host:  # Hostname
      port: 502 # Port
      tempsource: # Temperature source, [warmwater, buffer] (optional)
      watchdog: 60s # Watchdog, optional
params:
  - name: modbus
    example:
    default:
    choice: ['tcpip']
    unit:
    description: Modbus Type
    help:
    advanced: false
    optional: false
  - name: tempsource
    example:
    default:
    choice: ['warmwater', 'buffer']
    unit:
    description: Temperature source
    help:
    advanced: false
    optional: true
  - name: watchdog
    example:
    default: 60s
    choice: []
    unit:
    description: Watchdog
    help:
    advanced: true
    optional: true
modbus:
  delay:
  host:
  id: 1
  modbus: tcpip
  port: 502
  tcpip: true
  timeout: