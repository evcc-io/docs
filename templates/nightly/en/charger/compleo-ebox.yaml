template: innogy-ebox
product:
  identifier: compleo-ebox
  brand: Compleo
  description: eBox
capabilities: ["mA", "dim"]
requirements: ["sponsorship"]
caveats:
  - description: |
      The charger doesn't report charging power. The value is estimated and can be far too high at low load.
    link: https://github.com/evcc-io/evcc/issues/6848
render:
  - default: |
      type: template
      template: innogy-ebox

      # Modbus TCP
      modbus: tcpip
      id: 1
      host:  # Hostname
      port: 502 # Port
params:
  - name: modbus
    example:
    default:
    choice: ['tcpip']
    unit:
    description: Modbus Type
    help:
    advanced: false
    optional: false
modbus:
  delay:
  host:
  id: 1
  modbus: tcpip
  port: 502
  tcpip: true
  timeout: