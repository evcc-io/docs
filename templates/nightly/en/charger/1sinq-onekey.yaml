template: onekey
product:
  identifier: 1sinq-onekey
  brand: 1SINQ
  description: OneKey
  group: Heating devices
capabilities: ["meter", "dim"]
requirements: ["skiptest"]
description: |
  OneKey heating controller with evcc integration enabled. The heat pump
  is controlled via SG Ready states (1=dim, 2=normal, 3=boost). The
  device's energy manager must run in SG Ready mode with evcc selected
  as the SG Ready source. When evcc runs on the OneKey device itself the
  broker is `localhost`.

render:
  - default: |
      type: template
      template: onekey
      host: 192.0.2.2 # IP address or hostname, IP address or hostname of the MQTT broker
      port: 1883 # Port, MQTT broker port (optional)
      topic: onekey # Base topic of the OneKey device, Topic (omit leading /) (optional)
      timeout: 30s # Timeout, Don't accept values older than this value (optional)
    advanced: |
      type: template
      template: onekey
      host: 192.0.2.2 # IP address or hostname, IP address or hostname of the MQTT broker
      port: 1883 # Port, MQTT broker port (optional)
      topic: onekey # Base topic of the OneKey device, Topic (omit leading /) (optional)
      timeout: 30s # Timeout, Don't accept values older than this value (optional)
      user: # Username, e.g. email address, user id, etc. (optional)
      password: # Password, Service account password (optional)
params:
  - name: host
    example: 192.0.2.2
    default:
    choice: []
    unit:
    description: IP address or hostname
    help: IP address or hostname of the MQTT broker
    advanced: false
    optional: false
  - name: port
    example:
    default: 1883
    choice: []
    unit:
    description: Port
    help: MQTT broker port
    advanced: false
    optional: true
  - name: topic
    example:
    default: onekey
    choice: []
    unit:
    description: Base topic of the OneKey device
    help: Topic (omit leading /)
    advanced: false
    optional: true
  - name: timeout
    example: 10s
    default: 30s
    choice: []
    unit:
    description: Timeout
    help: Don't accept values older than this value
    advanced: false
    optional: true
  - name: user
    example:
    default:
    choice: []
    unit:
    description: Username
    help: e.g. email address, user id, etc.
    advanced: true
    optional: true
  - name: password
    example:
    default:
    choice: []
    unit:
    description: Password
    help: Service account password
    advanced: true
    optional: true