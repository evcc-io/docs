template: demo-switch
product:
  identifier: demo-switch
  description: Demo switch
  group: Switchable sockets
description: |
  For demonstration purposes. Switchable device with a fixed set of values.
render:
  - default: |
      type: template
      template: demo-switch
      enabled: false # Switched on, optional
      power: 0 # Power (W), optional
      standbypower: 15 # Standby power (W), Power values above this value will be considered as charging power and hence status "charging". Negative values deactivate status detection. (optional)
    advanced: |
      type: template
      template: demo-switch
      enabled: false # Switched on, optional
      power: 0 # Power (W), optional
      standbypower: 15 # Standby power (W), Power values above this value will be considered as charging power and hence status "charging". Negative values deactivate status detection. (optional)
      integrateddevice: # Integrated device, Integrated device. No charging sessions (optional)
      heating: # Heating device, Shows °C instead of % (optional)
      icon: # Icon, Will be displayed in the user interface [car, bike, bus, moped, motorcycle, rocket, scooter, taxi, tractor, rickshaw, shuttle, van, airpurifier, battery, bulb, climate, coffeemaker, compute, cooking, cooler, desktop, device, dishwasher, dryer, floorlamp, generic, heater, heatexchange, heatpump, kettle, laundry, laundry2, machine, meter, microwave, pump, smartconsumer, tool, waterheater] (optional)
params:
  - name: enabled
    example:
    default: false
    choice: []
    unit:
    description: Switched on
    help:
    advanced: false
    optional: true
  - name: power
    example:
    default: 0
    choice: []
    unit: W
    description: Power
    help:
    advanced: false
    optional: true
  - name: standbypower
    example:
    default: 15
    choice: []
    unit: W
    description: Standby power
    help: Power values above this value will be considered as charging power and hence status "charging". Negative values deactivate status detection.
    advanced: false
    optional: true
  - name: integrateddevice
    example:
    default:
    choice: []
    unit:
    description: Integrated device
    help: Integrated device. No charging sessions
    advanced: true
