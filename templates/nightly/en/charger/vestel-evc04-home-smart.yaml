template: vestel
product:
  identifier: vestel-evc04-home-smart
  brand: Vestel
  description: EVC04 Home Smart
capabilities: ["rfid", "1p3p", "meter", "dim"]
requirements: ["sponsorship"]
description: |
  1P3P requires at least firmware version 3.187.0, RFID at least 3.156.0. Vestel Support provides on request the latest version 3.187.42 (as of Sept. 2026). It resolves the issue with phase switching.
caveats:
  - description: |
      Phase switching occasionally disables itself. (Fixed in v3.187.42, see requirements)
    link: https://github.com/evcc-io/evcc/issues/21708
render:
  - default: |
      type: template
      template: vestel

      # Modbus TCP
      modbus: tcpip
      id: 255
      host:  # Hostname
      port: 502 # Port
params:
  - name: modbus
    example:
    default:
    choice: ['tcpip']
    unit:
    description: Modbus Type
    help:
    advanced: false
    optional: false
modbus:
  delay:
  host:
  id: 255
  modbus: tcpip
  port: 502
  tcpip: true
  timeout: