template: octopus-de
product:
  identifier: octopus-energy-germany
  brand: Octopus Energy
  description: Germany
  group: Dynamic electricity price
countries: ["DE"]
requirements: ["skiptest"]
render:
  - default: |
      type: template
      template: octopus-de
      email: user@example.com # Email Address, The email address of your Octopus Energy account.
      password: secret # Password, The password of your Octopus Energy account.
      accountNumber: A-XX345678 # Account Number, Your Octopus Energy account number (e.g., A-12345678).
    advanced: |
      type: template
      template: octopus-de
      email: user@example.com # Email Address, The email address of your Octopus Energy account.
      password: secret # Password, The password of your Octopus Energy account.
      accountNumber: A-XX345678 # Account Number, Your Octopus Energy account number (e.g., A-12345678).
      charges: # Charge, Additional fixed charge per kWh (optional)
      chargesZones: # Charges zones, Time-based grid fees that override the default charge. (optional)
      tax: # Tax, Additional percentage charge (e.g. 0.2 for 20%) (optional)
      formula: math.Max((price + charges) * (1 + tax), 0.0) # Formula, Individual formula for calculating the price (optional)
params:
  - name: email
    example: user@example.com
    default:
    choice: []
    unit:
    description: Email Address
    help: The email address of your Octopus Energy account.
    advanced: false
    optional: false
  - name: password
    example: secret
    default:
    choice: []
    unit:
    description: Password
    help: The password of your Octopus Energy account.
    advanced: false
    optional: false
  - name: accountNumber
    example: A-XX345678
    default:
    choice: []
    unit:
    description: Account Number
    help: Your Octopus Energy account number (e.g., A-12345678).
    advanced: false
    optional: false
  - name: charges
    example:
    default:
    choice: []
    unit:
    description: Charge
    help: Additional fixed charge per kWh
    advanced: true
    optional: true
  - name: chargesZones
    example:
    default:
    choice: []
    unit:
    description: Charges zones
    help: Time-based grid fees that override the default charge.
    advanced: true
    optional: true
  - name: tax
    example:
    default:
    choice: []
    unit:
    description: Tax
    help: Additional percentage charge (e.g. 0.2 for 20%)
    advanced: true
    optional: true
  - name: formula
    example: math.Max((price + charges) * (1 + tax), 0.0)
    default:
    choice: []
    unit:
    description: Formula
    help: Individual formula for calculating the price
    advanced: true
