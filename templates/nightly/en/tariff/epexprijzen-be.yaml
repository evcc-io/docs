template: epexprijzen-be
product:
  identifier: epexprijzen-be
  brand: epexprijzen.be
  group: Dynamic electricity price
countries: ["BE"]
requirements: ["skiptest"]
description: |
  Current energy prices in Belgium. Prices include energy tax and provider charge by default. When 'tax' or 'charges' are configured, the included amounts are automatically subtracted to avoid double-counting.
render:
  - default: |
      type: template
      template: epexprijzen-be
      provider: # Energy provider, [bolt, dots-energy, ebem, ecofix, ecopower, eneco, energiebe, energy-knights, energyvision, engie, evident-energie, frank-energie, hoa-energy, luminus, mega, octaplus, power2you, servolt-energie, smappee-smiles, totalenergies, trevion, wase-wind]
      region: vlaanderen # Region, [vlaanderen, wallonie, brussel]
      price-interval: quarterly # Price interval, [hourly, quarterly]
    advanced: |
      type: template
      template: epexprijzen-be
      provider: # Energy provider, [bolt, dots-energy, ebem, ecofix, ecopower, eneco, energiebe, energy-knights, energyvision, engie, evident-energie, frank-energie, hoa-energy, luminus, mega, octaplus, power2you, servolt-energie, smappee-smiles, totalenergies, trevion, wase-wind]
      region: vlaanderen # Region, [vlaanderen, wallonie, brussel]
      price-interval: quarterly # Price interval, [hourly, quarterly]
      charges: # Charge, Additional fixed charge per kWh (optional)
      chargesZones: # Charges zones, Time-based grid fees that override the default charge. (optional)
      tax: # Tax, Additional percentage charge (e.g. 0.2 for 20%) (optional)
      formula: math.Max((price + charges) * (1 + tax), 0.0) # Formula, Individual formula for calculating the price (optional)
      interval: 1h # Interval, optional
params:
  - name: provider
    example:
    default:
    choice: ['bolt', 'dots-energy', 'ebem', 'ecofix', 'ecopower', 'eneco', 'energiebe', 'energy-knights', 'energyvision', 'engie', 'evident-energie', 'frank-energie', 'hoa-energy', 'luminus', 'mega', 'octaplus', 'power2you', 'servolt-energie', 'smappee-smiles', 'totalenergies', 'trevion', 'wase-wind']
    unit:
    description: Energy provider
    help:
    advanced: false
    optional: false
  - name: region
    example: vlaanderen
    default:
    choice: ['vlaanderen', 'wallonie', 'brussel']
    unit:
    description: Region
    help:
    advanced: false
    optional: false
  - name: price-interval
    example:
    default: quarterly
    choice: ['hourly', 'quarterly']
    unit:
    description: Price interval
    help:
    advanced: false
    optional: false
  - name: charges
    example:
    default:
    choice: []
    unit:
    description: Charge
    help: Additional fixed charge per kWh
    advanced: true
    optional: true
  - name: chargesZones
    example:
    default:
    choice: []
    unit:
    description: Charges zones
    help: Time-based grid fees that override the default charge.
    advanced: true
    optional: true
  - name: tax
    example:
    default:
    choice: []
    unit:
    description: Tax
    help: Additional percentage charge (e.g. 0.2 for 20%)
    advanced: true
    optional: true
  - name: formula
    example: math.Max((price + charges) * (1 + tax), 0.0)
    default:
    choice: []
    unit:
