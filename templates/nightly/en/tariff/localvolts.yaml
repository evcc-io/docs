template: localvolts
product:
  identifier: localvolts
  brand: Localvolts
  group: Dynamic electricity price
countries: ["AU"]
description: |
  Requires the API key and partner ID from the Localvolts web app (My Profile, General, API Key). Prices are the site-specific flex prices for the current and the next 24 hours.
render:
  - default: |
      type: template
      template: localvolts
      apikey: # API Key
      partner: # Partner ID
      nmi: # NMI, National Meter Identifier (10 characters, without checksum)
      channel: # Channel, Import for the grid tariff, Export for the feed-in tariff [Import, Export]
    advanced: |
      type: template
      template: localvolts
      apikey: # API Key
      partner: # Partner ID
      nmi: # NMI, National Meter Identifier (10 characters, without checksum)
      channel: # Channel, Import for the grid tariff, Export for the feed-in tariff [Import, Export]
      charges: # Charge, Additional fixed charge per kWh (optional)
      chargesZones: # Charges zones, Time-based grid fees that override the default charge. (optional)
      tax: # Tax, Additional percentage charge (e.g. 0.2 for 20%) (optional)
      formula: math.Max((price + charges) * (1 + tax), 0.0) # Formula, Individual formula for calculating the price (optional)
params:
  - name: apikey
    example:
    default:
    choice: []
    unit:
    description: API Key
    help:
    advanced: false
    optional: false
  - name: partner
    example:
    default:
    choice: []
    unit:
    description: Partner ID
    help:
    advanced: false
    optional: false
  - name: nmi
    example:
    default:
    choice: []
    unit:
    description: NMI
    help: National Meter Identifier (10 characters, without checksum)
    advanced: false
    optional: false
  - name: channel
    example:
    default:
    choice: ['Import', 'Export']
    unit:
    description: Channel
    help: Import for the grid tariff, Export for the feed-in tariff
    advanced: false
    optional: false
  - name: charges
    example:
    default:
    choice: []
    unit:
    description: Charge
    help: Additional fixed charge per kWh
    advanced: true
    optional: true
  - name: chargesZones
    example:
    default:
    choice: []
    unit:
    description: Charges zones
    help: Time-based grid fees that override the default charge.
    advanced: true
    optional: true
  - name: tax
    example:
    default:
    choice: []
    unit:
    description: Tax
    help: Additional percentage charge (e.g. 0.2 for 20%)
    advanced: true
    optional: true
  - name: formula
    example: math.Max((price + charges) * (1 + tax), 0.0)
    default:
    choice: []
    unit:
    description: Formula
    help: Individual formula for calculating the price
    advanced: true
    optional: true