template: pvnode-v2-temperature
product:
  identifier: pvnode-v2-api-temperature
  brand: pvnode V2 API Temperature
  group: Temperature forecast
requirements: ["skiptest"]
description: |
  [pvnode V2 API](https://pvnode.com) provides outdoor temperature forecasts in 15-minute intervals via REST API Version 2 with site ID and easy configuration via web app.
  An API key is required (free plan available).
  **Attention**: The free plan only allows one fixed site with forecasts for today & tomorrow and only one update per day and 250 cached queries.

render:
  - default: |
      type: template
      template: pvnode-v2-temperature
      apikey: # API Key
      siteid: # Site ID
    advanced: |
      type: template
      template: pvnode-v2-temperature
      apikey: # API Key
      siteid: # Site ID
      forecast_days: 1 # Forecast days, The free plan of pvnode only allows 1 forecast day (1 = today + tomorrow). (optional)
      interval: 24h # Interval, optional
params:
  - name: apikey
    example:
    default:
    choice: []
    unit:
    description: API Key
    help:
    advanced: false
    optional: false
  - name: siteid
    example:
    default:
    choice: []
    unit:
    description: Site ID
    help:
    advanced: false
    optional: false
  - name: forecast_days
    example:
    default: 1
    choice: []
    unit:
    description: Forecast days
    help: The free plan of pvnode only allows 1 forecast day (1 = today + tomorrow).
    advanced: true
    optional: true
  - name: interval
    example:
    default: 24h
    choice: []
    unit:
    description: Interval
    help:
    advanced: true
    optional: true