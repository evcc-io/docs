template: lekker
product:
  identifier: lekker-energie
  brand: lekker Energie
  group: Dynamic electricity price
countries: ["DE"]
requirements: ["skiptest"]
description: |
  Get your API token from the [lekker Service Portal](https://www.lekker.de/service/api-key).
render:
  - default: |
      type: template
      template: lekker
      token: # API token (e.g. lek_prod_...).
    advanced: |
      type: template
      template: lekker
      token: # API token (e.g. lek_prod_...).
      interval: 1h # Interval, optional
      charges: # Charge, Additional fixed charge per kWh (optional)
      chargesZones: # Charges zones, Time-based grid fees that override the default charge. (optional)
      tax: # Tax, Additional percentage charge (e.g. 0.2 for 20%) (optional)
      formula: math.Max((price + charges) * (1 + tax), 0.0) # Formula, Individual formula for calculating the price (optional)
params:
  - name: token
    example:
    default:
    choice: []
    unit:
    description: API token (e.g. lek_prod_...).
    help:
    advanced: false
    optional: false
  - name: interval
    example:
    default: 1h
    choice: []
    unit:
    description: Interval
    help:
    advanced: true
    optional: true
  - name: charges
    example:
    default:
    choice: []
    unit:
    description: Charge
    help: Additional fixed charge per kWh
    advanced: true
    optional: true
  - name: chargesZones
    example:
    default:
    choice: []
    unit:
    description: Charges zones
    help: Time-based grid fees that override the default charge.
    advanced: true
    optional: true
  - name: tax
    example:
    default:
    choice: []
    unit:
    description: Tax
    help: Additional percentage charge (e.g. 0.2 for 20%)
    advanced: true
    optional: true
  - name: formula
    example: math.Max((price + charges) * (1 + tax), 0.0)
    default:
    choice: []
    unit:
    description: Formula
    help: Individual formula for calculating the price
    advanced: true
    optional: true