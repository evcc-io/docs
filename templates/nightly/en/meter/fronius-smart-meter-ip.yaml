template: fronius-smart-meter-ip
product:
  identifier: fronius-smart-meter-ip
  brand: Fronius
  description: Smart Meter IP
description: |
  Modbus TCP must be enabled in the meter's web interface (Settings → Data interfaces → Modbus (TCP and RTU)). The meter is read directly via its own IP address, not through the inverter.

render:
  - usage: grid
    default: |
      type: template
      template: fronius-smart-meter-ip
      usage: grid
      host: 192.0.2.2 # IP address or hostname
      port: 502 # Port, optional
    advanced: |
      type: template
      template: fronius-smart-meter-ip
      usage: grid
      host: 192.0.2.2 # IP address or hostname
      port: 502 # Port, optional
      id: 1 # ID, optional
params:
  - name: host
    example: 192.0.2.2
    default:
    choice: []
    unit:
    description: IP address or hostname
    help:
    advanced: false
    optional: false
  - name: port
    example:
    default: 502
    choice: []
    unit:
    description: Port
    help:
    advanced: false
    optional: true
  - name: id
    example:
    default: 1
    choice: []
    unit:
    description: ID
    help:
    advanced: true
    optional: true