template: zendure-solarflow-battery
product:
  identifier: zendure-solarflow-ac-pro
  brand: Zendure
  description: Solarflow AC / Pro
capabilities: ["battery-control"]
description: |
  For active battery control, the local API must be enabled via the Zendure App (add HEMS and then exit to apply).
  The device serial number can be found in the Zendure App in the device settings.

render:
  - usage: battery
    default: |
      type: template
      template: zendure-solarflow-battery
      usage: battery
      host: 192.0.2.2 # IP address or hostname
      serial: WOB1NHMAMXXXXX3 # Serial, Required only for active battery control. Device serial number (can be found in the Zendure App) (optional)
      capacity: 50 # Battery capacity (kWh), optional
    advanced: |
      type: template
      template: zendure-solarflow-battery
      usage: battery
      host: 192.0.2.2 # IP address or hostname
      serial: WOB1NHMAMXXXXX3 # Serial, Required only for active battery control. Device serial number (can be found in the Zendure App) (optional)
      capacity: 50 # Battery capacity (kWh), optional
      cache: 1s # Cache, Time interval for data refresh (optional)
params:
  - name: host
    example: 192.0.2.2
    default:
    choice: []
    unit:
    description: IP address or hostname
    help:
    advanced: false
    optional: false
  - name: serial
    example: WOB1NHMAMXXXXX3
    default:
    choice: []
    unit:
    description: Serial
    help: Required only for active battery control. Device serial number (can be found in the Zendure App)
    advanced: false
    optional: true
  - name: capacity
    example: 50
    default:
    choice: []
    unit: kWh
    description: Battery capacity
    help:
    advanced: false
    optional: true
  - name: cache
    example: 5m
    default: 1s
    choice: []
    unit:
    description: Cache
    help: Time interval for data refresh
    advanced: true
    optional: true