template: qcells-hybrid-cloud
product:
  identifier: qcells-hybrid-inverter-cloud
  brand: Qcells
  description: Hybrid-Inverter (Cloud)
description: |
  The Qcells hybrid inverter has to be registered in the QcellsCloud.

  **Attention**: Values can only be fetched every 150s and then also can be 5 minutes old. Charging by PV will not be optimal because of this! Only use as fallback if no local access is available.

render:
  - usage: grid
    default: |
      type: template
      template: qcells-hybrid-cloud
      usage: grid
      tokenid: # QcellsCloud TokenID, Go to [qhome-ess-g3.q-cells.eu](https://qhome-ess-g3.q-cells.eu/#/api/) or [qhome-ess-g3.q-cells.us](https://qhome-ess-g3.q-cells.us/#/api/) and take the value of "ObtaintokenID".
      serial: # Serial number, Go to [qhome-ess-g3.q-cells.eu](https://qhome-ess-g3.q-cells.eu/blue/#/inverter) or [qhome-ess-g3.q-cells.us](https://qhome-ess-g3.q-cells.us/blue/#/inverter) and take the value of registration number.
      region: EU # Region, [EU, US] (optional)
    advanced: |
      type: template
      template: qcells-hybrid-cloud
      usage: grid
      tokenid: # QcellsCloud TokenID, Go to [qhome-ess-g3.q-cells.eu](https://qhome-ess-g3.q-cells.eu/#/api/) or [qhome-ess-g3.q-cells.us](https://qhome-ess-g3.q-cells.us/#/api/) and take the value of "ObtaintokenID".
      serial: # Serial number, Go to [qhome-ess-g3.q-cells.eu](https://qhome-ess-g3.q-cells.eu/blue/#/inverter) or [qhome-ess-g3.q-cells.us](https://qhome-ess-g3.q-cells.us/blue/#/inverter) and take the value of registration number.
      region: EU # Region, [EU, US] (optional)
  - usage: pv
    default: |
      type: template
      template: qcells-hybrid-cloud
      usage: pv
      tokenid: # QcellsCloud TokenID, Go to [qhome-ess-g3.q-cells.eu](https://qhome-ess-g3.q-cells.eu/#/api/) or [qhome-ess-g3.q-cells.us](https://qhome-ess-g3.q-cells.us/#/api/) and take the value of "ObtaintokenID".
      serial: # Serial number, Go to [qhome-ess-g3.q-cells.eu](https://qhome-ess-g3.q-cells.eu/blue/#/inverter) or [qhome-ess-g3.q-cells.us](https://qhome-ess-g3.q-cells.us/blue/#/inverter) and take the value of registration number.
      region: EU # Region, [EU, US] (optional)
    advanced: |
      type: template
      template: qcells-hybrid-cloud
      usage: pv
      tokenid: # QcellsCloud TokenID, Go to [qhome-ess-g3.q-cells.eu](https://qhome-ess-g3.q-cells.eu/#/api/) or [qhome-ess-g3.q-cells.us](https://qhome-ess-g3.q-cells.us/#/api/) and take the value of "ObtaintokenID".
      serial: # Serial number, Go to [qhome-ess-g3.q-cells.eu](https://qhome-ess-g3.q-cells.eu/blue/#/inverter) or [qhome-ess-g3.q-cells.us](https://qhome-ess-g3.q-cells.us/blue/#/inverter) and take the value of registration number.
      region: EU # Region, [EU, US] (optional)
  - usage: battery
    default: |
      type: template
      template: qcells-hybrid-cloud
      usage: battery
      tokenid: # QcellsCloud TokenID, Go to [qhome-ess-g3.q-cells.eu](https://qhome-ess-g3.q-cells.eu/#/api/) or [qhome-ess-g3.q-cells.us](https://qhome-ess-g3.q-cells.us/#/api/) and take the value of "ObtaintokenID".
      serial: # Serial number, Go to [qhome-ess-g3.q-cells.eu](https://qhome-ess-g3.q-cells.eu/blue/#/inverter) or [qhome-ess-g3.q-cells.us](https://qhome-ess-g3.q-cells.us/blue/#/inverter) and take the value of registration number.
      region: EU # Region, [EU, US] (optional)
      capacity: 50 # Battery capacity (kWh), optional
      minsoc: 0 # Minimum charge (%), Lower limit as configured on the battery system. Used by optimizer. (optional)
      maxsoc: 100 # Maximum charge (%), Upper limit as configured on the battery system. Used by optimizer and, on some devices, for grid charging. (optional)
    advanced: |
      type: template
      template: qcells-hybrid-cloud
      usage: battery
      tokenid: # QcellsCloud TokenID, Go to [qhome-ess-g3.q-cells.eu](https://qhome-ess-g3.q-cells.eu/#/api/) or [qhome-ess-g3.q-cells.us](https://qhome-ess-g3.q-cells.us/#/api/) and take the value of "ObtaintokenID".
      serial: # Serial number, Go to [qhome-ess-g3.q-cells.eu](https://qhome-ess-g3.q-cells.eu/blue/#/inverter) or [qhome-ess-g3.q-cells.us](https://qhome-ess-g3.q-cells.us/blue/#/inverter) and take the value of registration number.
      region: EU # Region, [EU, US] (optional)
      capacity: 50 # Battery capacity (kWh), optional
      minsoc: 0 # Minimum charge (%), Lower limit as configured on the battery system. Used by optimizer. (optional)
      maxsoc: 100 # Maximum charge (%), Upper limit as configured on the battery system. Used by optimizer and, on some devices, for grid charging. (optional)
      maxchargepower: # Maximum charge power (W), Highest power the battery system can charge with. The optimizer plans with charging up to this power. Some devices also use it as grid charging power. (optional)
      maxdischargepower: # Maximum discharge power (W), Highest power the battery system can discharge with. The optimizer plans with discharging up to this power. Smart mode assumes the battery supplies at most this power to vehicle charging. (optional)
