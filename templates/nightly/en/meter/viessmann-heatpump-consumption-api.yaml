template: viessmann
product:
  identifier: viessmann-heatpump-consumption-api
  brand: Viessmann
  description: Heatpump consumption (API)
requirements: ["skiptest"]
description: |
  Reads the heat pump's current electrical power consumption (heating.power.consumption.current) as an
  additional consumer (aux). The heat pump then appears under "Consumption" in the energy flow and its
  usage feeds the evcc statistics - independent of whether evcc controls the heat pump.

render:
  - usage: aux
    default: |
      type: template
      template: viessmann
      usage: aux
      clientid: # Client ID, Configure at [app.developer.viessmann-climatesolutions.com](https://app.developer.viessmann-climatesolutions.com)
      redirecturi: # Redirect URI, Redirect URI of the evcc instance. Must match the redirect URI set in the Viessmann developer portal.
      gateway_serial: # Gateway Serial, Determined automatically after login. Alternatively enter manually (ViCare app -> Settings -> Communication module -> Serial number)
      installation_id: # Installation ID, Determined automatically after login.
      device_id: 0 # Device ID, typically `0`
params:
  - name: clientid
    example:
    default:
    choice: []
    unit:
    description: Client ID
    help: Configure at [app.developer.viessmann-climatesolutions.com](https://app.developer.viessmann-climatesolutions.com)
    advanced: false
    optional: false
  - name: redirecturi
    example:
    default:
    choice: []
    unit:
    description: Redirect URI
    help: Redirect URI of the evcc instance. Must match the redirect URI set in the Viessmann developer portal.
    advanced: false
    optional: false
  - name: gateway_serial
    example:
    default:
    choice: []
    unit:
    description: Gateway Serial
    help: Determined automatically after login. Alternatively enter manually (ViCare app -> Settings -> Communication module -> Serial number)
    advanced: false
    optional: false
  - name: installation_id
    example:
    default:
    choice: []
    unit:
    description: Installation ID
    help: Determined automatically after login.
    advanced: false
    optional: false
  - name: device_id
    example:
    default: 0
    choice: []
    unit:
    description: Device ID
    help: typically `0`
    advanced: false
    optional: false