template: solarlog
product:
  identifier: solarlog
  description: Solarlog
description: |
  We recommend to use this device for grid power values only, if no other device is available providing this data.
  If you have a home battery installed, please do not use this device at all for grid power values.

render:
  - usage: grid
    default: |
      type: template
      template: solarlog
      usage: grid

      # Modbus TCP
      modbus: tcpip
      id: 1
      host:  # Hostname
      port: 502 # Port
  - usage: pv
    default: |
      type: template
      template: solarlog
      usage: pv

      # Modbus TCP
      modbus: tcpip
      id: 1
      host:  # Hostname
      port: 502 # Port
params:
  - name: modbus
    example:
    default:
    choice: ['tcpip']
    unit:
    description: Modbus Type
    help:
    advanced: false
    optional: false
modbus:
  delay:
  host:
  id: 1
  modbus: tcpip
  port: 502
  tcpip: true
  timeout: