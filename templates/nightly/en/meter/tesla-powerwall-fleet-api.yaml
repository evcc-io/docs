    example: 192.0.2.2
    default:
    choice: []
    unit:
    description: IP address or hostname
    help:
    advanced: false
    optional: false
  - name: password
    example:
    default:
    choice: []
    unit:
    description: Password
    help: Password of the user "customer". By default this is the last 5 characters of password stated on the Tesla Gateway.
    advanced: false
    optional: false
  - name: clientId
    example:
    default:
    choice: []
    unit:
    description: Client ID
    help: from [developer.tesla.com](https://developer.tesla.com/dashboard).
    advanced: false
