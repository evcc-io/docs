template: tesla-powerwall-fleet
product:
  identifier: tesla-powerwall-fleet-api
  brand: Tesla
  description: Powerwall (Fleet API)
capabilities: ["battery-control"]
description: |
  Tesla offers an official, but paid Fleet API.
  For private use, you can create a Tesla Developer Account at [developer.tesla.com](https://developer.tesla.com/) and receive a monthly API credit of $10.

  The [myteslamate.com](https://www.myteslamate.com/tesla-api-application-registration/) guide explains the process and generates a free Access and Refresh Token.
  With this token pair and your Client ID created in the Tesla Developer Account, evcc can directly communicate with the Tesla Fleet API.

render:
  - usage: battery
    default: |
      type: template
      template: tesla-powerwall-fleet
      usage: battery
      host: 192.0.2.2 # IP address or hostname
      password: # Password, Password of the user "customer". By default this is the last 5 characters of password stated on the Tesla Gateway.
      clientId: # Client ID, from [developer.tesla.com](https://developer.tesla.com/dashboard).
      accessToken: # Access token, from [myteslamate.com](https://app.myteslamate.com/).
      refreshToken: # Refresh token, from [myteslamate.com](https://app.myteslamate.com/).
      siteId: # Site ID, optional product identifier of the energy site, use to override autodetection (optional)
    advanced: |
      type: template
      template: tesla-powerwall-fleet
      usage: battery
      host: 192.0.2.2 # IP address or hostname
      password: # Password, Password of the user "customer". By default this is the last 5 characters of password stated on the Tesla Gateway.
      clientId: # Client ID, from [developer.tesla.com](https://developer.tesla.com/dashboard).
      accessToken: # Access token, from [myteslamate.com](https://app.myteslamate.com/).
      refreshToken: # Refresh token, from [myteslamate.com](https://app.myteslamate.com/).
      siteId: # Site ID, optional product identifier of the energy site, use to override autodetection (optional)
      minsoc: 20 # Minimum charge (%), Backup reserve evcc restores in normal operation (optional)
params:
  - name: host
    example: 192.0.2.2
    default:
    choice: []
    unit:
    description: IP address or hostname
    help:
    advanced: false
    optional: false
  - name: password
    example:
    default:
    choice: []
    unit:
    description: Password
    help: Password of the user "customer". By default this is the last 5 characters of password stated on the Tesla Gateway.
    advanced: false
    optional: false
  - name: clientId
    example:
    default:
    choice: []
    unit:
    description: Client ID
    help: from [developer.tesla.com](https://developer.tesla.com/dashboard).
    advanced: false
    optional: false
  - name: accessToken
    example:
    default:
    choice: []
    unit:
    description: Access token
    help: from [myteslamate.com](https://app.myteslamate.com/).
    advanced: false
    optional: false
  - name: refreshToken
    example:
    default:
    choice: []
    unit:
    description: Refresh token
    help: from [myteslamate.com](https://app.myteslamate.com/).
    advanced: false
    optional: false
  - name: siteId
    example:
    default:
    choice: []
    unit:
    description: Site ID
    help: optional product identifier of the energy site, use to override autodetection
    advanced: false
    optional: true
  - name: minsoc
    example: 25
    default: 20
    choice: []
    unit: '%'
    description: Minimum charge
    help: Backup reserve evcc restores in normal operation
    advanced: true
    optional: true