template: youliq-one
product:
  identifier: youliq-one
  brand: Youliq
  description: One
capabilities: ["battery-control"]
description: |
  Local access to the Youliq One battery storage via HTTPS API. The device uses a self-signed certificate.

render:
  - usage: battery
    default: |
      type: template
      template: youliq-one
      usage: battery
      host: 192.0.2.2 # IP address or hostname
      capacity: 10.24 # Battery capacity (kWh), optional
      minsoc: 25 # Minimum charge (%), Lower limit as configured on the battery system. Used by optimizer. (optional)
      maxsoc: 95 # Maximum charge (%), Upper limit as configured on the battery system. Used by optimizer and for grid charging. (optional)
    advanced: |
      type: template
      template: youliq-one
      usage: battery
      host: 192.0.2.2 # IP address or hostname
      capacity: 10.24 # Battery capacity (kWh), optional
      minsoc: 25 # Minimum charge (%), Lower limit as configured on the battery system. Used by optimizer. (optional)
      maxsoc: 95 # Maximum charge (%), Upper limit as configured on the battery system. Used by optimizer and for grid charging. (optional)
      cache: 5s # Cache, Time interval for data refresh (optional)
      maxchargepower: 2000 # Maximum charge power (W), For forced charging of the battery. (optional)
      maxdischargepower: # Maximum discharge power (W), Maximum discharge power of the storage. (optional)
params:
  - name: host
    example: 192.0.2.2
    default:
    choice: []
    unit:
    description: IP address or hostname
    help:
    advanced: false
    optional: false
  - name: capacity
    example: 50
    default: 10.24
    choice: []
    unit: kWh
    description: Battery capacity
    help:
    advanced: false
    optional: true
  - name: minsoc
    example: 25
    default:
    choice: []
    unit: '%'
    description: Minimum charge
    help: Lower limit as configured on the battery system. Used by optimizer.
    advanced: false
    optional: true
  - name: maxsoc
    example: 95
    default:
    choice: []
    unit: '%'
    description: Maximum charge
    help: Upper limit as configured on the battery system. Used by optimizer and for grid charging.
    advanced: false
    optional: true
  - name: cache
    example: 5m
    default: 5s
    choice: []
    unit:
    description: Cache
    help: Time interval for data refresh
    advanced: true
    optional: true
  - name: maxchargepower
    example:
    default: 2000
    choice: []
    unit: W
    description: Maximum charge power
    help: For forced charging of the battery.
    advanced: true
    optional: true
  - name: maxdischargepower
    example:
    default:
    choice: []
    unit: W
    description: Maximum discharge power
    help: Maximum discharge power of the storage.
    advanced: true
    optional: true