template: sungrow-meter
product:
  identifier: sungrow-dtsu666-80-a
  brand: Sungrow
  description: DTSU666 (80 A)
description: |
  The meter must not be connected to the meter port of a Sungrow inverter at the same time. In that case, read the grid values via the inverter template.
render:
  - usage: grid
    default: |
      type: template
      template: sungrow-meter
      usage: grid

      # RS485 via adapter (Modbus RTU)
      modbus: rs485serial
      id: 254
      device: /dev/ttyUSB0 # USB-RS485 Adapter Adresse
      baudrate: 9600 # Prüfe die Geräteeinstellungen, typische Werte sind 9600, 19200, 38400, 57600, 115200
      comset: "8N1" # Kommunikationsparameter für den Adapter

      # RS485 via TCP/IP (Modbus RTU)
      modbus: rs485tcpip
      id: 254
      host:  # Hostname
      port: 502 # Port
  - usage: pv
    default: |
      type: template
      template: sungrow-meter
      usage: pv

      # RS485 via adapter (Modbus RTU)
      modbus: rs485serial
      id: 254
      device: /dev/ttyUSB0 # USB-RS485 Adapter Adresse
      baudrate: 9600 # Prüfe die Geräteeinstellungen, typische Werte sind 9600, 19200, 38400, 57600, 115200
      comset: "8N1" # Kommunikationsparameter für den Adapter

      # RS485 via TCP/IP (Modbus RTU)
      modbus: rs485tcpip
      id: 254
      host:  # Hostname
      port: 502 # Port
  - usage: charge
    default: |
      type: template
      template: sungrow-meter
      usage: charge

      # RS485 via adapter (Modbus RTU)
      modbus: rs485serial
      id: 254
      device: /dev/ttyUSB0 # USB-RS485 Adapter Adresse
      baudrate: 9600 # Prüfe die Geräteeinstellungen, typische Werte sind 9600, 19200, 38400, 57600, 115200
      comset: "8N1" # Kommunikationsparameter für den Adapter

      # RS485 via TCP/IP (Modbus RTU)
      modbus: rs485tcpip
      id: 254
      host:  # Hostname
      port: 502 # Port
params:
  - name: modbus
    example:
    default:
    choice: ['rs485']
    unit:
    description: Modbus Type
    help:
    advanced: false
    optional: false
modbus:
  baudrate: 9600
  comset: 8N1
  delay:
  device: /dev/ttyUSB0
  host:
  id: 254
  port: 502
  rs485serial: true
  rs485tcpip: true
  timeout: