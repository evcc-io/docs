template: iobroker
product:
  identifier: iobroker
  brand: ioBroker
  group: Generic support
requirements: ["skiptest"]
description: |
  The `rest-api` adapter (not `simple-api`) must be installed on the ioBroker instance being used.
  It can be configured stand-alone or as an extension of a web adapter.  The parameter `webextension` determines whether the
  adapter is configured as a web extension. Default is true, which means that the adapter is configured as a web extension.
  Authentication can only be performed using `basic` authentication. If no password is provided, no authentication will be performed.
  When specifying the entities for the individual measured values, ensure that they are correctly URL-encoded.
  For example, `shelly.0.SHEM-3#8CAAB561991E#1.Total.ConsumedPower` becomes `shelly.0.SHEM-3%238CAAB561991E%231.Total.ConsumedPower`

render:
  - usage: grid
    default: |
      type: template
      template: iobroker
      usage: grid
      uri: https://iobroker.homelab.lan:8082 # The full uri of the host to query, HTTP(S) address
      webextension: true # Rest as web extension, Determines whether the REST adapter is installed  stand alone or as a web extension. Should 404 errors occur, try changing the value. (optional)
      user: # Username, e.g. email address, user id, etc. (optional)
      password: # Password, Service account password (optional)
      power: # Power (W), optional
      soc: # State of Charge (%), optional
    advanced: |
      type: template
      template: iobroker
      usage: grid
      uri: https://iobroker.homelab.lan:8082 # The full uri of the host to query, HTTP(S) address
      webextension: true # Rest as web extension, Determines whether the REST adapter is installed  stand alone or as a web extension. Should 404 errors occur, try changing the value. (optional)
      user: # Username, e.g. email address, user id, etc. (optional)
      password: # Password, Service account password (optional)
      power: # Power (W), optional
      soc: # State of Charge (%), optional
      cache: 5m # Cache, Time interval for data refresh (optional)
      energy: # Meter reading (kWh), optional
      currentL1: # L1 current (A), optional
      currentL2: # L2 current (A), optional
      currentL3: # L3 current (A), optional
  - usage: pv
    default: |
      type: template
      template: iobroker
      usage: pv
      uri: https://iobroker.homelab.lan:8082 # The full uri of the host to query, HTTP(S) address
      webextension: true # Rest as web extension, Determines whether the REST adapter is installed  stand alone or as a web extension. Should 404 errors occur, try changing the value. (optional)
      user: # Username, e.g. email address, user id, etc. (optional)
      password: # Password, Service account password (optional)
      power: # Power (W), optional
      soc: # State of Charge (%), optional
    advanced: |
      type: template
      template: iobroker
      usage: pv
      uri: https://iobroker.homelab.lan:8082 # The full uri of the host to query, HTTP(S) address
      webextension: true # Rest as web extension, Determines whether the REST adapter is installed  stand alone or as a web extension. Should 404 errors occur, try changing the value. (optional)
      user: # Username, e.g. email address, user id, etc. (optional)
      password: # Password, Service account password (optional)
      power: # Power (W), optional
      soc: # State of Charge (%), optional
      cache: 5m # Cache, Time interval for data refresh (optional)
      energy: # Meter reading (kWh), optional
      currentL1: # L1 current (A), optional
      currentL2: # L2 current (A), optional
      currentL3: # L3 current (A), optional
      maxacpower: 0 # Maximum AC power of the hybrid inverter (W), optional
  - usage: battery
    default: |
      type: template
      template: iobroker
      usage: battery
      uri: https://iobroker.homelab.lan:8082 # The full uri of the host to query, HTTP(S) address
      webextension: true # Rest as web extension, Determines whether the REST adapter is installed  stand alone or as a web extension. Should 404 errors occur, try changing the value. (optional)
      user: # Username, e.g. email address, user id, etc. (optional)
      password: # Password, Service account password (optional)
      power: # Power (W), optional
      soc: # State of Charge (%), optional
      capacity: 50 # Battery capacity (kWh), optional
      minsoc: 0 # Minimum charge (%), Lower limit as configured on the battery system. Used by optimizer. (optional)
      maxsoc: 100 # Maximum charge (%), Upper limit as configured on the battery system. Used by optimizer and, on some devices, for grid charging. (optional)
    advanced: |
      type: template
      template: iobroker
      usage: battery
      uri: https://iobroker.homelab.lan:8082 # The full uri of the host to query, HTTP(S) address
      webextension: true # Rest as web extension, Determines whether the REST adapter is installed  stand alone or as a web extension. Should 404 errors occur, try changing the value. (optional)
      user: # Username, e.g. email address, user id, etc. (optional)
