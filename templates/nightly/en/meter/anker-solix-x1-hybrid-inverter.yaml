template: anker-solix-x1
product:
  identifier: anker-solix-x1-hybrid-inverter
  brand: Anker
  description: SOLIX X1 Hybrid Inverter
capabilities: ["battery-control"]
description: |
  The Modbus TCP interface must be enabled in the Anker app.
  This configuration was tested with the Firmware Version 1.0.16.1.
  Older or newer Firmware Versions may use different register addresses and therefore deliver incorrect data.
  evcc can charge the battery from the grid (work mode third-party control with the maximum charge power `maxchargepower`) and return it to self-consumption. A work mode set in the Anker app is overwritten.
  evcc only writes to the X1 when a battery function is enabled (grid charging, discharge lock, automatic optimizer control or an external battery mode). Otherwise the X1 keeps the mode set in the Anker app.
  The X1 does not return to self-consumption on its own: if evcc stops unexpectedly while grid charging, the X1 keeps charging until evcc sets a mode again.
  Holding is not supported and falls back to normal operation: the X1 offers no way to block discharging while still storing PV surplus.

render:
  - usage: grid
    default: |
      type: template
      template: anker-solix-x1
      usage: grid

      # Modbus TCP
      modbus: tcpip
      id: 1
      host:  # Hostname
      port: 502 # Port
    advanced: |
      type: template
      template: anker-solix-x1
      usage: grid

      # Modbus TCP
      modbus: tcpip
      id: 1
      host:  # Hostname
      port: 502 # Port
      watchdog: 60s # Watchdog, optional
  - usage: pv
    default: |
      type: template
      template: anker-solix-x1
      usage: pv

      # Modbus TCP
      modbus: tcpip
      id: 1
      host:  # Hostname
      port: 502 # Port
    advanced: |
      type: template
      template: anker-solix-x1
      usage: pv

      # Modbus TCP
      modbus: tcpip
      id: 1
      host:  # Hostname
      port: 502 # Port
      maxacpower: 0 # Maximum AC power of the hybrid inverter (W), optional
      watchdog: 60s # Watchdog, optional
  - usage: battery
    default: |
      type: template
      template: anker-solix-x1
      usage: battery

      # Modbus TCP
      modbus: tcpip
      id: 1
      host:  # Hostname
      port: 502 # Port
      maxchargepower: # Maximum charge power (W), Highest power the battery system can charge with. The optimizer plans with charging up to this power. Some devices also use it as grid charging power.
      capacity: 50 # Battery capacity (kWh), optional
      minsoc: 0 # Minimum charge (%), Lower limit as configured on the battery system. Used by optimizer. (optional)
      maxsoc: 100 # Maximum charge (%), Upper limit as configured on the battery system. Used by optimizer and, on some devices, for grid charging. (optional)
    advanced: |
      type: template
      template: anker-solix-x1
      usage: battery

      # Modbus TCP
      modbus: tcpip
      id: 1
      host:  # Hostname
      port: 502 # Port
      maxchargepower: # Maximum charge power (W), Highest power the battery system can charge with. The optimizer plans with charging up to this power. Some devices also use it as grid charging power.
      capacity: 50 # Battery capacity (kWh), optional
      minsoc: 0 # Minimum charge (%), Lower limit as configured on the battery system. Used by optimizer. (optional)
      maxsoc: 100 # Maximum charge (%), Upper limit as configured on the battery system. Used by optimizer and, on some devices, for grid charging. (optional)
      maxdischargepower: # Maximum discharge power (W), Highest power the battery system can discharge with. The optimizer plans with discharging up to this power. Smart mode assumes the battery supplies at most this power to vehicle charging. (optional)
      watchdog: 60s # Watchdog, optional
params:
