template: whatwatt-go
product:
  identifier: whatwatt-go
  brand: whatwatt
  description: Go
description: |
  Requires an active Plus license or higher and access to the local REST API.
  The device and evcc clocks must be synchronized.
  Available measurements depend on the connected meter.

render:
  - usage: grid
    default: |
      type: template
      template: whatwatt-go
      usage: grid
      host: 192.0.2.2 # IP address or hostname
    advanced: |
      type: template
      template: whatwatt-go
      usage: grid
      host: 192.0.2.2 # IP address or hostname
      password: # Password, Optional whatwatt web interface password. Requires firmware with HTTP Digest authentication. (optional)
      cache: 1s # Cache, Time interval for data refresh (optional)
params:
  - name: host
    example: 192.0.2.2
    default:
    choice: []
    unit:
    description: IP address or hostname
    help:
    advanced: false
    optional: false
  - name: password
    example:
    default:
    choice: []
    unit:
    description: Password
    help: Optional whatwatt web interface password. Requires firmware with HTTP Digest authentication.
    advanced: true
    optional: true
  - name: cache
    example: 5m
    default: 1s
    choice: []
    unit:
    description: Cache
    help: Time interval for data refresh
    advanced: true
    optional: true