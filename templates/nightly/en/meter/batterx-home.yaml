template: batterX
product:
  identifier: batterx-home
  brand: batterX
  description: Home
capabilities: ["battery-control"]
render:
  - usage: grid
    default: |
      type: template
      template: batterX
      usage: grid
      host: 192.0.2.2 # IP address or hostname
      port: 80 # Port, optional
      externalpv: true # Needed when a second solar inverter is connected., This parameter is needed when the BatterX station is connected to another solar inverter. The total produced solar power can so be reported through one system. Further auxilary solar inverters do not need to be connected to evcc. (optional)
    advanced: |
      type: template
      template: batterX
      usage: grid
      host: 192.0.2.2 # IP address or hostname
      port: 80 # Port, optional
      externalpv: true # Needed when a second solar inverter is connected., This parameter is needed when the BatterX station is connected to another solar inverter. The total produced solar power can so be reported through one system. Further auxilary solar inverters do not need to be connected to evcc. (optional)
  - usage: pv
    default: |
      type: template
      template: batterX
      usage: pv
      host: 192.0.2.2 # IP address or hostname
      port: 80 # Port, optional
      externalpv: true # Needed when a second solar inverter is connected., This parameter is needed when the BatterX station is connected to another solar inverter. The total produced solar power can so be reported through one system. Further auxilary solar inverters do not need to be connected to evcc. (optional)
    advanced: |
      type: template
      template: batterX
      usage: pv
      host: 192.0.2.2 # IP address or hostname
      port: 80 # Port, optional
      externalpv: true # Needed when a second solar inverter is connected., This parameter is needed when the BatterX station is connected to another solar inverter. The total produced solar power can so be reported through one system. Further auxilary solar inverters do not need to be connected to evcc. (optional)
  - usage: battery
    default: |
      type: template
      template: batterX
      usage: battery
      host: 192.0.2.2 # IP address or hostname
      port: 80 # Port, optional
      externalpv: true # Needed when a second solar inverter is connected., This parameter is needed when the BatterX station is connected to another solar inverter. The total produced solar power can so be reported through one system. Further auxilary solar inverters do not need to be connected to evcc. (optional)
      capacity: 50 # Battery capacity (kWh), optional
      minsoc: 0 # Minimum charge (%), Lower limit as configured on the battery system. Used by optimizer. (optional)
      maxsoc: 100 # Maximum charge (%), Upper limit as configured on the battery system. Used by optimizer and, on some devices, for grid charging. (optional)
    advanced: |
      type: template
      template: batterX
      usage: battery
      host: 192.0.2.2 # IP address or hostname
      port: 80 # Port, optional
      externalpv: true # Needed when a second solar inverter is connected., This parameter is needed when the BatterX station is connected to another solar inverter. The total produced solar power can so be reported through one system. Further auxilary solar inverters do not need to be connected to evcc. (optional)
      capacity: 50 # Battery capacity (kWh), optional
      minsoc: 0 # Minimum charge (%), Lower limit as configured on the battery system. Used by optimizer. (optional)
      maxsoc: 100 # Maximum charge (%), Upper limit as configured on the battery system. Used by optimizer and, on some devices, for grid charging. (optional)
      maxchargepower: # Maximum charge power (W), Highest power the battery system can charge with. The optimizer plans with charging up to this power. Some devices also use it as grid charging power. (optional)
      maxdischargepower: # Maximum discharge power (W), Highest power the battery system can discharge with. The optimizer plans with discharging up to this power. Smart mode assumes the battery supplies at most this power to vehicle charging. (optional)
params:
  - name: host
    example: 192.0.2.2
    default:
    choice: []
    unit:
    description: IP address or hostname
    help:
    advanced: false
    optional: false
  - name: port
    example:
    default: 80
    choice: []
    unit:
    description: Port
    help:
    advanced: false
    optional: true
  - name: externalpv
    example:
    default: true
    choice: []
    unit:
    description: Needed when a second solar inverter is connected.
    help: This parameter is needed when the BatterX station is connected to another solar inverter. The total produced solar power can so be reported through one system. Further auxilary solar inverters do not need to be connected to evcc.
    advanced: false
    optional: true
  - name: capacity
    example: 50
    default:
    choice: []
    unit: kWh
    description: Battery capacity
    help:
    advanced: false
    optional: true
  - name: minsoc
    example: 25
    default: 0
    choice: []
    unit: '%'
    description: Minimum charge
    help: Lower limit as configured on the battery system. Used by optimizer.
    advanced: false
    optional: true
  - name: maxsoc
    example: 95
    default: 100
    choice: []
    unit: '%'
    description: Maximum charge
    help: Upper limit as configured on the battery system. Used by optimizer and, on some devices, for grid charging.
    advanced: false
    optional: true
  - name: maxchargepower
    example:
    default:
    choice: []
    unit: W
    description: Maximum charge power
    help: Highest power the battery system can charge with. The optimizer plans with charging up to this power. Some devices also use it as grid charging power.
    advanced: true
    optional: true
  - name: maxdischargepower
    example:
    default:
    choice: []
    unit: W
    description: Maximum discharge power
    help: Highest power the battery system can discharge with. The optimizer plans with discharging up to this power. Smart mode assumes the battery supplies at most this power to vehicle charging.
    advanced: true
    optional: true