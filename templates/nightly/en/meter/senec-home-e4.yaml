template: senec-connect
product:
  identifier: senec-home-e4
  brand: SENEC
  description: .Home E4
description: |
  Cloud connection via the SENEC.Connect API. A subscription key from the SENEC developer portal is required. Access is read-only, battery control is not possible.
render:
  - usage: grid
    default: |
      type: template
      template: senec-connect
      usage: grid
      token: # Subscription key, Subscription key from the SENEC developer portal (sent as header `Ocp-Apim-Subscription-Key`).
    advanced: |
      type: template
      template: senec-connect
      usage: grid
      token: # Subscription key, Subscription key from the SENEC developer portal (sent as header `Ocp-Apim-Subscription-Key`).
      serial: # Serial, Only required if multiple systems are registered in the account. Serial number (e.g. `v4-00014176`) or system ID (e.g. `P4H1-01GU14324-0105-FD`). (optional)
  - usage: pv
    default: |
      type: template
      template: senec-connect
      usage: pv
      token: # Subscription key, Subscription key from the SENEC developer portal (sent as header `Ocp-Apim-Subscription-Key`).
    advanced: |
      type: template
      template: senec-connect
      usage: pv
      token: # Subscription key, Subscription key from the SENEC developer portal (sent as header `Ocp-Apim-Subscription-Key`).
      serial: # Serial, Only required if multiple systems are registered in the account. Serial number (e.g. `v4-00014176`) or system ID (e.g. `P4H1-01GU14324-0105-FD`). (optional)
      maxacpower: 0 # Maximum AC power of the hybrid inverter (W), optional
  - usage: battery
    default: |
      type: template
      template: senec-connect
      usage: battery
      token: # Subscription key, Subscription key from the SENEC developer portal (sent as header `Ocp-Apim-Subscription-Key`).
      minsoc: 0 # Minimum charge (%), Lower limit as configured on the battery system. Used by optimizer. (optional)
      maxsoc: 100 # Maximum charge (%), Upper limit as configured on the battery system. Used by optimizer and for grid charging. (optional)
    advanced: |
      type: template
      template: senec-connect
      usage: battery
      token: # Subscription key, Subscription key from the SENEC developer portal (sent as header `Ocp-Apim-Subscription-Key`).
      minsoc: 0 # Minimum charge (%), Lower limit as configured on the battery system. Used by optimizer. (optional)
      maxsoc: 100 # Maximum charge (%), Upper limit as configured on the battery system. Used by optimizer and for grid charging. (optional)
      serial: # Serial, Only required if multiple systems are registered in the account. Serial number (e.g. `v4-00014176`) or system ID (e.g. `P4H1-01GU14324-0105-FD`). (optional)
params:
  - name: token
    example:
    default:
    choice: []
    unit:
    description: Subscription key
    help: Subscription key from the SENEC developer portal (sent as header `Ocp-Apim-Subscription-Key`).
    advanced: false
    optional: false
  - name: minsoc
    example: 25
    default: 0
    choice: []
    unit: '%'
    description: Minimum charge
    help: Lower limit as configured on the battery system. Used by optimizer.
    advanced: false
    optional: true
  - name: maxsoc
    example: 95
    default: 100
    choice: []
    unit: '%'
    description: Maximum charge
    help: Upper limit as configured on the battery system. Used by optimizer and for grid charging.
    advanced: false
    optional: true
  - name: serial
    example:
    default:
    choice: []
    unit:
    description: Serial
    help: Only required if multiple systems are registered in the account. Serial number (e.g. `v4-00014176`) or system ID (e.g. `P4H1-01GU14324-0105-FD`).
    advanced: true
    optional: true
  - name: maxacpower
    example: 5000
    default: 0
    choice: []
    unit: W
    description: Maximum AC power of the hybrid inverter
    help:
    advanced: true
    optional: true