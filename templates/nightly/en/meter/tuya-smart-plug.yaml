template: tuya
product:
  identifier: tuya-smart-plug
  brand: Tuya
  description: Smart Plug
  group: Switchable sockets
description: |
  Local connection via the Tuya protocol for plugs with energy monitoring (apps: "Smart Life", "Tuya").
  Device ID and local key must be retrieved once, e.g. using `tinytuya wizard`, which requires an account on the Tuya IoT platform. No cloud access is needed during operation. The device accepts only one local connection at a time, other local integrations (e.g. LocalTuya, Tuya Local) must be disabled.

render:
  - usage: pv
    default: |
      type: template
      template: tuya
      usage: pv
      host: 192.0.2.2 # IP address or hostname
      id: # Device ID
      localkey: # Local Key
  - usage: charge
    default: |
      type: template
      template: tuya
      usage: charge
      host: 192.0.2.2 # IP address or hostname
      id: # Device ID
      localkey: # Local Key
params:
  - name: host
    example: 192.0.2.2
    default:
    choice: []
    unit:
    description: IP address or hostname
    help:
    advanced: false
    optional: false
  - name: id
    example:
    default:
    choice: []
    unit:
    description: Device ID
    help:
    advanced: false
    optional: false
  - name: localkey
    example:
    default:
    choice: []
    unit:
    description: Local Key
    help:
    advanced: false
    optional: false