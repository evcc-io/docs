template: sunenergyxt-500
product:
  identifier: sunenergyxt-sunenergyxt-500-500-pro
  brand: SunEnergyXT
  description: SunEnergyXT 500 / 500 PRO
capabilities: ["battery-control"]
description: |
  The battery's local mode must be enabled in the manufacturer's app.
  Furthermore, the device's IP address must be set to a fixed, permanent IP address in the router.
  An external meter (e.g., Shelly) measuring the grid connection point must be connected to the battery via the manufacturer's app.
  It is required for the `grid` usage, and also for the `battery` usage, because the normal battery mode enables the device's
  zero feed-in regulation, which reads this meter.

caveats:
  - description: |
      Currently, each head storage must be individually added in EVCC.
      Connecting multiple head storages into one system has been announced by the manufacturer but is not yet implemented on the software side.

  - description: |
      `maxacpower` and `maxdischargepower` are derived from the selected `model` when left empty.
      An explicitly configured value takes precedence and is not clamped to the model limit.

render:
  - usage: grid
    default: |
      type: template
      template: sunenergyxt-500
      usage: grid
      model: # Model, `standard` for the SunEnergyXT 500, `pro` for the SunEnergyXT 500 PRO. Determines the maximum AC and discharge power (800 W resp. 2400 W). [standard, pro]
      host: 192.0.2.2 # IP address or hostname
    advanced: |
      type: template
      template: sunenergyxt-500
      usage: grid
      model: # Model, `standard` for the SunEnergyXT 500, `pro` for the SunEnergyXT 500 PRO. Determines the maximum AC and discharge power (800 W resp. 2400 W). [standard, pro]
      host: 192.0.2.2 # IP address or hostname
      cache: 2s # Cache, Time interval for data refresh (optional)
      timeout: 10s # Timeout, optional
  - usage: pv
    default: |
      type: template
      template: sunenergyxt-500
      usage: pv
      model: # Model, `standard` for the SunEnergyXT 500, `pro` for the SunEnergyXT 500 PRO. Determines the maximum AC and discharge power (800 W resp. 2400 W). [standard, pro]
      host: 192.0.2.2 # IP address or hostname
    advanced: |
      type: template
      template: sunenergyxt-500
      usage: pv
      model: # Model, `standard` for the SunEnergyXT 500, `pro` for the SunEnergyXT 500 PRO. Determines the maximum AC and discharge power (800 W resp. 2400 W). [standard, pro]
      host: 192.0.2.2 # IP address or hostname
      maxacpower: 0 # Maximum AC power of the hybrid inverter (W), optional
      cache: 2s # Cache, Time interval for data refresh (optional)
      timeout: 10s # Timeout, optional
  - usage: battery
    default: |
      type: template
      template: sunenergyxt-500
      usage: battery
      model: # Model, `standard` for the SunEnergyXT 500, `pro` for the SunEnergyXT 500 PRO. Determines the maximum AC and discharge power (800 W resp. 2400 W). [standard, pro]
      host: 192.0.2.2 # IP address or hostname
      capacity: 5 # Battery capacity (kWh), Total storage capacity: head unit 5 kWh, each extension pack adds 5 kWh. So 5 (head unit only), 10 (+1 extension) or 15 (+2 extensions). The number of detected battery packs is reported in the `ON` field of `/read`. (optional)
      minsoc: 25 # Minimum charge (%), Lower limit as configured on the battery system. Used by optimizer. (optional)
      maxsoc: 95 # Maximum charge (%), Upper limit as configured on the battery system. Used by optimizer and for grid charging. (optional)
    advanced: |
      type: template
      template: sunenergyxt-500
      usage: battery
      model: # Model, `standard` for the SunEnergyXT 500, `pro` for the SunEnergyXT 500 PRO. Determines the maximum AC and discharge power (800 W resp. 2400 W). [standard, pro]
      host: 192.0.2.2 # IP address or hostname
      capacity: 5 # Battery capacity (kWh), Total storage capacity: head unit 5 kWh, each extension pack adds 5 kWh. So 5 (head unit only), 10 (+1 extension) or 15 (+2 extensions). The number of detected battery packs is reported in the `ON` field of `/read`. (optional)
      minsoc: 25 # Minimum charge (%), Lower limit as configured on the battery system. Used by optimizer. (optional)
      maxsoc: 95 # Maximum charge (%), Upper limit as configured on the battery system. Used by optimizer and for grid charging. (optional)
      maxchargepower: 2400 # Maximum charge power (W), For forced charging of the battery. (optional)
      maxdischargepower: # Maximum discharge power (W), Maximum discharge power of the storage. (optional)
      cache: 2s # Cache, Time interval for data refresh (optional)
      timeout: 10s # Timeout, optional
