template: fnn-modbus
product:
  identifier: wago-750-352
  brand: WAGO
  description: 750-352
description: |
  Connect the relay contacts of the control box to the digital inputs of the module. The module must provide the inputs as discrete inputs (function code 02), a closed contact reads as active.
caveats:
  - description: |
      Inputs are counted across all digital input modules in slot order. Example, with a 4-channel module before an 8-channel module, the first input of the second module is number 5.
render:
  - default: |
      type: template
      template: fnn-modbus

      # Modbus TCP
      modbus: tcpip
      id: 1
      host:  # Hostname
      port: 502 # Port
      maxconsumptionpower: # Guaranteed minimum power (Pmin) (W), Power limit applied to the root circuit while the limit is active.
      w4input: 1 # W4 input, Digital input number for the W4 signal (Dimmer for controllable loads), counting from 1 (first input = 1)
      w3input: 2 # W3 input, Digital input number for the W3 signal (Zero export, 0%), counting from 1 (first input = 1)
      productionnominalmax: # Installed generator power (Wp), Rated generator/module power of the installation (reference value according to § 9 EEG). (optional)
      s1input: 3 # S1 input, Digital input number for the S1 signal (60% export power limit), counting from 1 (first input = 1) (optional)
      s2input: 4 # S2 input, Digital input number for the S2 signal (30% export power limit), counting from 1 (first input = 1) (optional)
params:
  - name: modbus
    example:
    default:
    choice: ['tcpip']
    unit:
    description: Modbus Type
    help:
    advanced: false
    optional: false
  - name: maxconsumptionpower
    example:
    default:
    choice: []
    unit: W
    description: Guaranteed minimum power (Pmin)
    help: Power limit applied to the root circuit while the limit is active.
    advanced: false
    optional: false
  - name: w4input
    example:
    default: 1
    choice: []
    unit:
    description: W4 input
    help: Digital input number for the W4 signal (Dimmer for controllable loads), counting from 1 (first input = 1)
    advanced: false
    optional: false
  - name: w3input
    example:
    default: 2
    choice: []
    unit:
    description: W3 input
    help: Digital input number for the W3 signal (Zero export, 0%), counting from 1 (first input = 1)
    advanced: false
    optional: false
  - name: productionnominalmax
    example:
    default:
    choice: []
    unit: Wp
    description: Installed generator power
    help: Rated generator/module power of the installation (reference value according to § 9 EEG).
    advanced: false
    optional: true
  - name: s1input
    example: 3
    default:
    choice: []
    unit:
    description: S1 input
    help: Digital input number for the S1 signal (60% export power limit), counting from 1 (first input = 1)
    advanced: false
    optional: true
  - name: s2input
    example: 4
    default:
    choice: []
    unit:
    description: S2 input
    help: Digital input number for the S2 signal (30% export power limit), counting from 1 (first input = 1)
    advanced: false
    optional: true
modbus:
  delay:
  host:
  id: 1
  modbus: tcpip
  port: 502
  tcpip: true
  timeout: