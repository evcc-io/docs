template: fnn-gpio
product:
  identifier: fnn-steuerbox-via-gpio-ss-14a-enwg-ss-9-eeg
  description: FNN-Steuerbox via GPIO (§ 14a EnWG, § 9 EEG)
render:
  - default: |
      type: template
      template: fnn-gpio
      maxconsumptionpower: # Guaranteed minimum power (Pmin) (W), Power limit applied to the root circuit while the limit is active.
      w4pin: # W4 GPIO pin, Input pin for the W4 signal (Dimmer for controllable loads)
      w3pin: # W3 GPIO pin, Input pin for the W3 signal (Zero export, 0%)
      productionnominalmax: # Installed generator power (Wp), Rated generator/module power of the installation (reference value according to § 9 EEG). (optional)
      s1pin: # S1 GPIO pin, Input pin for the S1 signal (60% export power limit) (optional)
      s2pin: # S2 GPIO pin, Input pin for the S2 signal (30% export power limit) (optional)
    advanced: |
      type: template
      template: fnn-gpio
      maxconsumptionpower: # Guaranteed minimum power (Pmin) (W), Power limit applied to the root circuit while the limit is active.
      w4pin: # W4 GPIO pin, Input pin for the W4 signal (Dimmer for controllable loads)
      w3pin: # W3 GPIO pin, Input pin for the W3 signal (Zero export, 0%)
      productionnominalmax: # Installed generator power (Wp), Rated generator/module power of the installation (reference value according to § 9 EEG). (optional)
      s1pin: # S1 GPIO pin, Input pin for the S1 signal (60% export power limit) (optional)
      s2pin: # S2 GPIO pin, Input pin for the S2 signal (30% export power limit) (optional)
      activelow: # Inputs active low, Signals are active when the input is pulled to ground, e.g. by a relay contact switching to GND. (optional)
      bias: pull-up # Input bias, Internal pull resistor of the inputs. Determines the input level while the contact is open. [pull-up, pull-down, disabled, as-is] (optional)
params:
  - name: maxconsumptionpower
    example:
    default:
    choice: []
    unit: W
    description: Guaranteed minimum power (Pmin)
    help: Power limit applied to the root circuit while the limit is active.
    advanced: false
    optional: false
  - name: w4pin
    example:
    default:
    choice: []
    unit:
    description: W4 GPIO pin
    help: Input pin for the W4 signal (Dimmer for controllable loads)
    advanced: false
    optional: false
  - name: w3pin
    example:
    default:
    choice: []
    unit:
    description: W3 GPIO pin
    help: Input pin for the W3 signal (Zero export, 0%)
    advanced: false
    optional: false
  - name: productionnominalmax
    example:
    default:
    choice: []
    unit: Wp
    description: Installed generator power
    help: Rated generator/module power of the installation (reference value according to § 9 EEG).
    advanced: false
    optional: true
  - name: s1pin
    example:
    default:
    choice: []
    unit:
    description: S1 GPIO pin
    help: Input pin for the S1 signal (60% export power limit)
    advanced: false
    optional: true
  - name: s2pin
    example:
    default:
    choice: []
    unit:
    description: S2 GPIO pin
    help: Input pin for the S2 signal (30% export power limit)
    advanced: false
    optional: true
  - name: activelow
    example:
    default:
    choice: []
    unit:
    description: Inputs active low
    help: Signals are active when the input is pulled to ground, e.g. by a relay contact switching to GND.
    advanced: true
    optional: true
  - name: bias
    example:
    default: pull-up
    choice: ['pull-up', 'pull-down', 'disabled', 'as-is']
    unit:
    description: Input bias
    help: Internal pull resistor of the inputs. Determines the input level while the contact is open.
    advanced: true
    optional: true