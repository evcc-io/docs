template: huawei-sun2000-sdongle
product:
  identifier: huawei-sun2000-and-smart-dongle
  brand: Huawei
  description: SUN2000 & Smart Dongle
description: |
  Curtailment limits feed-in power to the desired percentage of the maximum AC power of the connected inverters. This requires a meter (Smart Power Sensor DDSU/DTSU666 or SmartPS) to be installed at the feed-in point.

  In case a Huawei SmartAssistant (EMMA) is employed, the corresponding EMMA feed-in limitation device must be used.

render:
  - default: |
      type: template
      template: huawei-sun2000-sdongle

      # RS485 via adapter (Modbus RTU)
      modbus: rs485serial
      id: 1
      device: /dev/ttyUSB0 # USB-RS485 Adapter Adresse
      baudrate: 9600 # Prüfe die Geräteeinstellungen, typische Werte sind 9600, 19200, 38400, 57600, 115200
      comset: "8N1" # Kommunikationsparameter für den Adapter
      timeout: 5s # optional

      # RS485 via TCP/IP (Modbus RTU)
      modbus: rs485tcpip
      id: 1
      host:  # Hostname
      port: 502 # Port
      timeout: 5s # optional

      # Modbus TCP
      modbus: tcpip
      id: 1
      host:  # Hostname
      port: 502 # Port
      timeout: 5s # optional
params:
  - name: modbus
    example:
    default:
    choice: ['rs485', 'tcpip']
    unit:
    description: Modbus Type
    help:
    advanced: false
    optional: false
modbus:
  baudrate: 9600
  comset: 8N1
  delay:
  device: /dev/ttyUSB0
  host:
  id: 1
  port: 502
  rs485serial: true
  rs485tcpip: true
  tcpip: true
  timeout: 5s