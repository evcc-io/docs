template: kaco-nh3
product:
  identifier: kaco-blueplanet-hybrid-nh3
  brand: KACO
  description: blueplanet hybrid NH3
capabilities: ["curtail"]
requirements: ["skiptest"]
description: |
  For KACO blueplanet Hybrid NH3 with AI dongle/Wi-Fi stick. Modbus TCP must be reachable at the stick's IP address (port 502, device ID 3).
  Curtailment uses the inverter's SunSpec controls to limit active power to the requested percentage.

render:
  - default: |
      type: template
      template: kaco-nh3

      # Modbus TCP
      modbus: tcpip
      id: 3
      host:  # Hostname
      port: 502 # Port
params:
  - name: modbus
    example:
    default:
    choice: ['tcpip']
    unit:
    description: Modbus Type
    help:
    advanced: false
    optional: false
modbus:
  delay:
  host:
  id: 3
  modbus: tcpip
  port: 502
  tcpip: true
  timeout: