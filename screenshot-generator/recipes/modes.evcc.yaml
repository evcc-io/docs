interval: 0.1s

site:
  title: Home
  meters:
    grid: grid
    pv: pv

meters:
  - name: grid
    type: custom
    power:
      source: js
      script: |
        -3400
  - name: pv
    type: custom
    power:
      source: js
      script: |
        4500
  - name: heatpump_meter
    type: custom
    power:
      source: js
      script: |
        0
  - name: plug_meter
    type: custom
    power:
      source: js
      script: |
        0

loadpoints:
  - title: Heat pump
    charger: heatpump
    meter: heatpump_meter
    mode: smart
  - title: E-Bike
    charger: plug
    meter: plug_meter
    mode: smart

chargers:
  - name: heatpump
    type: custom
    features: ["continuous", "heating", "integrateddevice"]
    enable:
      source: js
      script:
    enabled:
      source: js
      script: |
        false
    status:
      source: js
      script: |
        "B"
    maxcurrent:
      source: js
      script: |
        16
    soc:
      source: js
      script: |
        48
  - name: plug
    type: custom
    features: ["switchdevice", "integrateddevice"]
    enable:
      source: js
      script:
    enabled:
      source: js
      script: |
        false
    status:
      source: js
      script: |
        "B"
    maxcurrent:
      source: js
      script: |
        16
