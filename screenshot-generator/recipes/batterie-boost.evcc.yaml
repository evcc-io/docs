# overrides basics.evcc.yaml meters: home battery at 75% for a well-filled boost button
meters:
  - name: grid
    type: custom
    power:
      source: js
      script: |
        -3400
  - name: pv
    type: custom
    power:
      source: js
      script: |
        4500
  - name: charger_meter1
    type: custom
    power:
      source: js
      script: |
        0
  - name: charger_meter2
    type: custom
    power:
      source: js
      script: |
        0
  - name: battery
    type: custom
    power:
      source: js
      script: |
        0
    capacity: 13.8
    soc:
      source: js
      script: |
        75
    batterymode:
      source: js
      vm: shared
      script: |
        1
